    return `<button type="button" class="ret-btn${isLsr ? " lsr" : ""}" data-ret="${i}" aria-pressed="${i === revIdx}">${isLsr ? `${esc(tDict.lsrTag)} ` : ""}${esc(rDep)} → ${esc(rArr)} (${esc(fmtDur(rStay))})</button>`;
  }).join("");

  const shortStayWarn = (h.hasGpx && h.walkMin && stayMin > 0 && stayMin < Number(h.walkMin))
    ? `<div class="chips" style="margin-top:6px"><span class="chip warn">${esc(tDict.shortStayWarn(fmtDur(h.walkMin)))}</span></div>`
    : "";

  const lsrDep = lsr?.dep || revDep;
  const lsrArr = lsr?.arr || arr;

  const fwdStepsHtml = fwd.map((s, i) => renderSegmentStep(s, i, fwd, 0)).join("");
  const revStepsHtml = rev.map((s, i) => renderSegmentStep(s, i, rev, fwd.length)).join("");

  const sunTxt = tourText("sun", t);
  const tipsTxt = tourText("tips", t);

  const loopFlowTxt = (destStop.name && endStop.name && destStop.name !== endStop.name)
    ? `${state.lang === "en" ? "Closed loop" : "Rundkurs"}: ${bInfo.name} → ${destStop.name} → 🥾 → ${endStop.name} → ${bInfo.name}`
    : `${state.lang === "en" ? "Closed loop" : "Rundkurs"}: ${bInfo.name} → ${destStop.name || title} → 🥾 → ${bInfo.name}`;

  const gpxLabel = NATIVE ? tDict.gpxNative : tDict.gpxDownload;
  const mapyLabel = hasTrack ? tDict.mapyRoute : tDict.mapyDest;

  $("#detail").innerHTML = `
    <div class="hero">
      <img class="hero-img" src="${esc(imgSrc)}" alt="${esc(title)}" decoding="async">
      ${creditHTML(t)}
      <h2>${esc(title)}</h2>
      <p>${esc(sub)}</p>
      <div class="chips">${metaChips.join("")}</div>
      <div class="actions primary-actions">
        <button type="button" class="act${hasTrack && NATIVE ? " primary" : ""}" id="gpxBtn" data-a="gpx">${esc(gpxLabel)}</button>
        <a class="act${hasTrack ? " primary" : ""}" href="${esc(mapyUrl)}" target="_blank" rel="noopener" data-app="mapy">${esc(mapyLabel)}</a>
        <a class="act${hasTrack ? "" : " primary"}" href="${esc(dbPrimaryUrl)}" target="_blank" rel="noopener" data-app="db">${esc(tDict.dbPrimary)}</a>
      </div>
      <details class="more-apps">
        <summary>${esc(tDict.moreApps)}</summary>
        <div class="actions">
          <a class="act" href="${esc(mvvAppUrl)}" data-app="mvv">${esc(tDict.mvvAppBtn)}</a>
          <a class="act" href="${esc(nvvAppUrl)}" data-app="nvv">${esc(tDict.nvvAppBtn)}</a>
          <a class="act" href="${esc(myVrnUrl)}" data-app="myvrn">${esc(tDict.myVrnBtn)}</a>
          <a class="act" href="${esc(naviUrl)}" data-app="geo">${esc(tDict.naviBtn)}</a>
          <a class="act" href="${esc(dbWebUrl)}" target="_blank" rel="noopener">${esc(tDict.dbBtn)}</a>
          <a class="act" href="${esc(mvvWebUrl)}" target="_blank" rel="noopener">${esc(tDict.mvvWebBtn)}</a>
          <a class="act" href="${esc(gmapsMainUrl)}" target="_blank" rel="noopener">${esc(tDict.gmapsBtn)}</a>
        </div>
        <p class="app-hint">${esc(tDict.appHint)}</p>
      </details>
    </div>

    ${elevProfileHTML(t)}

    ${fallback ? `<div class="box"><span class="chip warn">${esc(tDict.unroutableNotice(reason))}</span></div>` : ""}

    <div class="box">
      <h4>${esc(tDict.windowsTitle)} · ${esc(tDict.dayLong[state.day])}</h4>
      ${winsHtml}
      <h4 style="margin-top:10px">⏱ ${esc(tDict.stayChooserTitle)}</h4>
      <div class="stay-row">${stayBtnsHtml}</div>
      ${revsHtml ? `<h4 style="margin-top:10px">🔄 ${esc(tDict.returnWindowsTitle)}</h4><div class="stay-row">${revsHtml}</div>` : ""}
      ${shortStayWarn}
      <div class="chips" style="margin-top:8px">
        <span class="chip ok">🛡️ ${esc(tDict.lastSafeReturn(lsrDep, lsrArr))}</span>
      </div>
    </div>

    <div class="box">
      <h4>${esc(tDict.outboundTitle)} (${esc(dep)} → ${esc(fwdArr)})</h4>
      <div class="tl">${fwdStepsHtml}</div>
    </div>

    <div class="box">
      <h4>🥾 ${esc(tDict.hikeStayTitle)} (${esc(fmtDur(stayMin))})</h4>
      <p style="margin:0 0 4px;font-size:12.5px;color:var(--text-2)">
        ${h.hasGpx ? `${kmStr} km · ${hmUp} hm (${tDict.hikeLabel} ${fmtDur(h.walkMin || 180)} + ≥30 Min. Puffer)` : `${tDict.walkLabel} / Aufenthalt vor Ort: ${fmtDur(stayMin)}`}
      </p>
      <p style="margin:0;font-size:12px;color:var(--text-2)">🔄 ${esc(loopFlowTxt)}</p>
    </div>

    <div class="box">
      <h4>${esc(tDict.returnTitle)} (${esc(revDep)} → ${esc(arr)})</h4>
      <div class="tl">${revStepsHtml}</div>
    </div>

    ${(sunTxt || tipsTxt) ? `<div class="box">
      ${sunTxt ? `<p style="margin:0 0 6px;font-size:12.5px">☀️ ${esc(sunTxt)}</p>` : ""}
      ${tipsTxt ? `<p style="margin:0;font-size:12.5px">💡 ${esc(tipsTxt)}</p>` : ""}
    </div>` : ""}
  `;
}

$("#detail").addEventListener("pointermove", onElevPointer);
$("#detail").addEventListener("pointerdown", onElevPointer);

$("#detail").addEventListener("click", e => {
  const t = BY_ID[state.sel];
  if (!t) return;
  const gpxBtn = e.target.closest("[data-a='gpx'], #gpxBtn");
  if (gpxBtn) {
    downloadGPX(t);
    return;
  }
  const winBtn = e.target.closest(".win-btn[data-win]");
  if (winBtn) {
    state.winIdx = parseInt(winBtn.dataset.win, 10) || 0;
    state.revIdx = null;
    renderDetail(t);
    drawSingle(t);
    return;
  }
  const stayBtn = e.target.closest(".stay-btn[data-stay]");
  if (stayBtn) {
    const v = stayBtn.dataset.stay;
    state.revIdx = null;
    state.stayTargetMin = v === "" ? null : (v === "max" ? "max" : parseInt(v, 10));
    store.set("stayTargetMin", state.stayTargetMin);
    renderPills();
    renderDetail(t);
    drawSingle(t);
    return;
  }
  const retBtn = e.target.closest(".ret-btn[data-ret]");
  if (retBtn) {
    state.revIdx = parseInt(retBtn.dataset.ret, 10) || 0;
    renderDetail(t);
    drawSingle(t);
    return;
  }
  if (e.target.closest("a, summary, details, button")) return;
  const st = e.target.closest(".st[data-i]");
  if (st) focusStep(parseInt(st.dataset.i, 10) || 0);
});

/* ---------- Navigation (with history: Android back gesture closes the detail view) ---------- */
let suppressPopUntil = 0;

function openTour(id, opts) {
  const t = BY_ID[id];
  if (!t) return;
  state.sel = id;
  state.winIdx = null;
  state.revIdx = null;
  document.body.classList.add("detail-open");
  renderHeader();
  renderDetail(t);
  drawSingle(t);
  setTimeout(() => { map.invalidateSize(); fitCurrent(); }, 0);
  fitCurrent();
  window.scrollTo({top: 0});
  if (!(opts && opts.fromPop)) {
    try {
      const st = {tour: id};
      const url = "#tour=" + encodeURIComponent(id);
      if (history.state && history.state.tour) history.replaceState(st, "", url);
      else history.pushState(st, "", url);
    } catch (e) {}
  }
}

function closeTour(opts) {
  state.sel = null;
  state.winIdx = null;
  state.revIdx = null;
  document.body.classList.remove("detail-open");
  renderHeader();
  renderList();
  drawOverview();
  setTimeout(() => { map.invalidateSize(); fitCurrent(); }, 0);
  fitCurrent();
  if (!(opts && opts.fromPop)) {
    try {
      if (history.state && history.state.tour) {
        suppressPopUntil = Date.now() + 800;
        history.back();
      }
    } catch (e) {}
  }
}

window.addEventListener("popstate", e => {
  if (Date.now() < suppressPopUntil) { suppressPopUntil = 0; return; }
  const st = e.state;
  if (st && st.tour && BY_ID[st.tour]) openTour(st.tour, {fromPop: true});
  else if (state.sel) closeTour({fromPop: true});
});

$("#backBtn").addEventListener("click", () => closeTour());

/* Called by the native Android app on the system back gesture; returns true if the app handled it. */
window.swHandleBack = function () {
  if ($("#homeModal").classList.contains("show")) { closeHomeModal(); return true; }
  const mw = $("#mapWrap");
  if (mw.classList.contains("full")) { mw.classList.remove("full"); setTimeout(() => map.invalidateSize(), 150); return true; }
  if ($("#layerMenu").classList.contains("show")) { $("#layerMenu").classList.remove("show"); return true; }
  if (state.sel) { closeTour(); return true; }
  if (state.filtersOpen) { state.filtersOpen = false; syncFilterPanel(); return true; }
  return false;
};

/* ---------- Base, Language, Weekday & Filter Events ---------- */
function setBase(newBase, customHome) {
  state.base = newBase === "karlsruhe" ? "karlsruhe" : "jugenheim";
  store.set("base", state.base);
  if (customHome) {
    HOME = customHome;
  } else {
    HOME = {...BASE_DEFAULTS[state.base]};
  }
  store.set("home", HOME);
  state.winIdx = null;
  state.revIdx = null;
  renderHeader();
  if (state.sel && BY_ID[state.sel]) {
    renderDetail(BY_ID[state.sel]);
    drawSingle(BY_ID[state.sel]);
    fitCurrent();
  } else {
    renderList();
    drawOverview();
    fitCurrent();
  }
}

$("#baseJgBtn").addEventListener("click", () => setBase("jugenheim"));
$("#baseKaBtn").addEventListener("click", () => setBase("karlsruhe"));

$("#langBtn").addEventListener("click", () => {
  state.lang = state.lang === "de" ? "en" : "de";
  store.set("lang", state.lang);
  renderHeader();
  renderDays();
  renderPills();
  syncHomeModalLabels();
  if (state.sel && BY_ID[state.sel]) {
    renderDetail(BY_ID[state.sel]);
  } else {
    renderList();
  }
});

$("#daySeg").addEventListener("click", e => {
  const b = e.target.closest("button[data-d]");
  if (!b) return;
  state.day = b.dataset.d;
  store.set("day", state.day);
  state.winIdx = null;
  state.revIdx = null;
  renderDays();
  if (state.sel && BY_ID[state.sel]) {
    renderDetail(BY_ID[state.sel]);
    drawSingle(BY_ID[state.sel]);
  } else {
    renderList();
    drawOverview();
  }
});

$("#pills").addEventListener("click", e => {
  const b = e.target.closest(".pill[data-f]");
  if (!b) return;
  const f = b.dataset.f;
  if (f === "all") {
    state.sourceFilter = null;
    state.regionFilter = null;
    state.loopOnly = false;
    state.eveningSunOnly = false;
    state.feasibleTime = "";
    state.maxRide = null;
    store.set("maxRide", null);
    $("#feasibleTime").value = "";
  } else if (f === "feasible") {
    if (state.feasibleTime) {
      state.feasibleTime = "";
    } else {
      const now = new Date();
      let m = Math.ceil((now.getHours() * 60 + now.getMinutes()) / 15) * 15;
      if (m < 5 * 60 || m > 22 * 60) m = 12 * 60;
      state.feasibleTime = `${String(Math.floor(m / 60) % 24).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
      state.filtersOpen = true;
    }
  } else if (f === "my_tours" || f === "curated") {
    state.sourceFilter = f;
  } else if (["pfaelzerwald", "schwarzwald", "odenwald"].includes(f)) {
    state.regionFilter = f;
  } else if (f === "loop") {
    state.loopOnly = !state.loopOnly;
  } else if (f === "evening_sun") {
    state.eveningSunOnly = !state.eveningSunOnly;
  }
  renderHeader();
  renderPills();
  renderList();
  drawOverview();
});

$("#staySelect").addEventListener("change", e => {
  const v = (e.target.value || "").trim();
  state.revIdx = null;
  state.stayTargetMin = v === "" ? null : (v === "max" ? "max" : parseInt(v, 10));
  store.set("stayTargetMin", state.stayTargetMin);
  syncFilterPanel();
  if (state.sel && BY_ID[state.sel]) {
    renderDetail(BY_ID[state.sel]);
    drawSingle(BY_ID[state.sel]);
  } else {
    renderList();
    drawOverview();
  }
});

$("#filterToggle").addEventListener("click", () => {
  state.filtersOpen = !state.filtersOpen;
  syncFilterPanel();
});

$("#maxRideSelect").addEventListener("change", e => {
  const v = parseInt(e.target.value, 10);
  state.maxRide = Number.isFinite(v) && v > 0 ? v : null;
  store.set("maxRide", state.maxRide);
  renderPills();
  renderList();
  drawOverview();
});

$("#sortSelect").addEventListener("change", e => {
  state.sort = e.target.value || "";
  store.set("sort", state.sort);
  renderPills();
  renderList();
});

function onFeasibleTimeChange(e) {
  state.feasibleTime = (e.target.value || "").trim();
  if (state.feasibleTime) state.filtersOpen = true;
  renderHeader();
  renderPills();
  renderList();
  drawOverview();
}
$("#feasibleTime").addEventListener("input", onFeasibleTimeChange);
$("#feasibleTime").addEventListener("change", onFeasibleTimeChange);

$("#q").addEventListener("input", e => {
  state.q = (e.target.value || "").trim();
  renderList();
  drawOverview();
});
$("#qClear").addEventListener("click", () => {
  $("#q").value = "";
  state.q = "";
  renderList();
  drawOverview();
});

/* ---------- Home Location Modal ---------- */
function syncHomeModalLabels() {
  const tDict = T();
  $("#homeModalTitle").textContent = tDict.homeModalTitle;
  $("#homePresetLabel").textContent = tDict.homePresetLabel;
  $("#homeSearchLabel").textContent = tDict.homeSearchLabel;
  $("#homeSearchBtn").textContent = tDict.homeSearchBtn;
  $("#homeGpsBtn").textContent = tDict.homeGpsBtn;
  $("#homeNameLabel").textContent = tDict.homeNameLabel;
  $("#homeLatLabel").textContent = tDict.homeLatLabel;
  $("#homeLonLabel").textContent = tDict.homeLonLabel;
  $("#saveHomeBtn").textContent = tDict.homeSaveBtn;
  $("#resetHomeBtn").textContent = tDict.homeResetBtn;
  $("#closeHomeModal").textContent = tDict.homeCloseBtn;
}

function renderHomePresets() {
  $("#homePresets").innerHTML = HOME_PRESETS.map(p =>
    `<button type="button" class="home-preset-btn" data-name="${esc(p.name)}" data-lat="${p.lat}" data-lon="${p.lon}" data-base="${p.base}">${esc(p.name)}</button>`
  ).join("");
}

function openHomeModal() {
  syncHomeModalLabels();
  renderHomePresets();
  $("#customHomeName").value = HOME.name || "";
  $("#customHomeLat").value = Number(HOME.lat || 49.753891).toFixed(4);
  $("#customHomeLon").value = Number(HOME.lon || 8.629438).toFixed(4);
  $("#geoResults").innerHTML = "";
  $("#homeModal").classList.add("show");
}

function closeHomeModal() {
  $("#homeModal").classList.remove("show");
}

$("#homeEditBtn").addEventListener("click", openHomeModal);
$("#closeHomeModal").addEventListener("click", closeHomeModal);
$("#homeModal").addEventListener("click", e => {
  if (e.target === $("#homeModal")) closeHomeModal();
});

$("#homePresets").addEventListener("click", e => {
  const b = e.target.closest(".home-preset-btn");
  if (!b) return;
  const name = b.dataset.name;
  const lat = parseFloat(b.dataset.lat);
  const lon = parseFloat(b.dataset.lon);
  const bKey = b.dataset.base || (name.toLowerCase().includes("karlsruhe") ? "karlsruhe" : "jugenheim");
  setBase(bKey, {name, lat, lon});
  closeHomeModal();
});

async function runNominatimSearch() {
  const q = ($("#homeSearchInput").value || "").trim();
  const box = $("#geoResults");
  if (q.length < 2) {
    box.innerHTML = "";
    return;
  }
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=5`);
    if (!r.ok) { box.innerHTML = ""; return; }
    const items = await r.json();
    if (!Array.isArray(items) || !items.length) {
      box.innerHTML = `<div style="font-size:12px;color:var(--muted)">${state.lang === "en" ? "No results found" : "Keine Treffer"}</div>`;
      return;
    }
    box.innerHTML = items.map(it => {
      const nm = it.display_name || it.name || q;
      return `<button type="button" class="geo-item" data-name="${esc(nm)}" data-lat="${it.lat}" data-lon="${it.lon}">${esc(nm)}</button>`;
    }).join("");
  } catch (err) {
    box.innerHTML = "";
  }
}

$("#homeSearchBtn").addEventListener("click", runNominatimSearch);
$("#homeSearchInput").addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); runNominatimSearch(); }
});

$("#geoResults").addEventListener("click", e => {
  const b = e.target.closest(".geo-item[data-lat]");
  if (!b) return;
  const lat = parseFloat(b.dataset.lat);
  const lon = parseFloat(b.dataset.lon);
  const name = b.dataset.name || "Home";
  if (!Number.isNaN(lat) && !Number.isNaN(lon)) {
    HOME = {name, lat, lon};
    store.set("home", HOME);
    renderHeader();
    closeHomeModal();
  }
});

$("#homeGpsBtn").addEventListener("click", () => {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(pos => {
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;
    const name = state.lang === "en" ? `GPS Location (${lat.toFixed(3)}, ${lon.toFixed(3)})` : `GPS-Standort (${lat.toFixed(3)}, ${lon.toFixed(3)})`;
    HOME = {name, lat, lon};
    store.set("home", HOME);
    renderHeader();
    closeHomeModal();
  }, () => {}, {timeout: 5000});
});

$("#saveHomeBtn").addEventListener("click", () => {
  const name = ($("#customHomeName").value || "").trim() || HOME.name;
  const lat = parseFloat($("#customHomeLat").value);
  const lon = parseFloat($("#customHomeLon").value);
  if (Number.isNaN(lat) || Number.isNaN(lon) || lat < 45 || lat > 56 || lon < 4 || lon > 17) {
    toast(state.lang === "en" ? "Invalid coordinates" : "Ungültige Koordinaten");
    return;
  }
  HOME = {name, lat, lon};
  store.set("home", HOME);
  renderHeader();
  closeHomeModal();
});

$("#resetHomeBtn").addEventListener("click", () => {
  HOME = {...BASE_DEFAULTS[state.base]};
  store.set("home", HOME);
  renderHeader();
  closeHomeModal();
});

/* ---------- Boot ---------- */
if (location.search.includes("base=karlsruhe")) {
  state.base = "karlsruhe";
  HOME = {...BASE_DEFAULTS.karlsruhe};
}
if (window.matchMedia && window.matchMedia("(min-width: 960px)").matches) state.filtersOpen = true;
applyTheme();
setLayer(state.layer);
renderHeader();
renderDays();
renderPills();
renderList();
drawOverview();
setTimeout(fitCurrent, 50);
(function bootDeepLink() {
  const m = location.hash.match(/^#tour=([^&]+)/);
  if (!m) return;
  const id = decodeURIComponent(m[1]);
  if (!BY_ID[id]) return;
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  openTour(id);
})();
if (window.matchMedia) {
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  const onScheme = () => { if (!state.theme) applyTheme(); };
  if (mq.addEventListener) mq.addEventListener("change", onScheme);
}
if (NATIVE && typeof NATIVE.contentReady === "function") {
  requestAnimationFrame(() => { try { NATIVE.contentReady(performance.now()); } catch (e) {} });
}
if (!NATIVE && "serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  let hadController = Boolean(navigator.serviceWorker.controller);
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController) { hadController = true; return; }
    toast(T().updateReady, {label: T().reload, action: () => location.reload(), ms: 12000});
  });
}
