<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Südwest-Touren (Jugenheim &amp; Karlsruhe)</title>
<meta name="description" content="Deutschlandticket-Tagestouren &amp; Mapy-Wanderungen ab Jugenheim und Karlsruhe mit Fahrplan, Karte, Höhenprofil und GPX-Export.">
<meta name="theme-color" content="#F3F5F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1513" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f4c5c'/%3E%3Ccircle cx='46' cy='18' r='7' fill='%23fbbf24'/%3E%3Cpath d='M6 48 L22 22 L34 36 L44 24 L58 48 Z' fill='%2315803d'/%3E%3C/svg%3E">
<style>/*FONTS_CSS*/</style>
<style>/*LEAFLET_CSS*/</style>
<style>
:root {
  --bg: #F3F5F1;
  --surface: #FFFFFF;
  --surface-2: #E9EDE6;
  --surface-3: #DDE4D9;
  --text: #13201C;
  --text-2: #3B4F48;
  --muted: #566B63;
  --border: #D1DBD2;
  --primary: #0F4C5C;
  --accent: #0F4C5C;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCECEF;
  --amber: #F59E0B;
  --amber-ink: #13201C;
  --amber-soft: #FEF3C7;
  --reg-pfalz: #C2410C;
  --reg-pfalz-soft: #FFEDD5;
  --reg-odenwald: #15803D;
  --reg-odenwald-soft: #DCFCE7;
  --reg-schwarzwald: #6D28D9;
  --reg-schwarzwald-soft: #EDE9FE;
  --reg-weitere: #0F4C5C;
  --reg-weitere-soft: #DCECEF;
  --reg-ink: #FFFFFF;
  --ok: #15803d;
  --ok-ink: #FFFFFF;
  --ok-soft: #dcfce7;
  --warn: #b45309;
  --warn-soft: #fef3c7;
  --bad: #b91c1c;
  --bad-soft: #fee2e2;
  --sbahn: #15803d;
  --re: #d4373f;
  --rb: #7c3aed;
  --stadtbahn: #b45309;
  --tram: #c2410c;
  --bus: #0369a1;
  --ferry: #0e7490;
  --hike: #15803d;
  --foot: #64748b;
  --shadow: 0 1px 2px rgba(19,32,28,.06), 0 4px 14px rgba(19,32,28,.06);
  --font-sans: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: "Space Grotesk", "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius: 16px;
  --radius-lg: 20px;
  --radius-pill: 999px;
  --map-h: 24vh;
  --nav-h: 58px;
  color-scheme: only light;
}
:root[data-theme="dark"], html.dark {
  --bg: #0D1513;
  --surface: #14201D;
  --surface-2: #1B2B27;
  --surface-3: #233731;
  --text: #ECF2EE;
  --text-2: #B7C7C0;
  --muted: #8DA39A;
  --border: #2A3E38;
  --primary: #4EB8CE;
  --accent: #4EB8CE;
  --accent-ink: #07181D;
  --accent-soft: #16363F;
  --amber: #FBBF24;
  --amber-ink: #13201C;
  --amber-soft: #3A2C0B;
  --reg-pfalz: #FB923C;
  --reg-pfalz-soft: rgba(194, 65, 12, 0.24);
  --reg-odenwald: #4ADE80;
  --reg-odenwald-soft: rgba(21, 128, 61, 0.24);
  --reg-schwarzwald: #A78BFA;
  --reg-schwarzwald-soft: rgba(109, 40, 217, 0.26);
  --reg-weitere: #4EB8CE;
  --reg-weitere-soft: rgba(78, 184, 206, 0.2);
  --reg-ink: #07181D;
  --ok: #4ade80;
  --ok-ink: #07181D;
  --ok-soft: #12321f;
  --warn: #fbbf24;
  --warn-soft: #3a2c0b;
  --bad: #f87171;
  --bad-soft: #3b1414;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.3);
  color-scheme: dark;
}
.detail-open { --map-h: 32vh; }
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  max-width: 100%;
  overflow-x: clip;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.45 var(--font-sans);
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
.brand h1, .card h3, .hero h2, .box h4, .region-head, .modal-head h3 {
  font-family: var(--font-display);
  letter-spacing: -0.015em;
}
.time, .dur, .win-btn, .stay-btn, .ret-btn { font-variant-numeric: tabular-nums; }
a { color: var(--accent); }
.app { max-width: 1280px; margin: 0 auto; width: 100%; overflow-x: clip; }

/* Header */
header.top {
  position: sticky;
  top: 0;
  z-index: 1200;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 6px 10px;
  width: 100%;
  max-width: 100%;
}
.top-row {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.brand { flex: 1; min-width: 120px; display: flex; flex-direction: column; align-items: flex-start; }
.brand h1 {
  font-size: 15px;
  line-height: 1.2;
  margin: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.home-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-2);
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 2px 7px;
  margin-top: 2px;
  cursor: pointer;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.icon-btn {
  height: 34px;
  min-width: 34px;
  padding: 0 8px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  background: var(--surface);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  flex: none;
}
.back-btn { display: none; }
.detail-open .back-btn { display: inline-flex; }

/* Base Switcher & Day Row */
.bar-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  margin-top: 5px;
  flex-wrap: wrap;
}
.base-switch {
  display: inline-flex;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 2px;
  gap: 2px;
  flex: 1;
  min-width: 190px;
}
.base-btn {
  flex: 1;
  border: 0;
  background: transparent;
  padding: 5px 8px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
  cursor: pointer;
  white-space: nowrap;
  text-align: center;
}
.base-btn[aria-pressed="true"] {
  background: var(--accent);
  color: var(--accent-ink);
  box-shadow: var(--shadow);
}
.seg {
  display: inline-flex;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 2px;
  gap: 2px;
}
.seg button {
  border: 0;
  background: transparent;
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  color: var(--text-2);
  cursor: pointer;
  white-space: nowrap;
}
.seg button[aria-pressed="true"] {
  background: var(--surface);
  color: var(--text);
  font-weight: 700;
  box-shadow: var(--shadow);
}

/* Search & Filter Controls */
.controls {
  display: flex;
  flex-direction: column;
  gap: 5px;
  margin-top: 5px;
}
.detail-open .controls { display: none; }
.search-row {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
}
.search {
  flex: 1;
  min-width: 160px;
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 0 10px;
  height: 34px;
}
.search input {
  flex: 1;
  border: 0;
  background: transparent;
  color: var(--text);
  font-size: 13.5px;
  outline: none;
  min-width: 0;
}
.search .clear {
  border: 0;
  background: none;
  color: var(--muted);
  font-size: 16px;
  cursor: pointer;
  padding: 0 4px;
}
.feasible-box {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 2px 6px;
  height: 34px;
  font-size: 11.5px;
}
.feasible-box input[type="time"] {
  border: 0;
  background: transparent;
  color: var(--text);
  font-size: 12px;
  outline: none;
  padding: 0;
}
.pills {
  display: flex;
  gap: 5px;
  overflow-x: auto;
  scrollbar-width: none;
  padding-bottom: 2px;
  max-width: 100%;
}
.pills::-webkit-scrollbar { display: none; }
.pill {
  flex: none;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-2);
  border-radius: var(--radius-pill);
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}
.pill[aria-pressed="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}
.pill[data-f="pfaelzerwald"]::before,
.pill[data-f="odenwald"]::before,
.pill[data-f="schwarzwald"]::before {
  content: "";
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  margin-right: 5px;
  vertical-align: middle;
}
.pill[data-f="pfaelzerwald"]::before { background: var(--reg-pfalz); }
.pill[data-f="odenwald"]::before { background: var(--reg-odenwald); }
.pill[data-f="schwarzwald"]::before { background: var(--reg-schwarzwald); }
.pill[data-f="pfaelzerwald"][aria-pressed="true"] { background: var(--reg-pfalz); border-color: var(--reg-pfalz); color: var(--reg-ink); }
.pill[data-f="odenwald"][aria-pressed="true"] { background: var(--reg-odenwald); border-color: var(--reg-odenwald); color: var(--reg-ink); }
.pill[data-f="schwarzwald"][aria-pressed="true"] { background: var(--reg-schwarzwald); border-color: var(--reg-schwarzwald); color: var(--reg-ink); }
.pill[data-f="pfaelzerwald"][aria-pressed="true"]::before,
.pill[data-f="odenwald"][aria-pressed="true"]::before,
.pill[data-f="schwarzwald"][aria-pressed="true"]::before { background: currentColor; }

/* Layout & Map */
.layout { display: block; width: 100%; max-width: 100%; }
.map-wrap {
  position: relative;
  z-index: 500;
  height: var(--map-h);
  min-height: 224px;
  background: var(--surface-3);
  border-bottom: 1px solid var(--border);
  width: 100%;
}
.map-wrap.mini { height: 95px; min-height: 95px; }
.map-wrap.full {
  position: fixed;
  inset: 0;
  height: 100vh;
  height: 100dvh;
  z-index: 2000;
}
#map { position: absolute; inset: 0; width: 100%; height: 100%; }
.map-tools {
  position: absolute;
  right: 8px;
  top: 8px;
  z-index: 800;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.map-tools .icon-btn {
  height: 30px;
  min-width: 30px;
  padding: 0 7px;
  font-size: 11.5px;
  box-shadow: var(--shadow);
}
.elev-overlay {
  position: absolute;
  left: 8px;
  bottom: 8px;
  z-index: 800;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 4px 8px;
  font-size: 11.5px;
  font-weight: 600;
  box-shadow: var(--shadow);
  max-width: calc(100% - 60px);
}
.layer-menu {
  position: absolute;
  right: 48px;
  top: 8px;
  z-index: 900;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow);
  padding: 5px;
  display: none;
  min-width: 185px;
}
.layer-menu.show { display: block; }
.layer-menu button {
  display: flex;
  width: 100%;
  align-items: center;
  gap: 6px;
  border: 0;
  background: none;
  padding: 6px 8px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  text-align: left;
  font-size: 12.5px;
}
.layer-menu button[aria-pressed="true"] {
  background: var(--accent-soft);
  font-weight: 700;
}

/* Main Content & Cards */
.content {
  padding: 10px 10px calc(82px + env(safe-area-inset-bottom, 0px));
  width: 100%;
  max-width: 100%;
  min-width: 0;
  overflow-x: clip;
}
@media (min-width: 960px) {
  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1.1fr) minmax(360px, 0.9fr);
    align-items: start;
  }
  .map-wrap {
    position: sticky;
    top: var(--top-h, 130px);
    height: calc(100vh - var(--top-h, 130px));
    border-right: 1px solid var(--border);
    border-bottom: 0;
  }
}
.card {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 11px 12px;
  margin: 0 0 9px;
  box-shadow: var(--shadow);
  cursor: pointer;
  overflow: hidden;
  max-width: 100%;
  word-break: break-word;
}
.card h3 {
  margin: 0 0 3px;
  font-size: 15px;
  line-height: 1.25;
}
.card .sub {
  margin: 0;
  color: var(--text-2);
  font-size: 12.5px;
}
.card-thumb-wrap {
  position: relative;
  margin: -11px -12px 9px;
  background: var(--surface-2);
  overflow: hidden;
  border-bottom: 1px solid var(--border);
  height: 150px;
}
.card-thumb {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.card-thumb-badge {
  position: absolute;
  left: 8px;
  bottom: 8px;
  background: rgba(15, 23, 42, 0.78);
  color: #ffffff;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 999px;
  backdrop-filter: blur(4px);
  max-width: calc(100% - 16px);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.stay-select {
  background: var(--surface-2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 4px 9px;
  font-size: 12px;
  font-weight: 600;
  max-width: 100%;
}
.stay-row {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 6px;
}
.stay-btn, .ret-btn {
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text);
  border-radius: var(--radius-sm);
  padding: 5px 9px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
.stay-btn[aria-pressed="true"], .ret-btn[aria-pressed="true"] {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: var(--accent);
}
.region-group {
  margin-bottom: 12px;
  max-width: 100%;
}
.region-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  width: 100%;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 7px 11px;
  margin: 0 0 8px;
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  cursor: pointer;
  text-align: left;
}
.region-group[data-region="pfaelzerwald"] .region-head { border-left: 4px solid var(--reg-pfalz); }
.region-group[data-region="odenwald"] .region-head { border-left: 4px solid var(--reg-odenwald); }
.region-group[data-region="schwarzwald"] .region-head { border-left: 4px solid var(--reg-schwarzwald); }
.region-group[data-region="weitere"] .region-head { border-left: 4px solid var(--reg-weitere); }
.card[data-region="pfaelzerwald"] { border-left: 3px solid var(--reg-pfalz); }
.card[data-region="odenwald"] { border-left: 3px solid var(--reg-odenwald); }
.card[data-region="schwarzwald"] { border-left: 3px solid var(--reg-schwarzwald); }
.card[data-region="weitere"] { border-left: 3px solid var(--reg-weitere); }
.reg-chip[data-region="pfaelzerwald"] { background: var(--reg-pfalz-soft); color: var(--text); font-weight: 600; }
.reg-chip[data-region="odenwald"] { background: var(--reg-odenwald-soft); color: var(--text); font-weight: 600; }
.reg-chip[data-region="schwarzwald"] { background: var(--reg-schwarzwald-soft); color: var(--text); font-weight: 600; }
.reg-chip[data-region="weitere"] { background: var(--reg-weitere-soft); color: var(--text); font-weight: 600; }
.region-head .reg-meta {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  flex: none;
}
.region-head .reg-chev {
  transition: transform .15s ease;
  display: inline-block;
}
.region-group.collapsed .region-head .reg-chev {
  transform: rotate(-90deg);
}
.region-group.collapsed .region-cards {
  display: none;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 7px;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  background: var(--surface-2);
  color: var(--text-2);
  border-radius: 7px;
  padding: 2px 7px;
  font-size: 11.5px;
  max-width: 100%;
  word-break: break-word;
}
.chip.strong { background: var(--accent-soft); color: var(--text); font-weight: 600; }
.chip.ok { background: var(--ok-soft); color: var(--ok); font-weight: 600; }
.chip.warn { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.ret-btn.short, .trip-ret-btn.short { border-style: dashed; border-color: var(--warn); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); font-weight: 600; }

/* Detail View */
.detail { display: none; width: 100%; max-width: 100%; }
.detail-open .detail { display: block; }
.detail-open .list { display: none; }
.hero {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  box-shadow: var(--shadow);
  overflow: hidden;
  max-width: 100%;
  word-break: break-word;
}
.hero-img {
  display: block;
  width: 100%;
  max-width: 100%;
  height: 200px;
  object-fit: cover;
  border-radius: 12px;
  margin-bottom: 6px;
  background: var(--surface-3);
}
.credit {
  font-size: 11px;
  color: var(--muted);
  margin: 0 0 8px;
  line-height: 1.35;
  word-break: break-word;
}
.hero h2 { margin: 4px 0; font-size: 18px; line-height: 1.25; }
.hero p { margin: 0; color: var(--text-2); font-size: 13px; }
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}
.act {
  border: 1px solid var(--border);
  background: var(--surface-2);
  border-radius: var(--radius-md);
  padding: 7px 10px;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  text-decoration: none;
  color: var(--text);
}
.act.primary {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: var(--accent);
}
.box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 11px 12px;
  margin-top: 10px;
  box-shadow: var(--shadow);
  max-width: 100%;
  word-break: break-word;
}
.box h4 { margin: 0 0 6px; font-size: 13.5px; }
.win-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 6px;
}
.win-btn {
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text);
  border-radius: var(--radius-sm);
  padding: 5px 9px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
.win-btn[aria-pressed="true"] {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: var(--accent);
}

/* MVV Beaded Timeline */
.tl {
  position: relative;
  margin-top: 10px;
  padding-left: 18px;
}
.tl::before {
  content: "";
  position: absolute;
  left: 6px;
  top: 6px;
  bottom: 6px;
  width: 2px;
  background: var(--border);
}
.st {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 10px;
  margin-bottom: 8px;
  cursor: pointer;
  max-width: 100%;
  word-break: break-word;
}
.st.flash {
  border-color: var(--amber);
  box-shadow: 0 0 0 2px var(--amber-soft);
  background: var(--accent-soft);
}
.st::before {
  content: "";
  position: absolute;
  left: -16px;
  top: 14px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--mc, var(--accent));
  border: 2px solid var(--surface);
}
.st-head {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.time { font-weight: 700; font-size: 13.5px; }
.badge, .mode-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: var(--accent-ink);
  background-color: var(--primary);
  border-radius: 8px;
  padding: 2px 7px;
  font-size: 11.5px;
  font-weight: 700;
}
.dur { font-size: 11.5px; color: var(--muted); margin-left: auto; }
.route { margin-top: 4px; font-weight: 600; font-size: 13px; }
.route small { font-weight: 500; color: var(--muted); }
.stops-exp {
  margin-top: 6px;
  font-size: 12px;
  color: var(--text-2);
}
.stops-exp summary,
.stops-btn {
  cursor: pointer;
  color: var(--accent);
  font-weight: 600;
  background: none;
  border: 0;
  padding: 0;
  font-size: inherit;
  text-align: left;
}
.stops-list {
  margin: 4px 0 0;
  padding-left: 16px;
}
.st-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 6px;
}
.mini-btn {
  border: 1px solid var(--border);
  background: var(--surface-2);
  border-radius: var(--radius-sm);
  padding: 4px 8px;
  font-size: 11.5px;
  text-decoration: none;
  color: var(--text);
  display: inline-flex;
  align-items: center;
  gap: 4px;
  cursor: pointer;
}

/* Home Modal */
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 3000;
  background: rgba(0, 0, 0, 0.55);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 12px;
}
.modal-backdrop.show { display: flex; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  width: 100%;
  max-width: 480px;
  max-height: 90vh;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  box-shadow: var(--shadow);
}
.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.modal-head h3 { margin: 0; font-size: 16px; }
.home-presets {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.home-preset-btn {
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text);
  border-radius: var(--radius-sm);
  padding: 5px 8px;
  font-size: 11.5px;
  cursor: pointer;
  text-align: left;
}
.home-input-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.home-input-group label { font-size: 11.5px; font-weight: 600; color: var(--text-2); }
.home-input-group input {
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  border-radius: var(--radius-sm);
  padding: 6px 9px;
  font-size: 13px;
  width: 100%;
}
.geo-results {
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-height: 140px;
  overflow-y: auto;
}
.geo-item {
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text);
  border-radius: var(--radius-sm);
  padding: 6px 8px;
  font-size: 12px;
  text-align: left;
  cursor: pointer;
}
.modal-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--nav-h, 58px) + 16px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  background: var(--text);
  color: var(--bg);
  padding: 7px 12px;
  border-radius: var(--radius-md);
  font-size: 12.5px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
  z-index: 3500;
}
body.detail-open .toast {
  bottom: calc(76px + env(safe-area-inset-bottom, 0px));
}
body.detail-open .content {
  padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px));
}
@media (min-width: 960px) {
  body.detail-open .content {
    padding-bottom: 24px;
  }
}
.toast.show { opacity: 1; }
.toast button {
  margin-left: 8px;
  border: 0;
  border-radius: var(--radius-sm);
  padding: 4px 9px;
  background: var(--accent);
  color: var(--accent-ink);
  font-weight: 700;
  pointer-events: auto;
}

/* v4: compact header, collapsible filter panel */
.home-chip { margin-top: 1px; padding: 1px 7px; }
.filter-toggle { position: relative; }
.filter-toggle[aria-expanded="true"] { background: var(--accent-soft); border-color: var(--accent); }
.badge-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 999px;
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 11px;
  font-weight: 700;
}
.badge-count[hidden] { display: none; }
.filter-panel {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 6px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 8px;
}
.filter-panel[hidden] { display: none; }
.fp-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-2);
}
.fp-row label { flex: 1; min-width: 0; }
.fp-row input[type="time"], .fp-row select {
  background: var(--surface-2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 4px 8px;
  font-size: 13px;
  font-weight: 600;
  min-width: 112px;
}
.pill.feasible-pill[aria-pressed="true"]::after { content: attr(data-time); margin-left: 4px; font-weight: 700; }

/* v4: map tool icons */
.map-tools .icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.map-tools .icon-btn { color: var(--text); }

/* v4: detail actions (primary + "Weitere Apps") */
.actions.primary-actions {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px;
}
.actions.primary-actions .act { justify-content: center; text-align: center; padding: 9px 6px; line-height: 1.2; }
.more-apps { margin-top: 6px; }
.more-apps > summary {
  list-style: none;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px dashed var(--border);
  border-radius: var(--radius-md);
  padding: 8px 12px;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--text-2);
}
.more-apps > summary::-webkit-details-marker { display: none; }
.more-apps[open] > summary { border-style: solid; background: var(--surface-2); }
.more-apps .actions { margin-top: 6px; }
.app-hint { font-size: 11.5px; color: var(--muted); margin: 6px 0 0; }

/* v4: departure windows grouped (recommended first) */
.win-label { font-size: 11.5px; font-weight: 700; color: var(--muted); margin: 8px 0 0; text-transform: uppercase; letter-spacing: .03em; }
.win-btn .star { margin-right: 3px; }
.ret-btn.lsr { border-style: dashed; }

/* v4: interactive elevation profile */
.elev-box svg { display: block; width: 100%; height: auto; touch-action: pan-y; }
.elev-box .elev-read { font-size: 12px; font-weight: 700; color: var(--text-2); min-height: 18px; margin-top: 4px; }
.elev-axis { font-size: 9.5px; fill: var(--muted); }

/* Phase 2: Bottom-Nav, Tab Views & Discover Highlights */
.bottom-nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 1500;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 2px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 4px 6px calc(4px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -2px 10px rgba(19,32,28,.06);
}
.bnav-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  border: 0;
  background: transparent;
  color: var(--muted);
  border-radius: var(--radius-sm);
  padding: 4px 2px;
  min-width: 0;
  min-height: 48px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
}
.bnav-btn .bnav-ico { font-size: 16px; line-height: 1; }
.bnav-btn .bnav-lbl { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bnav-btn[aria-pressed="true"] {
  color: var(--accent);
  background: var(--accent-soft);
  font-weight: 700;
}

body.detail-open #discoverHighlights,
body.detail-open .tab-view,
body.detail-open #mapSheet,
body.detail-open #bottomNav,
body.map-full-open #mapSheet,
body.map-full-open #bottomNav {
  display: none !important;
}
body[data-tab="gemerkt"]:not(.detail-open) #listControls,
body[data-tab="gemerkt"]:not(.detail-open) #mapWrap,
body[data-tab="gemerkt"]:not(.detail-open) #discoverHighlights,
body[data-tab="gemerkt"]:not(.detail-open) #list,
body[data-tab="unterwegs"]:not(.detail-open) #listControls,
body[data-tab="unterwegs"]:not(.detail-open) #mapWrap,
body[data-tab="unterwegs"]:not(.detail-open) #discoverHighlights,
body[data-tab="unterwegs"]:not(.detail-open) #list {
  display: none;
}
@media (min-width: 960px) {
  body[data-tab="gemerkt"]:not(.detail-open) .layout,
  body[data-tab="unterwegs"]:not(.detail-open) .layout {
    display: block;
  }
}

.discover-highlights {
  margin-bottom: 12px;
  min-width: 0;
  max-width: 100%;
  overflow: hidden;
}
.discover-highlights:empty { display: none; }
.discover-title {
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 700;
  color: var(--text-2);
  margin: 0 0 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.rec-hero {
  display: grid;
  grid-template-columns: 104px minmax(0, 1fr);
  gap: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 4px solid var(--amber);
  border-radius: var(--radius);
  padding: 9px 10px;
  box-shadow: var(--shadow);
  cursor: pointer;
  margin-bottom: 10px;
  max-width: 100%;
  align-items: center;
}
.rec-hero-img {
  width: 104px;
  height: 104px;
  object-fit: cover;
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  display: block;
}
.rec-hero-body { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.rec-hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  align-self: flex-start;
  background: var(--amber-soft);
  color: var(--text);
  border-radius: var(--radius-pill);
  padding: 2px 8px;
  font-size: 11px;
  font-weight: 700;
}
.rec-hero-title {
  font-family: var(--font-display);
  font-size: 14.5px;
  font-weight: 700;
  line-height: 1.22;
  color: var(--text);
  margin: 0;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.rec-hero-sub {
  font-size: 12px;
  color: var(--text-2);
  margin: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.rec-hero .chips { margin-top: 2px; }
.discover-row {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  scroll-snap-type: x proximity;
  max-width: 100%;
  min-width: 0;
  padding-bottom: 4px;
}
.discover-row::-webkit-scrollbar { display: none; }
.rec-card {
  flex: 0 0 210px;
  scroll-snap-align: start;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 8px;
  box-shadow: var(--shadow);
  cursor: pointer;
  min-width: 0;
  color: var(--text);
}
.rec-card-img {
  width: 100%;
  height: 76px;
  object-fit: cover;
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  margin-bottom: 5px;
  display: block;
}
.rec-card-title {
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 700;
  line-height: 1.22;
  color: var(--text);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 3px;
}
.rec-card-meta {
  font-size: 11.5px;
  color: var(--text-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.rec-card-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  margin-top: auto;
  padding-top: 4px;
  font-size: 11px;
  color: var(--muted);
}

.tab-view[hidden] { display: none; }
.tab-empty {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px 16px;
  text-align: center;
  box-shadow: var(--shadow);
  max-width: 520px;
  margin: 16px auto;
}
.tab-empty-ico { font-size: 32px; margin-bottom: 8px; }
.tab-empty h2 { font-family: var(--font-display); font-size: 17px; margin: 0 0 6px; color: var(--text); }
.tab-empty p { margin: 0 0 14px; font-size: 13px; color: var(--text-2); }

/* Phase 3: Karte Fullscreen Map & Viewport-Synced Bottom-Sheet */
body[data-tab="karte"]:not(.detail-open) header.top { display: none; }
body[data-tab="karte"]:not(.detail-open) main.content { display: none; }
body[data-tab="karte"]:not(.detail-open) .layout { display: block; }
body[data-tab="karte"]:not(.detail-open) .map-wrap:not(.full) {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: calc(var(--nav-h, 58px) + env(safe-area-inset-bottom, 0px));
  height: auto;
  min-height: 0;
  z-index: 1100;
  border: 0;
}
body[data-tab="karte"]:not(.detail-open) .map-wrap.menu-open { z-index: 1450; }
body[data-tab="karte"]:not(.detail-open) #miniBtn { display: none; }
body[data-tab="karte"]:not(.detail-open) .elev-overlay {
  top: 10px;
  left: 58px;
  bottom: auto;
  max-width: calc(100% - 114px);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
body[data-tab="karte"]:not(.detail-open):not(.map-full-open) #mapSheet {
  display: flex;
  flex-direction: column;
}
.map-sheet[hidden] { display: none !important; }
.map-sheet {
  position: fixed;
  left: 0;
  right: 0;
  bottom: calc(var(--nav-h, 58px) + env(safe-area-inset-bottom, 0px));
  z-index: 1350;
  background: var(--surface);
  border-top: 1px solid var(--border);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  box-shadow: 0 -4px 20px rgba(0,0,0,.16);
  max-width: 100%;
  overflow: hidden;
  transition: height .18s ease;
  display: none;
}
.map-sheet.is-dragging { transition: none; }
.map-sheet[data-snap="collapsed"] { height: 74px; }
.map-sheet[data-snap="collapsed"] .map-sheet-body { display: none; }
.map-sheet[data-snap="half"] { height: min(42vh, 360px); }
.map-sheet[data-snap="expanded"] {
  height: calc(100vh - var(--nav-h, 58px) - 56px);
  height: calc(100dvh - var(--nav-h, 58px) - 56px);
}
@media (min-width: 960px) {
  .map-sheet {
    left: 16px;
    right: auto;
    width: min(420px, calc(100vw - 32px));
    bottom: calc(var(--nav-h, 58px) + env(safe-area-inset-bottom, 0px) + 12px);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
  }
  .map-sheet[data-snap="half"] { height: min(54vh, 460px); }
  .map-sheet[data-snap="expanded"] {
    height: calc(100vh - var(--nav-h, 58px) - 88px);
    height: calc(100dvh - var(--nav-h, 58px) - 88px);
  }
}
.map-sheet-handle {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px 0 4px;
  cursor: grab;
  touch-action: none;
  flex: none;
}
.map-sheet-grip {
  width: 38px;
  height: 4px;
  border-radius: 999px;
  background: var(--border);
}
.map-sheet-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 0 12px 8px;
  border-bottom: 1px solid var(--border);
  flex: none;
  touch-action: pan-y;
}
.map-sheet-meta { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.map-sheet-meta strong {
  font-family: var(--font-display);
  font-size: 13.5px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.map-sheet-ctx {
  align-self: flex-start;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text-2);
  border-radius: var(--radius-pill);
  padding: 2px 8px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  max-width: 100%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.map-sheet-actions { display: flex; align-items: center; gap: 5px; flex: none; }
.map-sheet-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 8px 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.sheet-card {
  display: grid;
  grid-template-columns: 76px minmax(0, 1fr) auto;
  gap: 9px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 8px;
  cursor: pointer;
  align-items: center;
  box-shadow: var(--shadow);
}
.sheet-card[data-region="pfaelzerwald"] { border-left: 3px solid var(--reg-pfalz); }
.sheet-card[data-region="odenwald"] { border-left: 3px solid var(--reg-odenwald); }
.sheet-card[data-region="schwarzwald"] { border-left: 3px solid var(--reg-schwarzwald); }
.sheet-card[data-region="weitere"] { border-left: 3px solid var(--reg-weitere); }
.sheet-card.is-selected {
  border: 2px solid var(--amber);
  background: var(--accent-soft);
}
.sheet-card-img {
  width: 76px;
  height: 68px;
  object-fit: cover;
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  display: block;
}
.sheet-card-body { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.sheet-card-title {
  font-family: var(--font-display);
  font-size: 13.5px;
  font-weight: 700;
  line-height: 1.22;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sheet-card-sub {
  font-size: 11.5px;
  color: var(--text-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sheet-card-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  font-size: 11px;
  color: var(--text-2);
}
.map-sheet-empty {
  text-align: center;
  padding: 14px 10px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
}
.map-sheet-empty h4 { margin: 0 0 4px; font-family: var(--font-display); font-size: 14px; color: var(--text); }
.map-sheet-empty p { margin: 0 0 10px; font-size: 12px; color: var(--text-2); }

/* Phase 4: KPI Grid, Compact Day Flow, Collapsible Details & Sticky Action Bar */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin-top: 10px;
}
@media (min-width: 1120px) {
  .kpi-grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}
.kpi-tile {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 9px 10px;
  box-shadow: var(--shadow);
  min-width: 0;
}
.kpi-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-2);
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
.kpi-val {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  margin-top: 2px;
  line-height: 1.2;
  font-variant-numeric: tabular-nums;
}
.kpi-sub {
  font-size: 11.5px;
  color: var(--muted);
  margin-top: 2px;
  line-height: 1.25;
  word-break: break-word;
}

.day-flow {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 6px;
}
.compact-step {
  margin-bottom: 0;
  border-left: 4px solid var(--mc, var(--accent));
}
.compact-step::before { display: none; }
.flow-node {
  display: flex;
  flex-direction: column;
  gap: 2px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 8px 10px;
  font-size: 12.5px;
  color: var(--text);
}
.flow-node-sub {
  font-size: 12px;
  color: var(--text-2);
  word-break: break-word;
}
.flow-node.flow-hike {
  border-left: 4px solid var(--ok);
}
.tl-details {
  margin-top: 10px;
  border-top: 1px solid var(--border);
  padding-top: 8px;
}
.tl-details > summary {
  list-style: none;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text);
  border-radius: var(--radius-md);
  padding: 7px 12px;
  font-size: 12.5px;
  font-weight: 700;
}
.tl-details > summary::-webkit-details-marker { display: none; }
.tl-details > summary::before { content: "▸"; font-size: 11px; transition: transform .15s ease; }
.tl-details[open] > summary::before { transform: rotate(90deg); }
.tl-details[open] > summary { background: var(--accent-soft); border-color: var(--accent); }
.tl-details-body { margin-top: 8px; }

.detail-sticky-bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 1400;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
  display: flex;
  align-items: stretch;
  gap: 6px;
  box-shadow: 0 -4px 16px rgba(19, 32, 28, 0.12);
}
.detail-sticky-bar .act {
  justify-content: center;
  text-align: center;
  padding: 8px 9px;
  min-width: 0;
  font-size: 12.5px;
  line-height: 1.2;
}
#openAppSheetBtn {
  flex: 1.25 1 0;
  gap: 5px;
}
.detail-sticky-bar a[data-app="mapy"] {
  flex: 1 1 0;
}
.detail-sticky-bar #gpxBtn {
  flex: 0 0 auto;
  white-space: nowrap;
}
.sticky-app-pill {
  background: rgba(255, 255, 255, 0.22);
  color: inherit;
  border-radius: var(--radius-pill);
  padding: 1px 6px;
  font-size: 10.5px;
  font-weight: 700;
  white-space: nowrap;
}
:root[data-theme="dark"] .sticky-app-pill,
html.dark .sticky-app-pill {
  background: rgba(7, 24, 29, 0.2);
}
@media (min-width: 960px) {
  .detail-sticky-bar {
    position: sticky;
    bottom: 8px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-top: 12px;
    padding: 8px 10px;
  }
}

/* Phase 5: Tagesplan (05–24h) */
.tagesplan {
  margin-top: 8px;
  margin-bottom: 10px;
  padding: 9px 10px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
}
.tp-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: 12px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
  flex-wrap: wrap;
}
.tp-span {
  font-variant-numeric: tabular-nums;
  color: var(--text-2);
  font-weight: 600;
}
.tp-track {
  position: relative;
  height: 24px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  overflow: hidden;
}
.tp-seg {
  position: absolute;
  top: 2px;
  bottom: 2px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10.5px;
  font-weight: 700;
  overflow: hidden;
  white-space: nowrap;
  min-width: 2px;
}
.tp-seg.tp-fwd { background: var(--primary); color: var(--accent-ink); }
.tp-seg.tp-stay { background: var(--ok); color: var(--ok-ink); }
.tp-seg.tp-rev { background: var(--amber); color: var(--amber-ink); }
.tp-axis {
  position: relative;
  height: 16px;
  margin-top: 3px;
  font-size: 10.5px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.tp-tick {
  position: absolute;
  top: 0;
  transform: translateX(-50%);
  white-space: nowrap;
}
.tp-tick[data-first] { transform: none; left: 0 !important; }
.tp-tick[data-last] { transform: none; left: auto !important; right: 0; }
.tp-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 12px;
  margin-top: 6px;
  font-size: 11.5px;
  color: var(--text-2);
  font-variant-numeric: tabular-nums;
}
.tp-leg-item {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.tp-swatch {
  width: 10px;
  height: 10px;
  border-radius: 3px;
  flex: none;
}
.tp-swatch.fwd { background: var(--primary); }
.tp-swatch.stay { background: var(--ok); }
.tp-swatch.rev { background: var(--amber); }

/* Phase 6: App-Auswahl Bottom-Sheet */
.app-sheet-backdrop {
  position: fixed;
  inset: 0;
  z-index: 2500;
  background: rgba(0, 0, 0, 0.52);
  display: none;
  align-items: flex-end;
  justify-content: center;
  padding: 0;
}
.app-sheet-backdrop.show { display: flex; }
.app-sheet {

@media (min-width: 720px) {

  }

    border-radius: var(--radius-lg);

  }
}
.app-sheet-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}
.app-sheet-head h3 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 16px;
  line-height: 1.25;
}
.app-sheet-sub {
  margin: 3px 0 0;
  font-size: 12px;
  color: var(--text-2);
  word-break: break-word;
}
.app-sheet-body {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.cap-grid {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.cap-row {

  grid-template-columns: minmax(0, 1fr) repeat(4, 36px) 38px;

  background: var(--surface);
}
.cap-row.cap-head {
  background: var(--surface-2);

  font-size: 10.5px;

  color: var(--text-2);

  letter-spacing: 0.02em;
}
.cap-row.is-preferred {

  background: var(--accent-soft);
}
.cap-app-cell {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.app-sheet-link {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-weight: 700;
  font-size: 13px;
  color: var(--accent);
  text-decoration: none;
  word-break: break-word;
}
.app-sheet-link:hover { text-decoration: underline; }
.app-badge-row {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.app-pref-badge {
  font-size: 10.5px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: var(--radius-pill);
  background: var(--accent);
  color: var(--accent-ink);
}
.app-inst-badge {
  font-size: 10.5px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: var(--radius-pill);
  background: var(--ok-soft);
  color: var(--ok);
}
.cap-cell {
  text-align: center;
  font-size: 12px;
  font-weight: 700;
}
.cap-row.cap-head .cap-cell {
  font-size: 9.5px;

  white-space: nowrap;
}
.cap-yes { color: var(--ok); }
.cap-row.is-preferred .cap-yes { color: #166534; }
:root[data-theme="dark"] .cap-row.is-preferred .cap-yes,
html.dark .cap-row.is-preferred .cap-yes { color: var(--ok); }
.cap-no { color: var(--muted); }
.app-pref-btn {
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text-2);
  border-radius: var(--radius-sm);
  width: 36px;
  height: 36px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 14px;
}
.app-pref-btn[aria-pressed="true"] {
  background: var(--amber);
  color: var(--amber-ink);
  border-color: var(--amber);
}
.app-sheet-hint {
  font-size: 11.5px;
  color: var(--muted);
  margin: 2px 0 0;
  line-height: 1.4;
}

/* Phase 8: Bookmarks („Gemerkt“), JSON Export/Import & Phase 7: „Unterwegs-Modus“ */
.fav-btn {
  display: inline-flex;

  justify-content: center;

}

}

}
.fav-btn.fav-overlay {

}
.fav-btn.fav-inline {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);

}
.fav-btn.fav-overlay[aria-pressed="true"],
.fav-btn.fav-inline[aria-pressed="true"],
#detailFavBtn[aria-pressed="true"] {
  background: var(--amber);
  color: var(--amber-ink);
  border-color: var(--amber);
}
.rec-hero-media {
  position: relative;
  width: 104px;
  height: 104px;
  flex: none;
}
.rec-card-media {
  position: relative;
  width: 100%;
  height: 76px;
  margin-bottom: 5px;
}
.rec-card-media .rec-card-img {
  margin-bottom: 0;
}
.rec-card-media .fav-btn.fav-overlay,
.rec-hero-media .fav-btn.fav-overlay {
  top: 5px;
  right: 5px;
  width: 30px;
  height: 30px;
}
.hero-cta-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}
.hero-cta-row .act {
  flex: 1 1 135px;
  justify-content: center;
  text-align: center;
}

.saved-shell,
.trip-shell {
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-width: 880px;
  margin: 0 auto;
  min-width: 0;
}
.saved-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 11px 12px;
  box-shadow: var(--shadow);
}
.saved-head h2 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 17px;
  color: var(--text);
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.saved-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.saved-json-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 9px 12px;
  box-shadow: var(--shadow);
}
.saved-json-box > summary {
  cursor: pointer;
  font-weight: 700;
  font-size: 12.5px;
  color: var(--text-2);
}
.saved-json-area {
  width: 100%;
  min-height: 86px;
  margin-top: 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg);
  color: var(--text);
  padding: 8px;
  font-family: var(--font-mono);

}
.saved-json-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}
.saved-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 9px;
  min-width: 0;
}
@media (min-width: 720px) {
  .saved-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
.saved-card {
  display: grid;
  grid-template-columns: 84px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 9px 10px;
  box-shadow: var(--shadow);
  cursor: pointer;
  min-width: 0;
  max-width: 100%;
}
.saved-card[data-region="pfaelzerwald"] { border-left: 3px solid var(--reg-pfalz); }
.saved-card[data-region="odenwald"] { border-left: 3px solid var(--reg-odenwald); }
.saved-card[data-region="schwarzwald"] { border-left: 3px solid var(--reg-schwarzwald); }
.saved-card[data-region="weitere"] { border-left: 3px solid var(--reg-weitere); }
.saved-card-img {
  width: 84px;
  height: 76px;
  object-fit: cover;
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  display: block;
}
.saved-card-body {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.saved-card-title {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 700;
  line-height: 1.24;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.saved-card-sub {
  font-size: 12px;
  color: var(--text-2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.trip-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  box-shadow: var(--shadow);
  min-width: 0;
  max-width: 100%;
  word-break: break-word;
}
.trip-hero {
  border-left: 4px solid var(--accent);
}
.trip-card h2 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 17px;
  line-height: 1.25;
  color: var(--text);
}
.trip-card h3 {
  margin: 0 0 6px;
  font-family: var(--font-display);
  font-size: 14px;
  color: var(--text);
}
.trip-sub {
  margin: 3px 0 0;
  font-size: 12.5px;
  color: var(--text-2);
}
.trip-countdown-box {
  background: var(--accent-soft);
  border: 1px solid var(--accent);
  border-radius: var(--radius-md);
  padding: 11px 12px;
  margin-top: 10px;
}
.trip-phase-lbl {
  font-size: 11.5px;
  font-weight: 700;
  color: var(--text-2);
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
.trip-countdown-val {
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 700;
  color: var(--text);
  font-variant-numeric: tabular-nums;
  line-height: 1.15;
  margin-top: 3px;
}
.trip-progress-track {
  height: 8px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--border);
  overflow: hidden;
  margin-top: 8px;
}
.trip-progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 999px;
  transition: width .3s ease;
}
.trip-next-step {
  margin-top: 8px;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  border: 1px solid var(--border);
  font-size: 12.5px;
  color: var(--text);
}
.trip-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}
.trip-actions .act {
  flex: 1 1 110px;
  justify-content: center;
  text-align: center;
}
.trip-ret-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}
.trip-ret-btn {
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text);
  border-radius: var(--radius-sm);

.trip-ret-btn[aria-pressed="true"] {

}
.trip-ret-btn.lsr {
  border-style: dashed;
}
.trip-remind-controls {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;

}
.trip-remind-status {
  margin-top: 8px;

}
.trip-remind-hint {
  margin: 8px 0 0;

@media (pointer: coarse) {
  .pill, .seg button, .base-btn, .icon-btn, .act, .win-btn, .stay-btn, .ret-btn, .trip-ret-btn, .mini-btn, .stay-select, .home-preset-btn, .geo-item, .region-head { min-height: 40px; }

:root[data-theme="dark"] .leaflet-bar a,
