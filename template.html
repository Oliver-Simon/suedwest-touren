/* Line numbers on the map: a coloured label per ride (shown when the ride is long enough on screen),
   small dots at boarding/alighting stops with time + stop on tap. */
let lineLabelLayers = [];
function addRideMarks(s, pts, col) {
  if (!pts || pts.length < 2 || s.kind !== "ride") return;
  const lbl = s.line || s.lineName || "";
  if (lbl) {
    const icon = L.divIcon({className: "map-line-label-wrap", html: `<span class="map-line-label" style="background:${col}" data-l="${esc(lbl)}" aria-hidden="true"></span>`, iconSize: null});
    const mk = L.marker(pts[Math.floor(pts.length / 2)], {icon, interactive: false, keyboard: false});
    singleGroup.addLayer(mk);
    lineLabelLayers.push({mk, pts});
  }
  [[pts[0], s.dep, s.from], [pts[pts.length - 1], s.arr, s.to]].forEach(([q, hm, st]) => {
    if (!q) return;
    const dot = L.circleMarker(q, {radius: 4.5, color: col, weight: 2.5, fillColor: "#ffffff", fillOpacity: 1});
    dot.bindTooltip(`${esc(hm || "")} ${esc(st?.name || "")}${st?.platform ? ` · ${esc(T().platform)} ${esc(st.platform)}` : ""}${lbl ? ` · ${esc(lbl)}` : ""}`, {direction: "top"});
    singleGroup.addLayer(dot);
  });
}
function updateLineLabels() {
  lineLabelLayers.forEach(({mk, pts}) => {
    const el = mk.getElement && mk.getElement();
    if (!el) return;
    const a = map.latLngToContainerPoint(pts[0]), b = map.latLngToContainerPoint(pts[pts.length - 1]);
    let span = a.distanceTo(b);
    const m = map.latLngToContainerPoint(pts[Math.floor(pts.length / 2)]);
    span = Math.max(span, a.distanceTo(m) + m.distanceTo(b) * 0.5);
    el.style.display = span > 70 ? "" : "none";
  });
}
map.on("zoomend moveend", updateLineLabels);

function drawSingle(t) {
  overviewGroup.clearLayers();
  singleGroup.clearLayers();
  segLayerMap = [];
  lineLabelLayers = [];
  if (!t) return;
  const bInfo = getBaseInfo(state.base);
  const bounds = L.latLngBounds([[bInfo.lat, bInfo.lon]]);
  const {fwd, rev} = getSelectedWindow(t, state.base, state.day);
  const h = t.hike || {};

  if (h.hasGpx && h.distKm) {
    const kmStr = Number(h.distKm).toFixed(1).replace(".", ",");
    const hm = Math.round(Number(h.elevGainM || 0));
    $("#elevBadge").textContent = `🥾 ${kmStr} km · ↗ ${hm} hm`;
  } else {
    $("#elevBadge").textContent = `${tourTitle(t)} (${state.base === "karlsruhe" ? "Karlsruhe" : "Jugenheim"})`;
  }

  // Draw transit approach from active base (ensures distinct rail vs bus colors & base-dependent geometry)
  const allTransit = [...fwd, ...rev];
  const legFilter = state.mapLegFilter || "all";
  const stepBuckets = {out: [], mid: [], site: [], ret: []};
  allTransit.forEach((s, idx) => {
    if (legFilter === "out" && idx >= fwd.length) return;
    if (legFilter === "ret" && idx < fwd.length) return;
    const pts = getSegmentCoords(s, bInfo, t.transit?.startStop);
    const bucket = idx < fwd.length ? stepBuckets.out : stepBuckets.ret;
    if (isLongStraight(pts, hasRealPoly(s))) {
      bucket.push({seg: s, pts, layer: null});
      segLayerMap[idx] = L.polyline(pts);
      [pts[0], pts[pts.length - 1]].forEach(q => singleGroup.addLayer(L.circleMarker(q, {radius: 4, color: "#ffffff", weight: 1.5, fillColor: "#7c3aed", fillOpacity: 1})));
      bounds.extend(L.latLngBounds(pts));
      return;
    }
    if (pts.length >= 2) {
      // Anchor first segment cleanly to active base coordinates so Jugenheim vs Karlsruhe SVG paths always differ
      if (idx === 0 && haversineM(pts[0], [bInfo.lat, bInfo.lon]) <= STRAIGHT_MAX_M) pts[0] = [bInfo.lat, bInfo.lon];
      const mode = String(s.mode || "re").toLowerCase();
      const isWalk = s.kind === "walk" || mode === "foot" || mode === "walk";
      const strokeCol = isWalk ? "#64748b" : (MODE_COLORS[mode] || "#7c3aed");
      const line = L.polyline(pts, {
        color: strokeCol,
        weight: isWalk ? 3 : 5,
        opacity: 0.92,
        dashArray: isWalk ? "1 7" : null,
        lineCap: "round"
      });
      line.on("click", () => focusStep(idx));
      singleGroup.addLayer(line);
      segLayerMap[idx] = line;
      bounds.extend(line.getBounds());
      if (!isWalk) addRideMarks(s, pts, strokeCol);
      bucket.push({seg: s, pts, layer: line});
    }
  });

  // Timetabled middle stage of ÖPNV round trips (e.g. Koblenz → Limburg)
  const midSt = getMiddle(t, state.base, state.day, fwd, rev);
  if (midSt && midSt.segs.length && (state.mapLegFilter || "all") === "all") {
    midSt.segs.forEach(s => {
      const pts = getSegmentCoords(s);
      if (pts.length < 2 || isLongStraight(pts, hasRealPoly(s))) return;
      const mode = String(s.mode || "re").toLowerCase();
      const isWalk = s.kind === "walk" || mode === "foot" || mode === "walk";
      const ln = L.polyline(pts, {color: isWalk ? "#64748b" : (MODE_COLORS[mode] || "#7c3aed"), weight: isWalk ? 3 : 5, opacity: 0.92, dashArray: isWalk ? "1 7" : null, lineCap: "round"});
      singleGroup.addLayer(ln);
      bounds.extend(ln.getBounds());
      if (!isWalk) addRideMarks(s, pts, MODE_COLORS[mode] || "#7c3aed");
      stepBuckets.mid.push({seg: s, pts, layer: ln});
    });
  }

  // Hike track (GPX) and the untimed middle part, so the whole round is visible
  const fwdPts = fwd.length ? getSegmentCoords(fwd[fwd.length - 1], bInfo, t.transit?.startStop) : [];
  const revPts = rev.length ? getSegmentCoords(rev[0], t.transit?.endStop, bInfo) : [];
  const fwdEnd = fwdPts.length ? fwdPts[fwdPts.length - 1] : ptOf(t.transit?.startStop);
  const revStart = revPts.length ? revPts[0] : ptOf(t.transit?.endStop);
  const mid = tourMiddle(t, fwdEnd, revStart);
  const hikePts = (h.hasGpx && h.poly5) ? hikePolyPts(t) : [];
  const addLine = (pts, opts) => {
    if (!pts || pts.length < 2) return null;
    const ln = L.polyline(pts, opts);
    singleGroup.addLayer(ln);
    bounds.extend(ln.getBounds());
    return ln;
  };
  if (mid.walkIn && pathLenM(mid.walkIn) <= STRAIGHT_MAX_M) addLine(mid.walkIn, {color: "#64748b", weight: 3, opacity: 0.92, dashArray: "3 6"});
  if (mid.walkOut && pathLenM(mid.walkOut) <= STRAIGHT_MAX_M) addLine(mid.walkOut, {color: "#64748b", weight: 3, opacity: 0.92, dashArray: "3 6"});
  if (hikePts.length >= 2) {
    stepBuckets.site.push({kind: "hike", pts: hikePts, layer: addLine(hikePts, {color: "#15803d", weight: 5, opacity: 0.95})});
  } else if (midSt && midSt.segs.length) {
    // middle stage already drawn from the timetable
  } else if (mid.local && pathLenM(mid.local) <= STRAIGHT_MAX_M) {
    // short own stage on site: no timetable data, drawn dashed
    stepBuckets.site.push({kind: "site", pts: mid.local, layer: addLine(mid.local, {color: "#15803d", weight: 4, opacity: 0.9, dashArray: "8 7"})});
  } else if (mid.local) {
    stepBuckets.site.push({kind: "site", pts: mid.local, layer: null});
    // long stage without map data (e.g. via 1 → via 2 of a 360° ring): only its stops, no straight line across the map
    mid.local.forEach(q => {
      singleGroup.addLayer(L.circleMarker(q, {radius: 6, color: "#ffffff", weight: 2, fillColor: "#15803d", fillOpacity: 1}));
      bounds.extend(L.latLngBounds([q, q]));
    });
  } else if (fwdEnd) {
    const mk = L.circleMarker(fwdEnd, {radius: 7, color: "#ffffff", weight: 2, fillColor: "#15803d", fillOpacity: 1});
    singleGroup.addLayer(mk);
    bounds.extend(L.latLngBounds([fwdEnd, fwdEnd]));
    stepBuckets.site.push({kind: "site", pts: [fwdEnd], layer: null, point: true});
  }

  currentBounds = bounds;
  buildMapSteps(t, stepBuckets, fwd, rev);
  setTimeout(updateLineLabels, 0);
}

/* ---------- Fullscreen tour map: one card per step at the bottom, swipe → map zooms to that step ---------- */
let mapSteps = [], stepActive = 0, stepScrollTimer = null;
function buildMapSteps(t, b, fwd, rev) {
  const tDict = T();
  const h = t.hike || {};
  const segStep = (x, leg) => {
    const s = x.seg;
    const mode = String(s.mode || "re").toLowerCase();
    const isWalk = s.kind === "walk" || mode === "foot" || mode === "walk";
    const dur = (s.dep && s.arr) ? fmtDur(Math.max(0, minDiff(s.dep, s.arr))) : "";
    if (isWalk) {
      return {kind: "walk", leg, seg: s, pts: x.pts, layer: x.layer, ico: "🚶", title: tDict.stepWalkTo(s.to?.name || ""),
        time: [s.dep && s.arr ? `${s.dep}–${s.arr}` : "", dur].filter(Boolean).join(" · "), sub: s.from?.name ? `${tDict.stepFrom} ${s.from.name}` : ""};
    }
    const plat = x => x?.platform ? ` (${tDict.platform} ${x.platform})` : "";
    return {kind: "ride", leg, seg: s, pts: x.pts, layer: x.layer, col: MODE_COLORS[mode] || "#7c3aed", line: s.line || s.lineName || mode.toUpperCase(),
      title: `→ ${s.dest || s.to?.name || ""}`, time: `${s.dep || ""} ${s.from?.name || ""}${plat(s.from)}`, sub: `${s.arr || ""} ${s.to?.name || ""}${plat(s.to)}${dur ? ` · ${dur}` : ""}`};
  };
  const withTransfers = (list, leg) => {
    const out = [];
    list.forEach(x => {
      const st = segStep(x, leg);
      const prev = out[out.length - 1];
      if (prev && prev.kind === "ride" && st.kind === "ride" && x.pts && x.pts[0]) {
        const gap = (prev.seg.arr && x.seg.dep) ? minDiff(prev.seg.arr, x.seg.dep) : null;
        const pf = prev.seg.to?.platform, pt = x.seg.from?.platform;
        out.push({kind: "xfer", leg, pts: [x.pts[0]], point: true, ico: "↺", title: tDict.stepTransfer(x.seg.from?.name || prev.seg.to?.name || ""),
          time: [prev.seg.arr && x.seg.dep ? `${prev.seg.arr}–${x.seg.dep}` : "", gap != null && gap >= 0 ? fmtDur(gap) : ""].filter(Boolean).join(" · "),
          sub: (pf || pt) ? `${tDict.platform} ${pf || "?"} → ${tDict.platform} ${pt || "?"}` : ""});
      }
      out.push(st);
    });
    return out;
  };
  const fwdArr = fwd[fwd.length - 1]?.arr || "", revDep = rev[0]?.dep || "";
  const stay = fwdArr && revDep ? fmtDur(Math.max(0, minDiff(fwdArr, revDep))) : "";
  const site = b.site.map(x => {
    if (x.kind === "hike") {
      const km = Number(h.distKm || 0).toFixed(1).replace(".", state.lang === "en" ? "." : ",");
      return {kind: "hike", leg: "site", pts: x.pts, layer: x.layer, ico: "🥾", title: `${tDict.stepHike} ${km} km`,
        time: [fwdArr && revDep ? `${fwdArr}–${revDep}` : "", stay ? `${tDict.stepStay} ${stay}` : ""].filter(Boolean).join(" · "),
        sub: [Number(h.elevGainM) ? `↗ ${Math.round(h.elevGainM)} hm` : "", Number(h.walkMin) ? `${tDict.dtWalkTime} ${fmtDur(h.walkMin)}` : ""].filter(Boolean).join(" · ")};
    }
    return {kind: "site", leg: "site", pts: x.pts, layer: x.layer, point: x.point || x.pts.length < 2, ico: "📍", title: tDict.stepSite,
      time: [fwdArr && revDep ? `${fwdArr}–${revDep}` : "", stay].filter(Boolean).join(" · "), sub: fwd[fwd.length - 1]?.to?.name || ""};
  });
  const steps = [...withTransfers(b.out, "out"), ...site, ...withTransfers(b.mid, "mid"), ...withTransfers(b.ret, "ret")];
  steps.forEach(x => { x.baseW = x.layer && x.layer.options ? x.layer.options.weight : null; });
  const dep = fwd[0]?.dep || "", arr = rev[rev.length - 1]?.arr || "";
  mapSteps = [{kind: "all", ico: "🗺️", title: tourTitle(t), time: dep && arr ? `${dep}–${arr}` : "", sub: tDict.stepsN(steps.length)}, ...steps];
  stepActive = 0;
  renderStepStrip();
}
function renderStepStrip() {
  const el = $("#stepStrip");
  if (!el) return;
  const tDict = T();
  const kick = {out: tDict.legOutK, mid: tDict.legMidK, site: tDict.stepSite, ret: tDict.legRetK};
  const n = mapSteps.length - 1;
  el.innerHTML = mapSteps.map((x, i) => `<div class="step-card${i === stepActive ? " on" : ""}" data-i="${i}" role="button" tabindex="0">
      <div class="sc-kick">${i === 0 ? esc(tDict.stepAll) : `${esc(kick[x.leg] || "")} · ${i}/${n}`}</div>
      <div class="sc-head">${x.kind === "ride" ? `<span class="badge mode-badge" style="background-color:${x.col};color:#fff">${esc(x.line)}</span>` : `<span class="sc-ico" aria-hidden="true">${x.ico}</span>`}<strong>${esc(x.title)}</strong></div>

  el.scrollLeft = 0;
}
function stepStripOpen() {
  return Boolean(state.sel && document.body.classList.contains("detail-open") && $("#mapWrap").classList.contains("full") && mapSteps.length > 1);
}
function focusMapStep(i) {

  if (st.layer && st.layer.setStyle && st.baseW) {

  const pts = (st.pts || []).filter(Boolean);

      if (d < bd) { bd = d; best = k; }

function fitCurrent() {
  if (!currentBounds || !currentBounds.isValid()) return;
  // Measure the real map size first: the map is moved between layouts and resized (pin, tabs);
  // a fit with a stale size starts a zoom animation to the wrong level, and Leaflet drops every
  // further fit while that animation runs.
  const mc = map.getContainer();
  if (mc && mc.clientWidth && mc.clientHeight) map.invalidateSize({pan: false});
  if (state.tab === "karte" && !state.sel && !$("#mapWrap").classList.contains("full")) {
    const sheetH = $("#mapSheet")?.getBoundingClientRect().height || 0;
    const mapY = map.getSize().y || window.innerHeight || 800;
    if (window.innerWidth >= 960) {
      map.fitBounds(currentBounds, {paddingTopLeft: [452, 24], paddingBottomRight: [24, 24], maxZoom: 14});
    } else {
      const padB = Math.max(24, Math.min(Math.round(sheetH + 16), Math.floor(mapY * 0.48)));
      // floating search / region chips / focus bar cover the top of the map
      const fl = $("#mapFloat"), mw = $("#mapWrap");
      const padT = fl && mw ? Math.max(24, Math.min(Math.round(fl.getBoundingClientRect().bottom - mw.getBoundingClientRect().top + 12), Math.floor(mapY * 0.35))) : 24;
      map.fitBounds(currentBounds, {paddingTopLeft: [24, padT], paddingBottomRight: [24, padB], maxZoom: 14});
    }
    return;
  }
  if (state.sel && window.innerWidth < 960 && !$("#mapWrap").classList.contains("full")) {
    const mw = $("#mapWrap").getBoundingClientRect();
    const lt = $("#legToggle"), top = $("#top");
    let padT = 24;
    if (lt && lt.offsetParent !== null) padT = Math.max(padT, lt.getBoundingClientRect().bottom - mw.top + 10);
    else if (top) padT = Math.max(padT, Math.min(top.getBoundingClientRect().bottom - mw.top, 60) + 4);
    padT = Math.min(padT, Math.floor((map.getSize().y || 300) * 0.45));
    // stepless zoom (zoomSnap 0): the route fills the map – pinned or not
    map.fitBounds(currentBounds, {paddingTopLeft: [24, padT], paddingBottomRight: [24, 24], maxZoom: 14, animate: false});
    return;
  }
  if (stepStripOpen()) {
    const mw = $("#mapWrap").getBoundingClientRect(), lt = $("#legToggle");
    const padT = lt && lt.offsetParent !== null ? lt.getBoundingClientRect().bottom - mw.top + 12 : 24;
    map.fitBounds(currentBounds, {paddingTopLeft: [24, padT], paddingBottomRight: [24, ($("#stepStrip")?.offsetHeight || 0) + 30], maxZoom: 14, animate: false});
    return;
  }
  map.fitBounds(currentBounds, {padding: [24, 24], maxZoom: 14});
}

function focusStep(idx) {
  if (stepStripOpen()) {
    const ln = segLayerMap[idx];
    const k = mapSteps.findIndex(x => x.layer && x.layer === ln);
    const card = k >= 0 ? $("#stepStrip").children[k] : null;
    if (card) { card.scrollIntoView({behavior: "smooth", inline: "center", block: "nearest"}); return; }
  }
  document.querySelectorAll("#detail .st").forEach(el => el.classList.remove("flash"));
  document.querySelectorAll(`#detail .st[data-step="${idx}"]`).forEach(el => el.classList.add("flash"));
  const ln = segLayerMap[idx];
  if (ln && ln.getBounds && ln.getBounds().isValid()) {
    map.fitBounds(ln.getBounds(), {padding: [30, 30], maxZoom: 14});
  }
}

(function initMapSheetEvents() {
  const sheet = $("#mapSheet");
  const handle = $("#mapSheetHandle");
  const head = $("#mapSheetHead");
  const body = $("#mapSheetBody");
  if (!sheet || !handle || !head || !body) return;

  let startY = 0;
  let startH = 0;
  let pointerId = null;
  let dragging = false;
  let suppressClick = false;

  const onDown = e => {
    if (e.target.closest("button")) return;
    if (e.pointerType === "mouse" && e.button !== 0) return;
    pointerId = e.pointerId;
    startY = e.clientY;
    startH = sheet.getBoundingClientRect().height;
    dragging = false;
    try { e.currentTarget.setPointerCapture(pointerId); } catch (err) {}
  };
  const onMove = e => {
    if (pointerId === null || e.pointerId !== pointerId) return;
    const dy = startY - e.clientY;
    if (!dragging && Math.abs(dy) > 6) {
      dragging = true;
      sheet.classList.add("is-dragging");
    }
    if (dragging) {
      const maxH = Math.max(240, (window.innerHeight || 800) - 110);
      const nextH = Math.max(68, Math.min(maxH, startH + dy));
      sheet.style.height = `${Math.round(nextH)}px`;
    }
  };
  const onUp = e => {
    if (pointerId === null || e.pointerId !== pointerId) return;
    pointerId = null;
    if (dragging) {
      dragging = false;
      suppressClick = true;
      setTimeout(() => { suppressClick = false; }, 120);
      const finalH = sheet.getBoundingClientRect().height;
      sheet.classList.remove("is-dragging");
      sheet.style.height = "";
      const vh = window.innerHeight || 800;
      if (finalH < 140) setMapSheetSnap("collapsed");
      else if (finalH > vh * 0.56) setMapSheetSnap("expanded");
      else setMapSheetSnap("half");
    }
  };
  [handle, head].forEach(el => {
    el.addEventListener("pointerdown", onDown);
    el.addEventListener("pointermove", onMove);
    el.addEventListener("pointerup", onUp);
    el.addEventListener("pointercancel", onUp);
  });
  handle.addEventListener("click", () => {
    if (suppressClick) return;
    setMapSheetSnap(state.mapSheetSnap === "collapsed" ? "half" : "collapsed");
  });
  handle.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      setMapSheetSnap(state.mapSheetSnap === "collapsed" ? "half" : "collapsed");
    }
  });
  $("#mapSheetExpandBtn").addEventListener("click", () => {
    setMapSheetSnap(state.mapSheetSnap === "expanded" ? "half" : "expanded");
  });
  $("#mapSheetCollapseBtn").addEventListener("click", () => {
    setMapSheetSnap(state.mapSheetSnap === "collapsed" ? "half" : "collapsed");
  });
  $("#mapSheetBaseChip").addEventListener("click", () => {
    setBase(state.base === "karlsruhe" ? "jugenheim" : "karlsruhe");
  });
  body.addEventListener("click", e => {
    const favBtn = e.target.closest(".fav-btn[data-fav-id]");
    if (favBtn) {
      e.stopPropagation();
      toggleFav(favBtn.dataset.favId);
      return;
    }
    const resetBtn = e.target.closest("#mapResetBoundsBtn");
    if (resetBtn) { fitCurrent(); return; }
    const focusBtn = e.target.closest(".sheet-route-btn[data-focus-id]");
    if (focusBtn) {
      e.stopPropagation();
      setMapFocus(focusBtn.dataset.focusId);
      return;
    }
    const card = e.target.closest(".sheet-card[data-sheet-id]");
    if (card) openTour(card.dataset.sheetId);
  });
  body.addEventListener("keydown", e => {
    if (e.key !== "Enter" && e.key !== " ") return;
    if (e.target.closest(".fav-btn")) return;
    const card = e.target.closest(".sheet-card[data-sheet-id]");
    if (card) {
      e.preventDefault();
      openTour(card.dataset.sheetId);
    }
  });
})();

function decimatePts(pts, maxN) {
  if (!pts || pts.length <= maxN) return pts || [];
  const out = [pts[0]];
  const step = (pts.length - 1) / (maxN - 1);
  for (let i = 1; i < maxN - 1; i++) {
    out.push(pts[Math.round(i * step)]);
  }
  out.push(pts[pts.length - 1]);
  return out;
}

function sortKey(t) {
  const {fwd, rev} = getSelectedWindow(t, state.base, state.day);
  const h = t.hike || {};
  switch (state.sort) {
    case "ride": return fwd.length ? minDiff(fwd[0]?.dep, fwd[fwd.length - 1]?.arr) : 9999;
    case "stay": return -(fwd.length && rev.length ? minDiff(fwd[fwd.length - 1]?.arr, rev[0]?.dep) : 0);
    case "km": return -(Number(h.distKm) || 0);
    case "hm": return -(Number(h.elevGainM) || 0);
    default: return 0;
  }
}

/* ---------- Discovery Highlights & Tabs ---------- */
function tourLatestDepMin(t, win) {
  const wins = win.wins || [];
  if (!wins.length) return -1;
  let maxDep = Math.max(...wins.map(w => parseHHMM(w[0]?.dep) ?? -1));
  const lsrDep = parseHHMM(win.lsr?.dep);
  if (lsrDep !== null) {
    const wmin = Number((t.hike && t.hike.walkMin) || 0);
    const stayReq = wmin > 0 ? wmin + 30 : 60;
    const fwd = win.fwd || [];
    const fwdDur = fwd.length ? Math.max(30, minDiff(fwd[0]?.dep, fwd[fwd.length - 1]?.arr)) : 60;
    const adjLsr = lsrDep < 240 ? lsrDep + 1440 : lsrDep;
    const latestTaktDep = Math.min(20 * 60 + 30, adjLsr - stayReq - fwdDur);
    if (latestTaktDep > maxDep) maxDep = latestTaktDep;
  }
  return maxDep;
}

function pickDiscoverTours(vis) {
  if (!vis || !vis.length) return {hero: null, more: []};
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const isDaytime = !state.feasibleTime && nowMin >= 5 * 60 && nowMin < 18 * 60;

  const entries = vis.map((t, idx) => {
    const win = getSelectedWindow(t, state.base, state.day);
    const routable = !win.fallback && win.fwd.length > 0 && win.rev.length > 0;
    const maxDep = tourLatestDepMin(t, win);
    const dep = win.fwd[0]?.dep || "";
    const arr = win.rev[win.rev.length - 1]?.arr || "";
    const fwdArr = win.fwd[win.fwd.length - 1]?.arr || "";
    const revDep = win.rev[0]?.dep || "";
    const fwdDur = win.fwd.length ? minDiff(dep, fwdArr) : 999;
    const stayMin = (fwdArr && revDep) ? minDiff(fwdArr, revDep) : 0;
    const h = t.hike || {};
    let score = 0;
    if (routable) score += 40;
    if (h.hasGpx) score += 20;
    if (fwdDur <= 120) score += 15;
    else if (fwdDur <= 165) score += 5;
    if (stayMin >= (Number(h.walkMin || 0) || 90)) score += 15;
    if (t.source === "curated" || isClosedLoopHike(t)) score += 5;
    return {t, idx, win, routable, maxDep, score};
  });

  let pool = isDaytime ? entries.filter(e => e.routable && e.maxDep >= nowMin) : [];
  if (!pool.length) pool = entries.filter(e => e.routable);
  if (!pool.length) pool = entries;

  const ranked = pool.slice().sort((a, b) => (b.score - a.score) || (a.idx - b.idx)).map(e => e.t);
  return {
    hero: ranked[0] || null,
    more: ranked.slice(1, 9)
  };
}

      }).join("")}
    </div>` : "";

  host.innerHTML = `

function importFavoritesJson(rawText) {
  const tDict = T();
  const text = String(rawText || "").trim();
  if (!text) {
    toast(tDict.savedImportInvalid);
    return false;
  }
  let parsed;
  try {
    parsed = JSON.parse(text);
  } catch (e) {
    toast(tDict.savedImportInvalid);
    return false;
  }
  if (parsed && typeof parsed === "object" && parsed.done && typeof parsed.done === "object" && !Array.isArray(parsed.done)) {
    let nDone = 0;
    for (const [id, d] of Object.entries(parsed.done)) {
      if (BY_ID[id] && !isDone(id)) { state.done[id] = typeof d === "string" ? d.slice(0, 10) : ""; nDone++; }
    }
    if (nDone) store.set("done", state.done);
  }
  const arr = Array.isArray(parsed)
    ? parsed
    : (parsed && typeof parsed === "object" && Array.isArray(parsed.favs) ? parsed.favs : null);
  if (!arr) {
    toast(tDict.savedImportInvalid);
    return false;
  }
  const seenValid = new Set();
  const validIds = [];
  for (const item of arr) {
    if (typeof item === "string" && BY_ID[item] && !seenValid.has(item)) {
      seenValid.add(item);
      validIds.push(item);
    }
  }
  if (!validIds.length) {
    toast(tDict.savedImportEmpty);
    return false;
  }
  const merged = [];
  const seen = new Set();
  for (const id of [...validIds, ...state.favs]) {
    if (BY_ID[id] && !seen.has(id)) {
      seen.add(id);
      merged.push(id);
    }
  }
  state.favs = merged;
  store.set("favs", state.favs);
  syncFavButtons();
  renderSavedView();
  toast(tDict.savedImported(validIds.length));
  return true;
}

let tripTicker = null;
let inPageReminderTimer = null;

function stopTripTicker() {
  if (tripTicker) {
    clearInterval(tripTicker);
    tripTicker = null;
  }
}

function startTripTicker() {
  stopTripTicker();
  if (state.tab === "unterwegs" && !state.sel && state.activeTrip) {
    tripTicker = setInterval(updateTripCountdown, 1000);
  }
}

function clearInPageReminderTimer() {
  if (inPageReminderTimer) {
    clearTimeout(inPageReminderTimer);
    inPageReminderTimer = null;
  }
}

function armInPageReminder(rem) {
  clearInPageReminderTimer();
  if (!rem || !rem.triggerAt || rem.status === "fired") return;
  const delay = rem.triggerAt - Date.now();
  if (delay <= 0 || delay > 2147483647) return;
  inPageReminderTimer = setTimeout(() => {
    inPageReminderTimer = null;
    if (!state.activeTrip || !state.activeTrip.reminder || state.activeTrip.reminder.id !== rem.id) return;
    showSystemNotification(rem);
    toast(`🔔 ${rem.title} · ${rem.text}`, {ms: 8000});
  }, delay);
}

// Chrome on Android only allows notifications through the service worker registration;
// new Notification() throws there. Desktop browsers without an active SW keep the constructor.
function showSystemNotification(rem) {
  if (typeof Notification === "undefined" || Notification.permission !== "granted") return;
  const opts = {body: rem.text, tag: rem.id, icon: "./icon-192.png", badge: "./icon-192.png", renotify: true};
  const viaCtor = () => { try { new Notification(rem.title, opts); } catch (e) {} };
  if ("serviceWorker" in navigator && navigator.serviceWorker.controller) {
    navigator.serviceWorker.getRegistration()
      .then(reg => (reg && reg.showNotification ? reg.showNotification(rem.title, opts) : viaCtor()))
      .catch(viaCtor);
  } else {
    viaCtor();
  }
}

function cancelActiveTripReminder(opts) {
  clearInPageReminderTimer();
  const rem = state.activeTrip && state.activeTrip.reminder;
  if (rem && rem.id && NATIVE && typeof NATIVE.cancelReminder === "function") {
    try { NATIVE.cancelReminder(rem.id); } catch (e) {}
  }
  if (state.activeTrip) {
    state.activeTrip.reminder = null;
    store.set("activeTrip", state.activeTrip);
  }
  if (!(opts && opts.silent)) {
    if (state.tab === "unterwegs" && !state.sel) renderTripView();
    toast(T().tripRemindCleared);
  }
}

function resolveActiveTrip(trip) {
  if (!trip || !BY_ID[trip.tourId]) return null;
  const t = BY_ID[trip.tourId];
  const selWin = getSelectedWindow(t, trip.base, trip.day, {
    winIdx: trip.winIdx,
    revIdx: trip.revIdx,
    stayTargetMin: trip.stayTargetMin
  });
  return {t, trip, selWin};
}

function formatCountdown(totalSeconds) {
  const sec = Math.max(0, Math.floor(totalSeconds));
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}

function formatCountdownShort(totalSeconds) {
  const min = Math.max(0, Math.floor(totalSeconds / 60));
  return `${Math.floor(min / 60)}:${String(min % 60).padStart(2, "0")}`;
}

function computeTripProgress(t, selWin) {
  const tDict = T();
  const fwd = selWin.fwd || [];
  const rev = selWin.rev || [];
  const dep = fwd[0]?.dep || "08:04";
  const fwdArr = fwd[fwd.length - 1]?.arr || "10:15";
  const revDep = rev[0]?.dep || "16:30";
  const arr = rev[rev.length - 1]?.arr || "18:42";

  const depMin = toAbsMin(dep) ?? 480;
  const fwdDurMin = fwd.length ? Math.max(1, minDiff(dep, fwdArr)) : 60;
  const fwdArrMin = depMin + fwdDurMin;
  const stayMin = (fwd.length && rev.length) ? Math.max(1, minDiff(fwdArr, revDep)) : 180;
  const revDepMin = fwdArrMin + stayMin;
  const revDurMin = rev.length ? Math.max(1, minDiff(revDep, arr)) : 60;
  const revArrMin = revDepMin + revDurMin;

  const now = new Date();
  const nowSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
  const nowMin = nowSec / 60;

  let phaseLbl = tDict.tripPhaseBefore;
  let phase = "before";
  let remainSec = Math.max(0, depMin * 60 - nowSec);
  let pct = 0;
  let nextSeg = fwd[0] || rev[0] || null;
  let nextRole = tDict.flowDep;

  if (nowMin < depMin) {
    phaseLbl = tDict.tripPhaseBefore;
    remainSec = depMin * 60 - nowSec;
    pct = 0;
    nextSeg = fwd[0] || null;
    nextRole = tDict.flowDep;
  } else if (nowMin < fwdArrMin) {
    phaseLbl = tDict.tripPhaseOutbound;
    phase = "out";
    remainSec = fwdArrMin * 60 - nowSec;
    pct = Math.round(((nowMin - depMin) / Math.max(1, revArrMin - depMin)) * 100);
    nextSeg = fwd[fwd.length - 1] || fwd[0] || null;
    nextRole = tDict.flowDep;
  } else if (nowMin < revDepMin) {
    phaseLbl = tDict.tripPhaseOnSite;
    phase = "site";
    remainSec = revDepMin * 60 - nowSec;
    pct = Math.round(((nowMin - depMin) / Math.max(1, revArrMin - depMin)) * 100);
    nextSeg = rev[0] || null;
    nextRole = tDict.flowRet;
  } else if (nowMin < revArrMin) {
    phaseLbl = tDict.tripPhaseReturn;
    phase = "ret";
    remainSec = revArrMin * 60 - nowSec;
    pct = Math.round(((nowMin - depMin) / Math.max(1, revArrMin - depMin)) * 100);
    nextSeg = rev[rev.length - 1] || rev[0] || null;
    nextRole = tDict.flowRet;
  } else {
    phaseLbl = tDict.tripPhaseDone;
    phase = "done";
    remainSec = (depMin + 1440) * 60 - nowSec;
    pct = 100;
    nextSeg = fwd[0] || null;
    nextRole = tDict.flowDep;
  }

  let nextText = `${nextRole}: ${dep} → ${arr}`;
  if (nextSeg) {
    const line = nextSeg.line || nextSeg.lineName || String(nextSeg.mode || "").toUpperCase();
    const fromNm = nextSeg.from?.name || "Start";
    const toNm = nextSeg.to?.name || "Ziel";
    const plat = nextSeg.from?.platform ? ` (${tDict.platform} ${nextSeg.from.platform})` : "";
    nextText = `${nextRole} · ${nextSeg.dep || dep} ${line ? `[${line}] ` : ""}${fromNm}${plat} → ${toNm}`;
  }

  return {
    dep,
    fwdArr,
    revDep,
    arr,
    phaseLbl,
    countdown: formatCountdown(remainSec),
    countdownShort: formatCountdownShort(remainSec),
    pct: Math.max(0, Math.min(100, pct)),
    sitePct: phase === "before" || phase === "out" ? 0 : phase === "site" ? Math.round(((nowMin - fwdArrMin) / Math.max(1, stayMin)) * 100) : 100,
    phase,
    stayMin,
    nextText
  };
}

function updateTripCountdown() {
  const resolved = resolveActiveTrip(state.activeTrip);
  if (!resolved) {
    stopTripTicker();
    return;
  }
  const prog = computeTripProgress(resolved.t, resolved.selWin);
  resolved.phase0 = $("#tripView")?.dataset.phase;
  const phEl = $("#tripPhaseLbl");
  const cdEl = $("#tripCountdownVal");
  const barEl = $("#tripProgressFill");
  const nxEl = $("#tripNextStep");
  if (phEl) phEl.textContent = prog.phaseLbl;
  if (cdEl) cdEl.textContent = prog.countdownShort;
  if (barEl) barEl.style.width = `${prog.sitePct}%`;
  if (nxEl) nxEl.textContent = `${T().tripNextStep}: ${prog.nextText}`;
  if (prog.phase !== resolved.phase0) renderTripView();
}

function startTrip(t) {
  if (!t || !BY_ID[t.id]) return;
  if (state.activeTrip && state.activeTrip.tourId === t.id) {
    setTab("unterwegs");
    return;
  }
  if (state.activeTrip && state.activeTrip.reminder) {
    cancelActiveTripReminder({silent: true});
  }
  const selWin = getSelectedWindow(t, state.base, state.day);
  state.activeTrip = {
    tourId: t.id,
    base: state.base,
    day: state.day,
    winIdx: selWin.winIdx,
    revIdx: selWin.revIdx,
    stayTargetMin: state.stayTargetMin,
    startedAt: Date.now(),
    reminder: null
  };
  store.set("activeTrip", state.activeTrip);
  setTab("unterwegs");
  toast(T().tripStarted);
}

function stopTrip() {
  stopTripTicker();
  if (state.activeTrip && state.activeTrip.reminder) {
    cancelActiveTripReminder({silent: true});
  }
  state.activeTrip = null;
  store.set("activeTrip", null);
  renderTripView();
  if (state.sel && BY_ID[state.sel]) renderDetail(BY_ID[state.sel]);
  toast(T().tripEnded);
}

function scheduleTripReminder() {
  const resolved = resolveActiveTrip(state.activeTrip);
  if (!resolved) return;
  const {t, trip, selWin} = resolved;
  const tDict = T();
  const target = state.remindTarget === "ret" ? "ret" : "dep";
  const leadMin = state.remindLead === 30 ? 30 : 15;
  const targetHHMM = target === "ret" ? (selWin.rev[0]?.dep || "") : (selWin.fwd[0]?.dep || "");
  const targetM = parseHHMM(targetHHMM);
  if (targetM === null) {
    toast(tDict.tripRemindPast);
    return;
  }
  const now = new Date();
  const targetDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), Math.floor(targetM / 60), targetM % 60, 0, 0);
  if ((toAbsMin(targetHHMM) ?? 0) >= 1440 && targetDate.getTime() <= now.getTime()) {
    targetDate.setDate(targetDate.getDate() + 1);
  }
  if (targetDate.getTime() <= now.getTime()) {
    targetDate.setDate(targetDate.getDate() + 1);
  }
  const triggerAt = targetDate.getTime() - leadMin * 60000;
  if (triggerAt <= Date.now()) {
    toast(tDict.tripRemindPast);
    return;
  }
  const trigDate = new Date(triggerAt);
  const triggerHHMM = `${String(trigDate.getHours()).padStart(2, "0")}:${String(trigDate.getMinutes()).padStart(2, "0")}`;
  const id = `sw_trip_${trip.tourId.replace(/[^A-Za-z0-9_-]/g, "_")}_${target}`;
  const title = tourTitle(t);
  const targetLbl = target === "ret" ? tDict.tripRemindRet : tDict.tripRemindDep;
  const body = `${targetLbl} ${targetHHMM} (${tDict.tripRemindLead(leadMin)})`;

  if (trip.reminder && trip.reminder.id) {
    cancelActiveTripReminder({silent: true});
  }

  const nextRem = {id, target, leadMin, triggerAt, targetHHMM, triggerHHMM, title, text: body, status: "scheduled"};
  if (NATIVE && typeof NATIVE.scheduleReminder === "function") {
    let res = "";
    try {
      res = String(NATIVE.scheduleReminder(id, triggerAt, title, body) || "");
    } catch (e) {
      res = "error:exception";
    }
    if (res === "scheduled") {
      state.activeTrip.reminder = nextRem;
      store.set("activeTrip", state.activeTrip);
      renderTripView();
      toast(tDict.tripRemindSaved(triggerHHMM));
    } else if (res === "permission_needed") {
      nextRem.status = "pending";
      state.activeTrip.reminder = nextRem;
      store.set("activeTrip", state.activeTrip);
      renderTripView();
    } else if (res === "notifications_disabled") {
      toast(tDict.tripRemindPermNeeded);
    } else if (res === "error:past_time") {
      toast(tDict.tripRemindPast);
    } else {
      toast(tDict.tripRemindPermNeeded);
    }
    return;
  }

  if (typeof Notification !== "undefined" && Notification.permission === "default" && typeof Notification.requestPermission === "function") {
    try {
      const p = Notification.requestPermission();
      if (p && typeof p.catch === "function") p.catch(() => {});
    } catch (e) {}
  }
  state.activeTrip.reminder = nextRem;
  store.set("activeTrip", state.activeTrip);
  armInPageReminder(nextRem);
  renderTripView();
  toast(tDict.tripRemindSaved(triggerHHMM));
}

function renderTripView() {
  const tripEl = $("#tripView");
  if (!tripEl) return;
  const tDict = T();
  const resolved = resolveActiveTrip(state.activeTrip);
  if (!resolved) {
    stopTripTicker();
    tripEl.innerHTML = `<div class="tab-empty">
      <div class="tab-empty-ico" aria-hidden="true">🚆</div>
      <h2>${esc(tDict.tripEmptyTitle)}</h2>
      <p>${esc(tDict.tripEmptyBody)}</p>
      <button type="button" class="act primary" data-go-tab="entdecken">${esc(tDict.tripBrowseBtn)}</button>
    </div>${sharedTripsListHTML()}`;
    return;
  }

  const {t, trip, selWin} = resolved;
  const prog = computeTripProgress(t, selWin);
  const bInfo = getBaseInfo(trip.base);
  const dayLbl = (tDict.days.find(d => d[0] === trip.day) || ["", ""])[1];
  const fwdArr = selWin.fwd[selWin.fwd.length - 1]?.arr || prog.fwdArr;
  const revsHtml = (selWin.validRevs || []).map((r, i) => {
    const rDep = r[0]?.dep || "";
    const rArr = r[r.length - 1]?.arr || "";
    const rStay = minDiff(fwdArr, rDep);
    const isLsr = i === selWin.lsrIdx;
    const short = isShortReturn(t, rStay);
    const tip = `${rDep} → ${rArr} (${fmtDur(rStay)} ${tDict.tripOnSite})${short ? " · " + tDict.retTooShort(fmtDur(short)) : ""}`;
    return `<button type="button" class="trip-ret-btn${isLsr ? " lsr" : ""}${short ? " short" : ""}" data-ret="${i}" aria-pressed="${i === selWin.revIdx}" title="${esc(tip)}" aria-label="${esc(tip)}">${short ? "⚠️ " : ""}${isLsr ? `${esc(tDict.tripLastShort)} ` : ""}${esc(rDep)}</button>`;
  }).join("");

  let rem = trip.reminder;
  if (rem && rem.triggerAt && rem.triggerAt <= Date.now() && rem.status !== "pending") {
    trip.reminder = rem = null;
    store.set("activeTrip", trip);
  }
  const remStatus = rem
    ? (rem.status === "pending" ? tDict.tripRemindPending : tDict.tripRemindActive(rem.triggerHHMM, rem.targetHHMM))
    : "";

  // next steps of the current leg (real segments from the plan)
  const tripMid = getMiddle(t, trip.base, trip.day, selWin.fwd || [], selWin.rev || []);
  const leg = prog.phase === "site" ? [...(tripMid && tripMid.segs.length ? tripMid.segs : []), ...(selWin.rev || [])]
    : prog.phase === "ret" ? (selWin.rev || []) : (selWin.fwd || []);
  const segLine = sg => {
    const line = sg.line || sg.lineName || "";
    const isWalk = /walk|foot/i.test(String(sg.mode || "")) || !line;
    const from = sg.from?.name || "";
    const to = sg.to?.name || "";
    return isWalk ? `${tDict.walkLabel} ${from} → ${to}` : `${line} ${tDict.tripFrom} ${from} → ${to}`;
  };
  const nowAbs = new Date().getHours() * 60 + new Date().getMinutes();
  const upcoming = leg.filter(sg => !(/walk|foot/i.test(String(sg.mode || "")) && sg.from?.name && sg.from.name === sg.to?.name))
    .filter(sg => { const a = toAbsMin(sg.arr); return a === null || prog.phase === "before" || prog.phase === "done" || a >= nowAbs; })
    .slice(0, 3);
  const stepsHtml = leg.length ? `<ol class="trip-steps">${upcoming.map(sg => `<li><time>${esc(sg.dep || "")}</time><span>${esc(segLine(sg))}</span></li>`).join("")}<li><time>${esc(leg[leg.length - 1].arr || "")}</time><span>${esc(tDict.tripArrival)} ${esc(leg[leg.length - 1].to?.name || "")}</span></li></ol>` : "";

  const h = t.hike || {};
  const walkMin = Number(h.walkMin) || 0;
  const buffer = walkMin > 0 ? prog.stayMin - walkMin : null;
  const hikeFacts = [];
  if (h.distKm) hikeFacts.push(`${Number(h.distKm).toFixed(1).replace(".", ",")} km`);
  if (walkMin) hikeFacts.push(tDict.tripWalkTime(fmtDur(walkMin)));
  hikeFacts.push(tDict.tripStayTime(fmtDur(prog.stayMin)));
  const nowD = new Date();
  const asOf = `${String(nowD.getHours()).padStart(2, "0")}:${String(nowD.getMinutes()).padStart(2, "0")}`;
  const offline = Boolean(NATIVE) || Boolean(navigator.serviceWorker && navigator.serviceWorker.controller);
  const remTarget = (prog.phase === "before" || prog.phase === "done") ? "dep" : "ret";

  tripEl.dataset.phase = prog.phase;
  tripEl.innerHTML = `<div class="trip-shell">
    <div class="tab-head">
      <div class="tab-head-text">
        <span class="tab-kicker">${esc(tDict.tripAsOf(asOf))} · ${esc(tourTitle(t))}</span>
        <h1 class="tab-title">${esc(tDict.navUnterwegs)}</h1>
      </div>
      ${offline ? `<span class="offline-pill"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>${esc(tDict.offlineReady)}</span>` : ""}
    </div>
    ${trip.base !== state.base ? `<div class="chips"><span class="chip warn">${esc(tDict.tripBaseNote(bInfo.name))}</span></div>` : ""}

    <div class="trip-now">
      <div class="trip-phase-lbl" id="tripPhaseLbl">${esc(prog.phaseLbl)}</div>
      <div class="trip-big"><span class="trip-countdown-val" id="tripCountdownVal">${esc(prog.countdownShort)}</span><span class="trip-big-unit">h</span></div>
      ${stepsHtml}
      <div class="trip-next-step" id="tripNextStep" hidden>${esc(tDict.tripNextStep)}: ${esc(prog.nextText)}</div>
    </div>

    <div class="trip-card">
      <div class="tc-row"><h3>${esc(tDict.hikeLabel.charAt(0).toUpperCase() + tDict.hikeLabel.slice(1))}</h3>${buffer !== null ? `<span class="tc-buffer${buffer < 0 ? " neg" : ""}">${esc(buffer < 0 ? tDict.retTooShort(fmtDur(walkMin)) : tDict.tripBuffer(fmtDur(buffer)))}</span>` : ""}</div>
      <div class="trip-progress-track"><div class="trip-progress-fill" id="tripProgressFill" style="width:${prog.sitePct}%"></div></div>
      <p class="tc-sub">${esc(hikeFacts.join(" · "))} · ${esc(dayLbl)} ${esc(prog.dep)}–${esc(prog.arr)}</p>
    </div>

    ${revsHtml ? `<div class="trip-card">
      <h3>${esc(tDict.tripStayLonger)}</h3>
      <div class="trip-ret-list">${revsHtml}</div>
      <label class="trip-check"><input type="checkbox" id="tripRemindChk" data-rem-auto="${remTarget}"${rem ? " checked" : ""}><span>${esc(tDict.tripRemindChk(state.remindLead === 30 ? 30 : 15))}</span></label>
      ${remStatus ? `<p class="trip-remind-hint">${esc(remStatus)}</p>` : ""}
      ${NATIVE ? "" : `<p class="trip-remind-hint">${esc(tDict.tripRemindWebHint)}</p>`}
    </div>` : ""}

    <div class="trip-actions">
      <button type="button" class="act" id="tripOpenDetailBtn">${esc(tDict.tripDetailBtn)}</button>
      <button type="button" class="act primary" id="tripOpenAppSheetBtn">${esc(tDict.tripAppBtn)}</button>
    </div>
    <button type="button" class="link-btn" id="tripStopBtn">${esc(tDict.tripEndBtn)}</button>
  </div>`;
  startTripTicker();
}

function renderTabViews() {
  if (!state.sel) restoreDetailParts();
  const saved = $("#savedView");
  const trip = $("#tripView");
  if (saved) {
    const showSaved = state.tab === "gemerkt" && !state.sel;
    saved.hidden = !showSaved;
    if (showSaved) renderSavedView();
  }
  if (trip) {
    const showTrip = state.tab === "unterwegs" && !state.sel;
    trip.hidden = !showTrip;
    if (showTrip) renderTripView();
    else stopTripTicker();
  }
}

$("#savedView")?.addEventListener("click", e => {
  const favBtn = e.target.closest(".fav-btn[data-fav-id]");
  if (favBtn) {
    e.stopPropagation();
    toggleFav(favBtn.dataset.favId);
    return;
  }
  if (e.target.closest("#favExportBtn")) {
    exportFavoritesJson();
    return;
  }
  if (e.target.closest("#favImportBtn")) {
    $("#favImportFile")?.click();
    return;
  }
  if (e.target.closest("#favPasteImportBtn")) {
    importFavoritesJson($("#favPasteInput")?.value || "");
    return;
  }
  if (e.target.closest("#favCopyJsonBtn")) {
    const json = buildFavExportJson();
    const area = $("#favPasteInput");
    if (area) area.value = json;
    if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
      try {
        navigator.clipboard.writeText(json).then(() => toast(T().savedCopied), () => {});
      } catch (err) {}
    } else {
      toast(T().savedCopied);
    }
    return;
  }
  const card = e.target.closest(".saved-card[data-saved-id]");
  if (card) openTour(card.dataset.savedId);
});

$("#savedView")?.addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  if (e.target.closest(".fav-btn")) return;
  const card = e.target.closest(".saved-card[data-saved-id]");
  if (card) {
    e.preventDefault();
    openTour(card.dataset.savedId);
  }
});

$("#savedView")?.addEventListener("change", e => {
  const input = e.target.closest("#favImportFile");
  if (!input) return;
  const file = input.files && input.files[0];
  if (!file) return;
  const done = txt => {
    input.value = "";
    importFavoritesJson(txt);
  };
  if (typeof file.text === "function") {
    file.text().then(done, () => {
      input.value = "";
      toast(T().savedImportInvalid);
    });
  } else {
    const reader = new FileReader();
    reader.onload = () => done(reader.result);
    reader.onerror = () => {
      input.value = "";
      toast(T().savedImportInvalid);
    };
    reader.readAsText(file);
  }
});

$("#tripView")?.addEventListener("click", e => {
  const sd = e.target.closest("[data-shared-del]");
  if (sd) {
    state.sharedTrips = state.sharedTrips.filter(x => x.id !== sd.dataset.sharedDel);
    saveSharedTrips();
    renderTripView();
    return;
  }
  const ot = e.target.closest("[data-open-tour]");
  if (ot) {
    e.preventDefault();
    openTour(ot.dataset.openTour);
    return;
  }
  const resolved = resolveActiveTrip(state.activeTrip);
  if (!resolved) return;
  const {t, trip, selWin} = resolved;
  if (e.target.closest("#tripStopBtn")) {
    stopTrip();
    return;
  }
  if (e.target.closest("#tripOpenDetailBtn")) {
    openTour(t.id);
    return;
  }
  if (e.target.closest("#tripOpenAppSheetBtn")) {
    const urls = buildDetailUrls(t, trip.base, trip.day, {
      winIdx: selWin.winIdx,
      revIdx: selWin.revIdx,
      stayTargetMin: trip.stayTargetMin
    });
    openAppSheet(t, urls);
    return;
  }
  const retBtn = e.target.closest(".trip-ret-btn[data-ret]");
  if (retBtn) {
    state.activeTrip.revIdx = parseInt(retBtn.dataset.ret, 10) || 0;
    store.set("activeTrip", state.activeTrip);
    renderTripView();
    toast(T().tripReturnUpdated);
    return;
  }
  const targetBtn = e.target.closest("[data-rem-target]");
  if (targetBtn) {
    state.remindTarget = targetBtn.dataset.remTarget === "ret" ? "ret" : "dep";
    renderTripView();
    return;
  }
  const leadBtn = e.target.closest("[data-rem-lead]");
  if (leadBtn) {
    state.remindLead = parseInt(leadBtn.dataset.remLead, 10) === 30 ? 30 : 15;
    renderTripView();
    return;
  }
  if (e.target.closest("#tripRemindBtn")) {
    scheduleTripReminder();
    return;
  }
  const chk = e.target.closest("#tripRemindChk");
  if (chk) {
    if (chk.checked) {
      state.remindTarget = chk.dataset.remAuto === "ret" ? "ret" : "dep";
      scheduleTripReminder();
    } else {
      cancelActiveTripReminder();
    }
    if (state.tab === "unterwegs" && !state.sel) renderTripView();
    return;
  }
  if (e.target.closest("#tripCancelRemindBtn")) {
    cancelActiveTripReminder();
    return;
  }
});

function setTab(tab, opts) {
  const next = ["entdecken", "karte", "gemerkt", "unterwegs"].includes(tab) ? tab : "entdecken";
  closeAppSheet({clear: true});
  if (state.sel) {
    state.sel = null;
    state.winIdx = null;
    state.revIdx = null;
    document.body.classList.remove("detail-open");
    try {
      if (history.state && history.state.tour) {
        suppressPopUntil = Date.now() + 800;
        history.back();
      }
    } catch (e) {}
  }
  const mw = $("#mapWrap");
  if (mw) mw.classList.remove("full", "mini", "menu-open");
  $("#layerMenu")?.classList.remove("show");
  document.body.classList.remove("map-full-open");

  state.tab = next;
  document.body.dataset.tab = next;
  renderBottomNav();
  renderHeader();
  renderTabViews();

  const sheet = $("#mapSheet");
  if (next === "karte") {
    if (sheet) sheet.hidden = false;
    setMapSheetSnap(state.mapSheetSnap || "half");
    drawOverview();
    map.invalidateSize();
    if (!(opts && opts.preserveView)) fitCurrent();
    renderMapSheet();
    setTimeout(() => {
      if (state.tab === "karte" && !state.sel) {
        map.invalidateSize();
        if (!(opts && opts.preserveView)) fitCurrent();
        renderMapSheet();
      }
    }, 150);
  } else {
    if (sheet) sheet.hidden = true;
    if (next === "entdecken") {
      renderList();
      drawOverview();
      map.invalidateSize();
      fitCurrent();
      setTimeout(() => {
        if (state.tab === "entdecken" && !state.sel) {
          map.invalidateSize();
          fitCurrent();
        }
      }, 150);
    }
  }
}

document.querySelector("main.content")?.addEventListener("click", e => {

function renderList() {
  const vis = TOURS.filter(matchesFilter);
  renderDiscoverHighlights(vis);
  if (!vis.length) {
    $("#list").innerHTML = `<div class="box">${state.lang === "en" ? "No tours match your filter." : "Keine Touren für diesen Filter gefunden."}</div>`;
    return;
  }
  const tDict = T();
  if (state.sort) {
    const keyed = vis.map(t => [sortKey(t), t]).sort((x, y) => x[0] - y[0]).map(x => x[1]);
    $("#list").innerHTML = `<div class="region-group" data-region="sorted">
      <div class="region-head" style="cursor:default"><span>${esc(tDict.sortedHead(keyed.length))}</span><span class="reg-meta">${esc(tDict.sortOpts[["", "ride", "stay", "km", "hm"].indexOf(state.sort)] || "")}</span></div>
      <div class="region-cards">${keyed.map(cardHTML).join("")}</div>
    </div>`;
    return;
  }
  const buckets = new Map();
  tDict.regGroups.forEach(([k]) => buckets.set(k, []));
  vis.forEach(t => {
    const rk = buckets.has(t.region) ? t.region : "weitere";
    buckets.get(rk).push(t);
  });

  const sections = [];
  tDict.regGroups.forEach(([rk, label]) => {
    const items = buckets.get(rk) || [];
    if (!items.length) return;
    const shut = state.collapsedRegions.has(rk);
    sections.push(`<div class="region-group${shut ? " collapsed" : ""}" data-region="${esc(rk)}">
      <button type="button" class="region-head" aria-expanded="${shut ? "false" : "true"}">
        <span>${esc(label)}</span>
        <span class="reg-meta"><span>(${items.length})</span><span class="reg-chev">▾</span></span>
      </button>
      <div class="region-cards">${items.map(cardHTML).join("")}</div>
    </div>`);
  });
  $("#list").innerHTML = sections.join("");
}

$("#list").addEventListener("click", e => {
  const favBtn = e.target.closest(".fav-btn[data-fav-id]");
  if (favBtn) {
    e.stopPropagation();
    toggleFav(favBtn.dataset.favId);
    return;
  }
  const head = e.target.closest(".region-head");
  if (head) {
    const grp = head.closest(".region-group");
    if (grp) {
      const collapsed = grp.classList.toggle("collapsed");
      head.setAttribute("aria-expanded", String(!collapsed));
      const rk = grp.dataset.region;
      if (rk && rk !== "sorted") {
        if (collapsed) state.collapsedRegions.add(rk); else state.collapsedRegions.delete(rk);
        store.set("collapsedRegions", [...state.collapsedRegions]);
      }
    }
    return;
  }
  const card = e.target.closest(".card");
  if (!card) return;
  openTour(card.dataset.id);
});

/* ---------- Deep Links & GPX ---------- */
function cleanStopId(st) {
  if (!st || typeof st !== "object") return "";
  const raw = st.remoteId || st.ibnr || st.dhid || "";
  const s = String(raw).trim();
  if (!s || /L=null|L=undefined|L=None|^null$|^undefined$|^None$/i.test(s)) return "";
  return s;
}

function cleanStopName(st, fallback) {
  const raw = (st && (st.stopName || st.name)) || fallback || "Jugenheim";
  const s = String(raw).trim();
  if (!s || /^(null|undefined|none)$/i.test(s)) return fallback || "Jugenheim";
  return s;
}

function isoToDDMMYYYY(iso) {
  const m = String(iso || "2026-11-24").match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? `${m[3]}.${m[2]}.${m[1]}` : "24.11.2026";
}

function isoDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

/* Deep-link date: the timetable reference day while it is still ahead, otherwise the next matching
   weekday / Saturday / Sunday from today (links must never search in the past). */
function linkDateIso(dayKey) {
  const ref = (DATA.days && DATA.days[dayKey]) || "";
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  if (ref) {
    const r = new Date(ref + "T00:00:00");
    if (!Number.isNaN(r.getTime()) && r >= today) return ref;
  }
  const want = dayKey === "sa" ? [6] : dayKey === "so" ? [0] : [1, 2, 3, 4, 5];
  const d = new Date(today);
  for (let i = 0; i < 8; i++) {
    if (want.includes(d.getDay())) return isoDate(d);
    d.setDate(d.getDate() + 1);
  }
  return ref || isoDate(today);
}

/* DELFI stop names are "Ort, Haltestelle"; DB's name search expects "Haltestelle, Ort" and otherwise
   picks look-alikes (device test: "Schriesheim, Rathaus" → "Altenbach Rathaus, Schriesheim"). */
function dbStopName(stop, fallback) {
  const nm = cleanStopName(stop, fallback);
  const rid = String((stop && stop.remoteId) || "");
  const delfi = /@L=de:/.test(rid) || (stop && stop.dhid && !/@L=\d/.test(rid));
  const m = delfi ? nm.match(/^([^,]+),\s*([^,]+)$/) : null;
  return m ? `${m[2]}, ${m[1]}` : nm;
}

function buildDbUrl(fromStop, toStop, dayKey, depHHMM) {
  const dayIso = linkDateIso(dayKey);
  const hm = (depHHMM && /^\d{2}:\d{2}$/.test(depHHMM)) ? depHHMM : "08:30";
  const so = encodeURIComponent(dbStopName(fromStop, "Jugenheim"));
  const zo = encodeURIComponent(dbStopName(toStop, "Neustadt (Weinstr) Hbf"));
  let frag = `sts=true&so=${so}&zo=${zo}&kl=2&hd=${encodeURIComponent(dayIso + "T" + hm + ":00")}&vm=00,01,02,03,04,05,06,07,08,09&dlt=true`;
  const soid = cleanStopId(fromStop);
  const zoid = cleanStopId(toStop);
  if (soid) frag += `&soid=${encodeURIComponent(soid)}`;
  if (zoid) frag += `&zoid=${encodeURIComponent(zoid)}`;
  return `https://www.bahn.de/buchung/fahrplan/suche#${frag}`;
}

const NATIVE = (typeof window !== "undefined" && window.SWNative) ? window.SWNative : null;
const IS_ANDROID = Boolean(NATIVE) || /Android/i.test((typeof navigator !== "undefined" && navigator.userAgent) || "");

/* HAFAS apps (München Navigator, NVV): query?S=…&Z=…&V1=…&V2=…&date=…&time=… */
/* HAFAS apps (München Navigator, NVV) – their name search only covers the own region (MVV: Bavaria), but the
   link handler (de.hafas.android.c, read from the APK 2026-11-24) also takes coordinate locations:
   SKOORD=1&SX=<lon·1e6>&SY=<lat·1e6>&SNAME=…, same with Z…; start=1 runs the search at once.
   Verified on the device: Jugenheim → Dossenheim and Schriesheim → Jugenheim with live data. */
function buildHafasNativeUrl(scheme, pkg, fromStop, toStop, dayKey, depHHMM) {
  const dateStr = isoToDDMMYYYY(linkDateIso(dayKey));
  // coordinate starts add a short walk to the platform → search 5 min earlier so the planned train is listed
  const hm0 = (depHHMM && /^\d{2}:\d{2}$/.test(depHHMM)) ? depHHMM : "08:30";
  const m0 = Math.max(0, parseInt(hm0.slice(0, 2), 10) * 60 + parseInt(hm0.slice(3), 10) - 5);
  const hm = `${String(Math.floor(m0 / 60)).padStart(2, "0")}:${String(m0 % 60).padStart(2, "0")}`;
  const loc = (pre, st, fb) => {
    const name = encodeURIComponent(cleanStopName(st, fb));
    const lat = Number(st && st.lat), lon = Number(st && st.lon);
    if (!isFinite(lat) || !isFinite(lon) || (!lat && !lon)) return `${pre}=${name}`;
    return `${pre}KOORD=1&${pre}X=${Math.round(lon * 1e6)}&${pre}Y=${Math.round(lat * 1e6)}&${pre}NAME=${name}`;
  };
  const path = `query?${loc("S", fromStop, "Jugenheim Bickenbacher Straße")}&${loc("Z", toStop, "Ziel")}`
    + `&date=${encodeURIComponent(dateStr)}&time=${encodeURIComponent(hm)}&start=1`;
  if (IS_ANDROID && pkg) {
    const fb = encodeURIComponent(buildDbUrl(fromStop, toStop, dayKey, depHHMM));
    return `intent://${path}#Intent;scheme=${scheme};package=${pkg};S.browser_fallback_url=${fb};end`;
  }
  return `${scheme}://${path}`;
}

/* München Navigator "universal link" (context=TP): the only link form with a via point (VID, exactly one).
   Locations as HAFAS IDs: DB IDs (U=80, numeric L) as they are, otherwise address IDs with coordinates (A=2),
   which the app resolves anywhere in Germany. Device test: Jugenheim → via Koblenz Hbf → Limburg with live data. */
function hafasLid(st, fb) {
  const rid = String((st && st.remoteId) || "");
  if (/@U=80@L=\d+@/.test(rid)) return rid;
  const name = cleanStopName(st, fb);
  return `A=2@O=${name}@X=${Math.round(Number(st && st.lon) * 1e6)}@Y=${Math.round(Number(st && st.lat) * 1e6)}@`;
}
function buildMvvViaUrl(fromStop, viaStop, toStop, dayKey, depHHMM) {
  const dateStr = isoToDDMMYYYY(linkDateIso(dayKey));
  const hm = (depHHMM && /^\d{2}:\d{2}$/.test(depHHMM)) ? depHHMM : "08:30";
  const q = `context=TP&ulVersion=1&SID=${encodeURIComponent(hafasLid(fromStop, "Start"))}&VID=${encodeURIComponent(hafasLid(viaStop, "Via"))}`
    + `&ZID=${encodeURIComponent(hafasLid(toStop, "Ziel"))}&date=${encodeURIComponent(dateStr)}&time=${encodeURIComponent(hm)}&start=1`;
  const path = `s-bahn-muenchen.hafas.de/landingpage/universal_linking/index.html?${q}`;
  if (IS_ANDROID) {
    const fb = encodeURIComponent(buildDbUrl(fromStop, toStop, dayKey, depHHMM));
    return `intent://${path}#Intent;scheme=https;package=de.hafas.android.sbm;S.browser_fallback_url=${fb};end`;
  }
  return `https://${path}`;
}

function buildMvvAppUrl(fromStop, toStop, dayKey, depHHMM, opts) {
  return buildHafasNativeUrl("muenchennavigator", "de.hafas.android.sbm", fromStop, toStop, dayKey, depHHMM, opts);
}

function buildNvvAppUrl(fromStop, toStop, dayKey, depHHMM, opts) {
  return buildHafasNativeUrl("nvv", "de.hafas.android.nvv", fromStop, toStop, dayKey, depHHMM, opts);
}

function buildDbAppUrl(fromStop, toStop, dayKey, depHHMM) {
  const dayIso = linkDateIso(dayKey);
  const hm = (depHHMM && /^\d{2}:\d{2}$/.test(depHHMM)) ? depHHMM : "08:30";
  const so = encodeURIComponent(dbStopName(fromStop, "Jugenheim Bickenbacher Straße, Seeheim-Jugenheim"));
  const zo = encodeURIComponent(dbStopName(toStop, "Neustadt (Weinstr) Hbf"));
  const hd = encodeURIComponent(`${dayIso}T${hm}:00`);
  const q = `SO=${so}&ZO=${zo}&hd=${hd}&dlt=true&vm=03,04,05,06,07,08,09&sts=true`;
  const webUrl = buildDbUrl(fromStop, toStop, dayKey, depHHMM);
  if (IS_ANDROID) {
    const fb = encodeURIComponent(webUrl);
    return `intent://www.bahn.de/buchung/start?${q}#Intent;scheme=dbnav;package=de.hafas.android.db;S.browser_fallback_url=${fb};end`;
  }
  return webUrl;
}

function geoParts(stop, fallbackName) {
  const lat = Number(stop?.lat || 49.350000).toFixed(6);
  const lon = Number(stop?.lon || 8.150000).toFixed(6);
  const nm = encodeURIComponent(cleanStopName(stop, fallbackName || "Ziel"));
  return {lat, lon, nm, data: `${lat},${lon}?q=${lat},${lon}(${nm})`};
}

function buildGeoUrl(stop, fallbackName) {
  return `geo:${geoParts(stop, fallbackName).data}`;
}

/* myVRN (com.mdv.VRNCompanion) accepts geo: only → trip search from the current position to the destination */
function buildMyVrnUrl(stop, fallbackName) {
  const g = geoParts(stop, fallbackName);
  if (IS_ANDROID) {
    const fb = encodeURIComponent(`https://www.vrn.de/fahrplanauskunft/`);
    return `intent:${g.data}#Intent;scheme=geo;package=com.mdv.VRNCompanion;S.browser_fallback_url=${fb};end`;
  }
  return `geo:${g.data}`;
}

/* Mapy (cz.seznam.mapy) opens mapy.com URL-API links directly in the app (verified app links) */
function buildMapyShowUrl(stop) {
  const lat = Number(stop?.lat || 49.35).toFixed(6);
  const lon = Number(stop?.lon || 8.15).toFixed(6);
  return `https://mapy.com/fnc/v1/showmap?mapset=outdoor&center=${lon},${lat}&zoom=15&marker=true`;
}

function buildMapyRouteUrl(t) {
  const pts = hikePolyPts(t);
  if (pts.length < 2) return "";
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + haversineM(pts[i - 1], pts[i]));
  const total = cum[cum.length - 1];
  const n = Math.min(13, Math.max(1, Math.round(total / 450)));
  const wps = [];
  let j = 0;
  for (let k = 1; k <= n; k++) {
    const target = (total * k) / (n + 1);
    while (j < cum.length - 1 && cum[j] < target) j++;
    wps.push(pts[j]);
  }
  const f = p => `${p[1].toFixed(5)},${p[0].toFixed(5)}`;
  return `https://mapy.com/fnc/v1/route?mapset=outdoor&start=${f(pts[0])}&end=${f(pts[pts.length - 1])}&routeType=foot_hiking&waypoints=${wps.map(f).join(";")}`;
}

function buildMvvWebUrl(fromStop, toStop, dayKey, depHHMM) {
  const dayIso = linkDateIso(dayKey).replace(/-/g, "");
  const hm = ((depHHMM && /^\d{2}:\d{2}$/.test(depHHMM)) ? depHHMM : "08:30").replace(":", "");
  const p = new URLSearchParams({
    language: state.lang === "en" ? "en" : "de",
    type_origin: "any",
    name_origin: cleanStopName(fromStop, "Jugenheim"),
    type_destination: "any",
    name_destination: cleanStopName(toStop, "Neustadt"),
    itdDate: dayIso,
    itdTime: hm,
    itdTripDateTimeDepArr: "dep",
    inclMOT_0: "off"
  });
  return `https://efa.mvv-muenchen.de/mvv/XSLT_TRIP_REQUEST2?${p.toString()}`;
}

function buildGmapsUrl(fromStop, toStop, mode) {
  const fLat = Number(fromStop?.lat || 49.753891).toFixed(6);
  const fLon = Number(fromStop?.lon || 8.629438).toFixed(6);
  const tLat = Number(toStop?.lat || 49.350000).toFixed(6);
  const tLon = Number(toStop?.lon || 8.150000).toFixed(6);
  return `https://www.google.com/maps/dir/?api=1&origin=${fLat},${fLon}&destination=${tLat},${tLon}&travelmode=${mode || "transit"}`;
}

function buildGpxXml(t) {
  const bInfo = getBaseInfo(state.base);
  const title = tourTitle(t);
  const sub = tourSub(t);
  const ss = t.transit?.startStop || {name: "Tour Start", lat: 49.35, lon: 8.15};
  const es = t.transit?.endStop || ss;
  const h = t.hike || {};

  const wpts = [
    {lat: bInfo.lat, lon: bInfo.lon, name: `Base (${state.base}): ${bInfo.name}`},
    {lat: Number(ss.lat || 49.35), lon: Number(ss.lon || 8.15), name: `Start: ${ss.name || "Start"}`}
  ];
  if (es && es.name && es.name !== ss.name) {
    wpts.push({lat: Number(es.lat || 49.36), lon: Number(es.lon || 8.16), name: `Ziel: ${es.name}`});
  }

  let rawPts = (h.hasGpx && h.poly5) ? decodePoly(h.poly5) : [];
  if (rawPts.length < 12) {
    const {fwd} = getSelectedWindow(t, state.base, state.day);
    fwd.forEach(s => rawPts.push(...getSegmentCoords(s, bInfo, ss)));
  }
  // Ensure at least 12 valid points within Southwest bounds (47..51.5, 6..11)
  const swPts = rawPts.filter(p => p[0] >= 47.0 && p[0] <= 51.5 && p[1] >= 6.0 && p[1] <= 11.0);
  const finalPts = [];
  if (swPts.length >= 12) {
    finalPts.push(...swPts);
  } else {
    const lat0 = Math.max(47.5, Math.min(51.0, Number(ss.lat || 49.35)));
    const lon0 = Math.max(6.5, Math.min(10.5, Number(ss.lon || 8.15)));
    const lat1 = Math.max(47.5, Math.min(51.0, Number(es.lat || (lat0 + 0.04))));
    const lon1 = Math.max(6.5, Math.min(10.5, Number(es.lon || (lon0 + 0.04))));
    for (let k = 0; k < 15; k++) {
      const f = k / 14;
      finalPts.push([lat0 + (lat1 - lat0) * f, lon0 + (lon1 - lon0) * f]);
    }
  }

  const prof = Array.isArray(h.elevProfile) && h.elevProfile.length ? h.elevProfile : [];
  const trkptsXml = finalPts.map((pt, i) => {
    let ele = 240 + (i % 7) * 12;
    if (prof.length) {
      const pIdx = Math.min(prof.length - 1, Math.floor((i / finalPts.length) * prof.length));
      if (Array.isArray(prof[pIdx]) && prof[pIdx][1] != null) ele = Number(prof[pIdx][1]);
    }
    return `      <trkpt lat="${pt[0].toFixed(6)}" lon="${pt[1].toFixed(6)}"><ele>${ele.toFixed(1)}</ele></trkpt>`;
  }).join("\n");

  const wptsXml = wpts.map(w =>
    `  <wpt lat="${Number(w.lat).toFixed(6)}" lon="${Number(w.lon).toFixed(6)}"><name>${esc(w.name)}</name></wpt>`
  ).join("\n");

  return `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Suedwest-Touren" xmlns="http://www.topografix.com/GPX/1/1">
  <metadata>
    <name>${esc(title)}</name>
    <desc>${esc(sub)} (${esc(state.base)})</desc>
  </metadata>
${wptsXml}
  <trk>
    <name>${esc(title)}</name>
    <trkseg>
${trkptsXml}
    </trkseg>
  </trk>
</gpx>`;
}

function downloadGPX(t) {
  if (!t) return;
  const xml = buildGpxXml(t);
  if (NATIVE && typeof NATIVE.openGpx === "function") {
    // Native app: hand the track straight to Mapy via FileProvider (no Download folder)
    const res = NATIVE.openGpx(`${t.id}.gpx`, xml, tourTitle(t));
    if (res) toast(String(res));
    return;
  }
  const blob = new Blob([xml], {type: "application/gpx+xml;charset=utf-8"});
  const fname = `${t.id}.gpx`;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = fname;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

function renderSegmentStep(s, idx, allSegs, globalOffset) {
  const tDict = T();
  const mode = String(s.mode || (s.kind === "walk" ? "walk" : "re")).toLowerCase();
  const bgCol = MODE_COLORS[mode] || "#0F4C5C";
  const icon = MODE_ICONS[mode] || "🚆";
  const dep = s.dep || "08:00";
  const arr = s.arr || "08:45";
  const dur = minDiff(dep, arr);
  const fromName = s.from?.name || "Start";
  const toName = s.to?.name || "Ziel";
  const fromPlat = s.from?.platform || (s.kind === "ride" && mode !== "bus" ? "1" : "");
  const toPlat = s.to?.platform || "";

  // Compute transfer gap to next ride segment
  let transferVal = s.transfer != null ? Number(s.transfer) : null;
  if (transferVal === null && s.kind === "ride") {
    for (let k = idx + 1; k < allSegs.length; k++) {
      if (allSegs[k].kind === "ride") {
        transferVal = minDiff(arr, allSegs[k].dep);
        break;
      }
    }
  }
  const transferHtml = (transferVal !== null && transferVal >= 4 && transferVal <= 240)
    ? `<span class="chip ok">🔄 ${esc(tDict.transfer(transferVal))}</span>`
    : "";

  const warnsHtml = (Array.isArray(s.warnings) ? s.warnings : []).map(w =>
    `<span class="chip warn">⚠️ ${esc(w.text || w.type || "Hinweis")}</span>`
  ).join("");

  const inter = Array.isArray(s.intermediateStops) ? s.intermediateStops.filter(x => x && x.name) : [];
  const interHtml = inter.length > 0
    ? `<div class="stops-exp"><button type="button" class="stops-btn" aria-expanded="false">▸ ${esc(tDict.stopsCount(inter.length))}</button><ul class="stops-list" hidden>${
        inter.map(st => `<li>${esc(st.arr || st.dep || "")} ${esc(st.name)}${st.platform ? ` (${tDict.platform} ${esc(st.platform)})` : ""}</li>`).join("")
      }</ul></div>`
    : "";

  const lineLbl = s.kind === "walk" ? tDict.walkLabel : s.kind === "hike" ? tDict.hikeLabel : (s.line || s.lineName || mode.toUpperCase());
  const stepId = globalOffset + idx;
  const stepFrom = s.from || getBaseInfo(state.base);
  const stepTo = s.to || {name: toName};
  const isRide = s.kind !== "walk" && s.kind !== "hike";
  const stepDbUrl = isRide ? buildDbUrl(stepFrom, stepTo, state.day, dep) : "";
  const stepGmUrl = buildGmapsUrl(stepFrom, s.to || {lat: 49.35, lon: 8.15}, isRide ? "transit" : "walking");

  return `<div class="st" id="tl-step-${stepId}" data-step="${stepId}" data-i="${stepId}" style="--mc:${bgCol}">
    <div class="st-head">
      <span class="time">${esc(dep)} → ${esc(arr)}</span>
      <span class="badge mode-badge" style="background-color:${bgCol};color:#ffffff">${icon} ${esc(lineLbl)}</span>
      <span class="dur">${dur} Min.</span>
    </div>
    <div class="route">
      ${esc(fromName)}${fromPlat ? ` <small>(${esc(tDict.platform)} ${esc(fromPlat)})</small>` : ""}
      → ${esc(toName)}${toPlat ? ` <small>(${esc(tDict.platform)} ${esc(toPlat)})</small>` : ""}
    </div>
    ${s.dest ? `<div style="font-size:12px;color:var(--text-2);margin-top:2px">→ ${esc(s.dest)}${s.op ? ` · ${esc(s.op)}` : ""}</div>` : ""}
    <div class="chips">${transferHtml}${warnsHtml}</div>
    ${interHtml}
    <div class="st-actions">
      ${stepDbUrl ? `<a class="mini-btn" href="${esc(stepDbUrl)}" target="_blank" rel="noopener">🚆 DB</a>` : ""}
      <a class="mini-btn" href="${esc(stepGmUrl)}" target="_blank" rel="noopener">🗺️ Maps</a>
    </div>
  </div>`;
}

function elevProfileHTML(t) {
  const h = t.hike || {};
  const prof = Array.isArray(h.elevProfile) ? h.elevProfile.filter(p => Array.isArray(p) && p.length >= 2 && p[1] != null) : [];
  if (prof.length < 3) return "";
  const tDict = T();
  const W = 340, H = 120, PL = 34, R = 8, TOP = 10, B = 20;
  const kmMax = Math.max(0.1, Number(prof[prof.length - 1][0]) || Number(h.distKm) || 1);
  const eles = prof.map(p => Number(p[1]));
  let eMin = Math.min(...eles), eMax = Math.max(...eles);
  if (eMax - eMin < 40) { const mid = (eMax + eMin) / 2; eMin = mid - 20; eMax = mid + 20; }
  const pad = (eMax - eMin) * 0.08;
  eMin -= pad; eMax += pad;
  const x = km => PL + (km / kmMax) * (W - PL - R);
  const y = e => TOP + (1 - (e - eMin) / (eMax - eMin)) * (H - TOP - B);
  const line = prof.map((p, i) => `${i ? "L" : "M"}${x(Number(p[0])).toFixed(1)},${y(Number(p[1])).toFixed(1)}`).join(" ");
  const area = `${line} L${x(kmMax).toFixed(1)},${(H - B).toFixed(1)} L${PL},${(H - B).toFixed(1)} Z`;
  const fmtKm = k => k.toFixed(1).replace(".", state.lang === "en" ? "." : ",");
  const lo = Math.round(Math.min(...eles)), hi = Math.round(Math.max(...eles));
  const ticks = [0, kmMax / 2, kmMax].map(k => `<text class="elev-axis" x="${x(k).toFixed(1)}" y="${H - 5}" text-anchor="${k === 0 ? "start" : k === kmMax ? "end" : "middle"}">${fmtKm(k)} km</text>`).join("");
  return `<div class="box elev-box">
    <h4>${esc(tDict.elevTitle)} · ${esc(fmtKm(Number(h.distKm) || kmMax))} km · ↗ ${Math.round(Number(h.elevGainM) || 0)} hm · ↘ ${Math.round(Number(h.elevLossM) || 0)} hm</h4>
    <svg class="elev-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(tDict.elevTitle)}" data-km="${kmMax}" data-l="${PL}" data-r="${R}" data-w="${W}">
      <line x1="${PL}" y1="${y(hi).toFixed(1)}" x2="${W - R}" y2="${y(hi).toFixed(1)}" stroke="var(--border)" stroke-dasharray="3 3"/>
      <line x1="${PL}" y1="${y(lo).toFixed(1)}" x2="${W - R}" y2="${y(lo).toFixed(1)}" stroke="var(--border)" stroke-dasharray="3 3"/>
      <text class="elev-axis" x="${PL - 4}" y="${(y(hi) + 3).toFixed(1)}" text-anchor="end">${hi} m</text>
      <text class="elev-axis" x="${PL - 4}" y="${(y(lo) + 3).toFixed(1)}" text-anchor="end">${lo} m</text>
      <path d="${area}" fill="var(--ok)" fill-opacity="0.18"/>
      <path d="${line}" fill="none" stroke="var(--ok)" stroke-width="2.2" stroke-linejoin="round"/>
      ${ticks}
      <line class="elev-cursor" x1="0" y1="${TOP}" x2="0" y2="${H - B}" stroke="var(--text-2)" stroke-width="1" visibility="hidden"/>
      <circle class="elev-dot" r="4.5" cx="0" cy="0" fill="var(--amber)" stroke="var(--surface)" stroke-width="1.5" visibility="hidden"/>
    </svg>
    <div class="elev-read" aria-live="polite">${esc(tDict.elevHint)}</div>
  </div>`;
}

let elevMarker = null;
function elevAt(t, km) {
  const prof = (t.hike && t.hike.elevProfile) || [];
  if (!prof.length) return null;
  for (let i = 1; i < prof.length; i++) {
    const [k0, e0] = prof[i - 1];
    const [k1, e1] = prof[i];
    if (km <= k1) {
      const f = k1 > k0 ? (km - k0) / (k1 - k0) : 0;
      return e0 + (e1 - e0) * f;
    }
  }
  return prof[prof.length - 1][1];
}

function hikePointAtFraction(t, frac) {
  const pts = hikePolyPts(t);
  if (pts.length < 2) return null;
  if (!t._cum) {
    const cum = [0];
    for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + haversineM(pts[i - 1], pts[i]));
    t._cum = cum;
  }
  const cum = t._cum;
  const target = cum[cum.length - 1] * Math.max(0, Math.min(1, frac));
  let i = 1;
  while (i < cum.length - 1 && cum[i] < target) i++;
  const seg = cum[i] - cum[i - 1] || 1;
  const f = (target - cum[i - 1]) / seg;
  return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * f, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * f];
}

function onElevPointer(e) {
  const svg = e.target.closest && e.target.closest(".elev-svg");
  const t = BY_ID[state.sel];
  if (!svg || !t) return;
  const rect = svg.getBoundingClientRect();
  const W = Number(svg.dataset.w), PL = Number(svg.dataset.l), R = Number(svg.dataset.r), kmMax = Number(svg.dataset.km);
  const px = ((e.clientX - rect.left) / rect.width) * W;
  const km = Math.max(0, Math.min(kmMax, ((px - PL) / (W - PL - R)) * kmMax));
  const ele = elevAt(t, km);
  if (ele == null) return;
  const cx = PL + (km / kmMax) * (W - PL - R);
  const path = svg.querySelectorAll("path")[1];
  const ys = svg.querySelector(".elev-cursor");
  const dot = svg.querySelector(".elev-dot");
  // project elevation to svg y using the drawn path's bounding box of the axis lines
  const lines = svg.querySelectorAll("line");
  const yHi = Number(lines[0].getAttribute("y1")), yLo = Number(lines[1].getAttribute("y1"));
  const eHi = parseFloat(svg.querySelectorAll("text")[0].textContent), eLo = parseFloat(svg.querySelectorAll("text")[1].textContent);
  const cy = eHi === eLo ? yLo : yLo + (ele - eLo) * (yHi - yLo) / (eHi - eLo);
  ys.setAttribute("x1", cx.toFixed(1)); ys.setAttribute("x2", cx.toFixed(1)); ys.setAttribute("visibility", "visible");
  dot.setAttribute("cx", cx.toFixed(1)); dot.setAttribute("cy", cy.toFixed(1)); dot.setAttribute("visibility", "visible");
  if (path) path.setAttribute("stroke-width", "2.4");
  const kmTxt = km.toFixed(2).replace(".", state.lang === "en" ? "." : ",");
  const read = svg.parentElement.querySelector(".elev-read");
  if (read) read.textContent = `km ${kmTxt} · ${Math.round(ele)} m ü. NN`;
  if (t._elevFitFor !== state.sel + state.base) {
    t._elevFitFor = state.sel + state.base;
    const hp = hikePolyPts(t);
    if (hp.length >= 2) map.fitBounds(L.latLngBounds(hp), {padding: [24, 24], maxZoom: 15});
  }
  const pt = hikePointAtFraction(t, km / kmMax);
  if (pt) {
    if (!elevMarker) {
      elevMarker = L.circleMarker(pt, {radius: 8, color: "#ffffff", weight: 2.5, fillColor: "#f59e0b", fillOpacity: 1});
    } else {
      elevMarker.setLatLng(pt);
    }
    if (!singleGroup.hasLayer(elevMarker)) singleGroup.addLayer(elevMarker);
  }
}

function isPkgInstalled(pkg) {
  if (!pkg || !NATIVE || typeof NATIVE.isInstalled !== "function") return false;
  try { return Boolean(NATIVE.isInstalled(pkg)); } catch (e) { return false; }
}

function buildDetailUrls(t, baseKey, dayKey, winOpts) {
  const bKey = baseKey || state.base;
  const dKey = dayKey || state.day;
  const bInfo = getBaseInfo(bKey);
  const selWin = getSelectedWindow(t, bKey, dKey, winOpts);
  const {fwd} = selWin;
  const title = tourTitle(t);
  const h = t.hike || {};
  const hasTrack = Boolean(h.hasGpx && h.poly5);
  const dep = fwd[0]?.dep || "08:04";
  const viasList = Array.isArray(t.transit?.vias) ? t.transit.vias.filter(v => v && (v.name || v.stopName)) : [];
  const rawStart = t.transit?.startStop || fwd[fwd.length - 1]?.to || {name: title, lat: 49.35, lon: 8.15};
  const rawEnd = t.transit?.endStop || rawStart;
  const baseStopNm = cleanStopName(bInfo, "");
  const isSameAsBase = st => Boolean(st && cleanStopName(st, "") === baseStopNm);
  const destStop = !isSameAsBase(rawStart) ? rawStart : (viasList[0] || fwd[fwd.length - 1]?.to || rawStart);
  const endStop = (!isSameAsBase(rawEnd) && cleanStopName(rawEnd, "") !== cleanStopName(destStop, ""))
    ? rawEnd
    : (viasList[1] || destStop);
  const {rev} = selWin;
  const midSt = getMiddle(t, bKey, dKey, fwd, rev);
  const legs = [];
  if (fwd.length) legs.push({key: "out", from: bInfo, to: fwd[fwd.length - 1].to || destStop, dep: fwd[0].dep});
  if (midSt && midSt.segs.length) legs.push({key: "mid", from: midSt.from, to: midSt.to, dep: midSt.chosen[0][0].dep});
  if (rev.length) legs.push({key: "ret", from: rev[0].from || endStop, to: bInfo, dep: rev[0].dep});
  if (!legs.length) legs.push({key: "out", from: bInfo, to: destStop, dep});
  const legUrl = (app, lg) => {
    switch (app) {
      case "db": return buildDbAppUrl(lg.from, lg.to, dKey, lg.dep);
      case "mvv": return buildMvvAppUrl(lg.from, lg.to, dKey, lg.dep);
      case "nvv": return buildNvvAppUrl(lg.from, lg.to, dKey, lg.dep);
      case "myvrn": return buildMyVrnUrl(lg.to, cleanStopName(lg.to, title));
      case "dbweb": return buildDbUrl(lg.from, lg.to, dKey, lg.dep);
      case "mvvweb": return buildMvvWebUrl(lg.from, lg.to, dKey, lg.dep);
      case "gmaps": return buildGmapsUrl(lg.from, lg.to, "transit");
      default: return buildGeoUrl(lg.to, cleanStopName(lg.to, title));
    }
  };
  const legUrls = {};
  ["db", "mvv", "nvv", "myvrn", "dbweb", "mvvweb", "gmaps", "geo"].forEach(app => {
    legUrls[app] = legs.map(lg => ({key: lg.key, dep: lg.dep, url: legUrl(app, lg)}));
  });
  const outLeg = legs.find(lg => lg.key === "out");
  const midLeg = legs.find(lg => lg.key === "mid");
  if (outLeg && midLeg) {
    legUrls.mvv.splice(2, 0, {key: "chain", dep: outLeg.dep, url: buildMvvViaUrl(outLeg.from, midLeg.from, midLeg.to, dKey, outLeg.dep)});
  }
  return {
    bInfo,
    selWin,
    dep,
    hasTrack,
    destStop,
    endStop,
    legs,
    legUrls,
    dbWebUrl: legUrls.dbweb[0].url,
    dbPrimaryUrl: legUrls.db[0].url,
    mvvAppUrl: legUrls.mvv[0].url,
    nvvAppUrl: legUrls.nvv[0].url,
    myVrnUrl: legUrls.myvrn[0].url,
    naviUrl: legUrls.geo[0].url,
    mvvWebUrl: legUrls.mvvweb[0].url,
    gmapsMainUrl: legUrls.gmaps[0].url,
    mapyUrl: hasTrack ? buildMapyRouteUrl(t) : buildMapyShowUrl(destStop)
  };
}
