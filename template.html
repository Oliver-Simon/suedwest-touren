function fmtHHMMabs(m) {
  if (m == null || isNaN(m)) return "";
  const x = ((Math.round(m) % 1440) + 1440) % 1440;
  return `${String(Math.floor(x / 60)).padStart(2, "0")}:${String(x % 60).padStart(2, "0")}`;
}

function compactLegHTML(segs, stepOffset, isReturn, titleOverride) {
  const tDict = T();
  if (!Array.isArray(segs) || !segs.length) return "";
  const rides = segs.filter(s => s.kind === "ride");
  const primary = rides[0] || segs[0];
  const primaryMode = String(primary.mode || (primary.kind === "walk" ? "walk" : "re")).toLowerCase();
  const bgCol = MODE_COLORS[primaryMode] || "#0F4C5C";
  const dep = segs[0]?.dep || "";
  const arr = segs[segs.length - 1]?.arr || "";
  const dur = Math.max(0, minDiff(dep, arr));
  const fromName = segs[0]?.from?.name || "Start";
  const toName = segs[segs.length - 1]?.to?.name || "Ziel";

  // platforms only from the timetable data – never guessed
  const fromPlat = segs[0]?.from?.platform || "";
  const toPlat = segs[segs.length - 1]?.to?.platform || "";

  const badgeSegs = rides.length ? rides.slice(0, 3) : [primary];
  const badgesHtml = badgeSegs.map(s => {
    const m = String(s.mode || (s.kind === "walk" ? "walk" : "re")).toLowerCase();
    const col = MODE_COLORS[m] || "#0F4C5C";
    const ico = MODE_ICONS[m] || "🚆";
    const lbl = s.kind === "walk" ? tDict.walkLabel : s.kind === "hike" ? tDict.hikeLabel : (s.line || s.lineName || m.toUpperCase());
    return `<span class="badge mode-badge" style="background-color:${col};color:#ffffff">${ico} ${esc(lbl)}</span>`;
  }).join("");

  const transfers = Math.max(0, rides.length - 1);
  let firstGap = null;
  if (transfers >= 1) {
    for (let i = 0; i < segs.length; i++) {
      const s = segs[i];
      if (s.kind !== "ride") continue;
      let tv = s.transfer != null ? Number(s.transfer) : null;
      if (tv === null) {
        for (let k = i + 1; k < segs.length; k++) {
          if (segs[k].kind === "ride") {
            tv = minDiff(s.arr, segs[k].dep);
            break;
          }
        }
      }
      if (tv !== null && tv >= 4 && tv <= 240) {
        firstGap = tv;
        break;
      }
    }
  }
  const transferBadge = transfers === 0
    ? `<span class="chip">${esc(tDict.kpiDirect)}</span>`
    : `<span class="chip ok">🔄 ${esc(transfers === 1 ? tDict.transferSingle : tDict.transfersCount(transfers))}${firstGap ? ` · ${esc(tDict.transfer(firstGap))}` : ""}</span>`;

  const seenWarn = new Set();
  const warnsHtml = segs.flatMap(s => Array.isArray(s.warnings) ? s.warnings : []).map(w => {
    const txt = w.text || w.type || "Hinweis";
    if (seenWarn.has(txt)) return "";
    seenWarn.add(txt);
    return `<span class="chip warn">⚠️ ${esc(txt)}</span>`;
  }).join("");

  const interAll = [];
  segs.forEach(s => {
    if (Array.isArray(s.intermediateStops)) {
      s.intermediateStops.forEach(st => { if (st && st.name) interAll.push(st); });
    }
  });
  const interHtml = interAll.length > 0
    ? `<details class="stops-exp"><summary>${esc(tDict.stopsCount(interAll.length))}</summary><ul class="stops-list">${
        interAll.map(st => `<li>${esc(st.arr || st.dep || "")} ${esc(st.name)}${st.platform ? ` (${esc(tDict.platform)} ${esc(st.platform)})` : ""}</li>`).join("")
      }</ul></details>`
    : "";

  const roleLabel = titleOverride || (isReturn ? tDict.flowRet : tDict.flowDep);
  return `<div class="st compact-step" data-step="${stepOffset}" data-i="${stepOffset}" style="--mc:${bgCol}">
    <div class="st-head">
      <span class="time">${esc(roleLabel)}: ${esc(dep)} → ${esc(arr)}</span>
      ${badgesHtml}
      <span class="dur">${esc(fmtDur(dur))}</span>
    </div>
    <div class="route">
      ${esc(fromName)}${fromPlat ? ` <small>(${esc(tDict.platform)} ${esc(fromPlat)})</small>` : ""}
      → ${esc(toName)}${toPlat ? ` <small>(${esc(tDict.platform)} ${esc(toPlat)})</small>` : ""}
    </div>
    <div class="chips">${transferBadge}${warnsHtml}</div>
    ${interHtml}
  </div>`;
}

/* ---------- Tour page: map on top (scrolls away), swipeable tabs below (mobile) ---------- */
let dtLastIdx = 0;
function dtPaged() { return MOBILE_MQ.matches; }
function dtPageEls() { return [...document.querySelectorAll("#dtPager > .dt-page")]; }
function dtSyncTabs(idx) {
  document.querySelectorAll("#dtTabs [data-page]").forEach((b, i) => {
    b.setAttribute("aria-selected", String(i === idx));
    b.tabIndex = i === idx ? 0 : -1;
  });
}
/* The pager is as tall as the visible tab – otherwise short tabs would end in empty space. */
function dtSizePager() {
  const pager = $("#dtPager");
  if (!pager) return;
  if (!dtPaged()) { pager.style.height = ""; return; }
  const page = dtPageEls()[dtLastIdx];
  if (page) pager.style.height = page.offsetHeight + "px";
  if (pager.scrollTop) pager.scrollTop = 0;
}
const dtResizeObs = window.ResizeObserver ? new ResizeObserver(() => dtSizePager()) : null;
function dtStickTop() {
  const tabs = $("#dtTabs");
  return tabs ? (parseFloat(getComputedStyle(tabs).top) || 0) : 0;
}
function dtTabsTop() {
  const pager = $("#dtPager"), tabs = $("#dtTabs");
  if (!pager || !tabs) return 0;
  return Math.max(0, pager.getBoundingClientRect().top + window.scrollY - tabs.offsetHeight - dtStickTop());
}
function dtRestore(keep) {
  const pager = $("#dtPager");
  if (!pager) return;
  const pages = dtPageEls();
  let idx = pages.findIndex(p => p.dataset.page === (keep ? keep.page : state.detailPage));
  if (idx < 0) idx = 0;
  state.detailPage = pages[idx].dataset.page;
  dtLastIdx = idx;
  if (dtPaged()) pager.scrollLeft = idx * pager.clientWidth;
  dtSyncTabs(idx);
  dtSizePager();
  if (dtResizeObs) { dtResizeObs.disconnect(); pages.forEach(p => dtResizeObs.observe(p)); }
  if (dtTopObs && $("#dtTop")) { dtTopObs.disconnect(); dtTopObs.observe($("#dtTop")); }
  dtTopHeight();
}
function dtShowPage(name, opts) {
  const pager = $("#dtPager");
  if (!pager) return;
  const pages = dtPageEls();
  let idx = pages.findIndex(p => p.dataset.page === name);
  if (idx < 0) idx = 0;
  const target = opts && opts.target ? pages[idx].querySelector(opts.target) : null;
  if (dtPaged()) {
    pager.scrollTo({left: idx * pager.clientWidth, behavior: "smooth"});
    dtPageChanged(idx);
    if (target) {
      const y = target.getBoundingClientRect().top + window.scrollY - ($("#dtTabs")?.offsetHeight || 0) - dtStickTop() - 8;
      window.scrollTo({top: Math.max(0, y), behavior: "smooth"});
    }
  } else {
    (target || pages[idx]).scrollIntoView({behavior: "smooth", block: "start"});
    dtPageChanged(idx);
  }
}
function dtPageChanged(idx) {
  const pages = dtPageEls();
  if (!pages[idx]) return;
  const prev = state.detailPage;
  dtLastIdx = idx;
  state.detailPage = pages[idx].dataset.page;
  dtSyncTabs(idx);
  dtSizePager();
  if (prev !== state.detailPage) {
    // scrolled past the tab bar: start the new tab at its top
    if (dtPaged()) { const top = dtTabsTop(); if (window.scrollY > top) window.scrollTo({top}); }
  }
}
$("#detail").addEventListener("scroll", e => {
  const el = e.target;
  if (!el || el.id !== "dtPager" || !dtPaged()) return;
  if (el.scrollTop) el.scrollTop = 0;
  const idx = Math.round(el.scrollLeft / Math.max(1, el.clientWidth));
  if (idx !== dtLastIdx) dtPageChanged(idx);
}, true);
window.addEventListener("resize", () => {
  const pager = $("#dtPager");
  if (state.sel && pager && dtPaged()) pager.scrollLeft = dtLastIdx * pager.clientWidth;
  dtSizePager();
});

function renderDetailInner(t) {
  if (!t) return;
  const tDict = T();
  const urls = buildDetailUrls(t);
  const {bInfo, selWin, dep, hasTrack, destStop, endStop, mapyUrl} = urls;
  const {fwd, rev, wins, validRevs, revIdx, lsr, fallback, reason, winIdx, recIdx, lsrIdx} = selWin;
  const title = tourTitle(t);
  const sub = tourSub(t);
  const h = t.hike || {};
  const arr = rev[rev.length - 1]?.arr || "–";
  const fwdArr = fwd[fwd.length - 1]?.arr || "–";
  const revDep = rev[0]?.dep || "–";
  const midSt = getMiddle(t, state.base, selWin.fallback ? "wd" : state.day, fwd, rev);
  const hasMid = Boolean(midSt && midSt.segs.length);
  const stayMin = (fwd.length && rev.length) ? Math.max(0, minDiff(fwdArr, revDep)) : 0;
  const diffLbl = tDict.diff[t.difficulty] || t.difficulty || "leicht";
  const regLbl = tDict.reg[t.region] || t.region || "";
  const imgSrc = t.img || `img/${t.id}.jpg`;

  const loopBadge = isClosedLoopHike(t) ? tDict.loopHikeBadge : tDict.roundTripBadge;
  const hasKm = Number(h.distKm) > 0;
  const hasWalk = Number(h.walkMin) > 0;
  const hasElev = Boolean(h.hasGpx) || Number(h.elevGainM) > 0 || Number(h.elevLossM) > 0;
  const kmStr = Number(h.distKm || 0).toFixed(1).replace(".", state.lang === "en" ? "." : ",");
  const hmUp = Math.round(Number(h.elevGainM || 0));
  const hmDown = Math.round(Number(h.elevLossM || 0));

  const rk = ["pfaelzerwald", "schwarzwald", "odenwald"].includes(t.region) ? t.region : "weitere";
  const metaChips = [
    `<span class="chip reg-chip" data-region="${esc(rk)}">${esc(regLbl)}</span>`,
    `<span class="chip">${esc(diffLbl)}</span>`,
    `<span class="chip dt-chip">D-Ticket</span>`,
    `<span class="chip">${esc(loopBadge)}</span>`
  ];
  if (t.tag === "google_maps") {
    metaChips.push(`<span class="chip">📍 Google Maps</span>`);
  }

  // Phase 4: 4 KPI tiles
  const fwdDurMin = fwd.length ? Math.max(0, minDiff(dep, fwdArr)) : 0;
  const fwdRides = fwd.filter(s => s.kind === "ride");
  const fwdTransfers = Math.max(0, fwdRides.length - 1);
  const kpiTransitVal = fwd.length ? fmtDur(fwdDurMin) : "—";
  const kpiTransitSub = fwd.length
    ? (fwdTransfers === 0 ? tDict.kpiDirect : tDict.kpiTransfers(fwdTransfers))
    : "—";
  const kpiHikeVal = hasKm ? `${kmStr} km` : (t.transit?.kind === "shortcut_360" ? tDict.kpiRoundTrip : diffLbl);
  const kpiHikeSub = hasWalk ? fmtDur(h.walkMin) : (hasKm ? tDict.hikeLabel : diffLbl);
  const kpiElevVal = hasElev ? `↗ ${hmUp} hm` : "—";
  const kpiElevSub = hasElev ? `↘ ${hmDown} hm` : regLbl;
  const kpiStayVal = stayMin > 0 ? fmtDur(stayMin) : "—";
  const kpiStaySub = (fwd.length && rev.length) ? `${fwdArr} – ${revDep}` : "";

  const kpiHtml = `<div class="kpi-grid">
    <div class="kpi-tile">
      <div class="kpi-label">🚆 ${esc(tDict.kpiTransit)}</div>
      <div class="kpi-val">${esc(kpiTransitVal)}</div>
      <div class="kpi-sub">${esc(kpiTransitSub)}</div>
    </div>
    <div class="kpi-tile">
      <div class="kpi-label">🥾 ${esc(tDict.kpiHike)}</div>
      <div class="kpi-val">${esc(kpiHikeVal)}</div>
      <div class="kpi-sub">${esc(kpiHikeSub)}</div>
    </div>
    <div class="kpi-tile">
      <div class="kpi-label">⛰️ ${esc(tDict.kpiElev)}</div>
      <div class="kpi-val">${esc(kpiElevVal)}</div>
      <div class="kpi-sub">${esc(kpiElevSub)}</div>
    </div>
    <div class="kpi-tile">
      <div class="kpi-label">🕒 ${esc(tDict.kpiStay)}</div>
      <div class="kpi-val">${esc(kpiStayVal)}</div>
      <div class="kpi-sub">${esc(kpiStaySub)}</div>
    </div>
  </div>`;

  // Phase 5: Tagesplan (05–24h) midnight-safe timeline bar (non-button elements)
  const fwdDepAbs = toAbsMin(dep) ?? 480;
  const fwdArrAbs = fwdDepAbs + fwdDurMin;
  const revDepAbs = fwdArrAbs + stayMin;
  const revDurMin = rev.length ? Math.max(0, minDiff(revDep, arr)) : 0;
  const revArrAbs = revDepAbs + revDurMin;
  const clampTp = (s, e) => {
    const cs = Math.max(300, Math.min(1440, s));
    const ce = Math.max(cs, Math.min(1440, e));
    return {
      left: ((cs - 300) / 1140 * 100).toFixed(2),
      width: ((ce - cs) / 1140 * 100).toFixed(2),
      wraps: e > 1440
    };
  };
  const tpFwd = clampTp(fwdDepAbs, fwdArrAbs);
  const tpStay = clampTp(fwdArrAbs, revDepAbs);
  const tpRev = clampTp(revDepAbs, revArrAbs);
  const tpTicks = [5, 9, 13, 17, 21, 24].map((hr, idx, arrTicks) => {
    const pct = ((hr * 60 - 300) / 1140 * 100).toFixed(2);
    const attr = idx === 0 ? " data-first" : idx === arrTicks.length - 1 ? " data-last" : "";
    return `<span class="tp-tick" style="left:${pct}%"${attr}>${String(hr).padStart(2, "0")}</span>`;
  }).join("");
  const tpHtml = `<div class="tagesplan" aria-label="${esc(tDict.tagesplanTitle)}">
    <div class="tp-head">
      <span>${esc(tDict.tagesplanTitle)}</span>
      <span class="tp-span">${esc(dep)}–${esc(arr)}${tpRev.wraps ? " (+1)" : ""}</span>
    </div>
    <div class="tp-track">
      ${Number(tpFwd.width) > 0 ? `<div class="tp-seg tp-fwd" style="left:${tpFwd.left}%;width:${tpFwd.width}%" title="${esc(tDict.tpOutbound)}: ${esc(dep)}–${esc(fwdArr)}"></div>` : ""}
      ${Number(tpStay.width) > 0 ? `<div class="tp-seg tp-stay" style="left:${tpStay.left}%;width:${tpStay.width}%" title="${esc(tDict.tpStay)}: ${esc(fwdArr)}–${esc(revDep)}"></div>` : ""}
      ${Number(tpRev.width) > 0 ? `<div class="tp-seg tp-rev" style="left:${tpRev.left}%;width:${tpRev.width}%" title="${esc(tDict.tpReturn)}: ${esc(revDep)}–${esc(arr)}"></div>` : ""}

    <div class="tp-axis">${tpTicks}</div>
    <div class="tp-legend">
      <span class="tp-leg-item"><span class="tp-swatch fwd"></span>${esc(tDict.tpOutbound)} ${esc(fmtDur(fwdDurMin))}</span>
      <span class="tp-leg-item"><span class="tp-swatch stay"></span>${esc(tDict.tpStay)} ${esc(fmtDur(stayMin))}</span>
      <span class="tp-leg-item"><span class="tp-swatch rev"></span>${esc(tDict.tpReturn)} ${esc(fmtDur(revDurMin))}${tpRev.wraps ? " (+1)" : ""}</span>
    </div>
  </div>`;

  const winBtn = (w, i) => {
    const wDep = w[0]?.dep || "08:00";
    const wArr = w[w.length - 1]?.arr || "10:00";
    return `<button type="button" class="win-btn" data-win="${i}" aria-pressed="${i === winIdx}">${i === recIdx ? '<span class="star">⭐</span>' : ""}${esc(wDep)} → ${esc(wArr)}</button>`;
  };
  const otherWins = wins.map((w, i) => [w, i]).filter(([, i]) => i !== recIdx);
  const winsHtml = `<div class="win-label">${esc(tDict.recommended)}</div>
      <div class="win-row">${wins[recIdx] ? winBtn(wins[recIdx], recIdx) : ""}</div>
      ${otherWins.length ? `<div class="win-label">${esc(tDict.otherWindows)}</div><div class="win-row">${otherWins.map(([w, i]) => winBtn(w, i)).join("")}</div>` : ""}`;

  const stayPresets = [
    ["", "Auto"],
    ["90", "1,5 h"],
    ["120", "2 h"],
    ["180", "3 h"],
    ["240", "4 h"],
    ["300", "5 h"],
    ["360", "6 h"],
    ["max", "Max"]
  ];
  const curStayVal = state.revIdx !== null ? "__manual__" : (state.stayTargetMin === null ? "" : String(state.stayTargetMin));
  const stayBtnsHtml = stayPresets.map(([val, lbl]) =>
    `<button type="button" class="stay-btn" data-stay="${esc(val)}" aria-pressed="${curStayVal === val}">${esc(lbl)}</button>`
  ).join("");

  const revsHtml = (validRevs || []).map((r, i) => {
    const rDep = r[0]?.dep || "16:00";
    const rArr = r[r.length - 1]?.arr || "18:00";
    const rStay = minDiff(fwdArr, rDep);
    const isLsr = i === lsrIdx;
    const midEarly = hasMid && parseHHMM(rDep) !== null && parseHHMM(rDep) < midSt.earliestArr + MID_MIN_TRANSFER;
    const short = isShortReturn(t, rStay) || (midEarly ? -1 : 0);
    return `<button type="button" class="ret-btn${isLsr ? " lsr" : ""}${short ? " short" : ""}" data-ret="${i}" aria-pressed="${i === revIdx}"${short ? ` title="${esc(short < 0 ? tDict.midTooEarly : tDict.retTooShort(fmtDur(short)))}"` : ""}>${short ? "⚠️ " : ""}${isLsr ? `${esc(tDict.lsrTag)} ` : ""}${esc(rDep)} → ${esc(rArr)} <span class="ret-stay">${esc(Math.floor(rStay / 60) + ":" + String(rStay % 60).padStart(2, "0"))} h</span></button>`;
  }).join("");

  const shortStayWarn = (h.hasGpx && h.walkMin && stayMin > 0 && stayMin < Number(h.walkMin))
    ? `<div class="chips" style="margin-top:6px"><span class="chip warn">${esc(tDict.shortStayWarn(fmtDur(h.walkMin)))}</span></div>`

  const lsrDep = lsr?.dep || revDep;
  const lsrArr = lsr?.arr || arr;

  const fwdStepsHtml = fwd.map((s, i) => renderSegmentStep(s, i, fwd, 0)).join("");
  const revStepsHtml = rev.map((s, i) => renderSegmentStep(s, i, rev, fwd.length)).join("");

  const sunTxt = tourText("sun", t);
  const tipsTxt = tourText("tips", t);

  const loopFlowTxt = (destStop.name && endStop.name && destStop.name !== endStop.name)
    ? `${state.lang === "en" ? "Closed loop" : "Rundkurs"}: ${bInfo.name} → ${destStop.name} → 🥾 → ${endStop.name} → ${bInfo.name}`

  const fwdEndName = fwd[fwd.length - 1]?.to?.name || destStop.name || title;

  const compactOutHtml = compactLegHTML(fwd, 0, false);

  const gpxLabel = NATIVE ? tDict.gpxNative : tDict.gpxDownload;

  // Phase 6: Keep #appSheet links populated and updated in DOM on every renderDetail

  const lineBadges = segs => segs.filter(sg => sg.kind === "ride").map(sg => {

  const viaTxt = (hasTrack && Array.isArray(t.hike?.vias) && t.hike.vias.length) ? t.hike.vias.slice(0, 2).map(v => v.name || v).filter(Boolean).join(", ") : "";
  const segListHtml = segs => {

        if (gap > 0) rows.push(`<li class="ds-xfer"><span>↺ ${esc(tDict.transferGap(fmtDur(gap)))}</span></li>`);

      const col = MODE_COLORS[m] || "#0F4C5C";

      rows.push(`<li class="ds-ride" style="--c:${col}">

        <div class="ds-mid"><span class="badge mode-badge" style="background-color:${col};color:#ffffff">${ico} ${esc(lineLbl)}</span>${sg.dest ? `<span class="ds-dir">→ ${esc(sg.dest)}</span>` : ""}<span class="ds-dur">${esc(fmtDur(minDiff(sg.dep, sg.arr)))}</span></div>
        <div class="ds-stop"><time>${esc(sg.arr || "")}</time><span class="ds-name">${esc(toNm)}</span>${plat(sg.to)}</div>

    return `<ol class="dl-segs">${rows.join("")}</ol>`;
  };
  const expandable = segs => `<details class="dl-more"><summary><span class="dl-badges">${lineBadges(segs)}</span><span class="dl-toggle">${esc(tDict.showTimes)}</span></summary>${segListHtml(segs)}</details>`;
  const dayRows = [];
  if (fwd.length) dayRows.push({time: dep, name: fwd[0]?.from?.name || bInfo.name, html: expandable(fwd)});
  if (hasMid) {

  if (rev.length) dayRows.push({time: revDep, name: rev.find(sg => sg.from?.name)?.from?.name || "", html: `${expandable(rev)}${hasMid ? `<div class="dl-sub">${esc(midSt.conflict ? tDict.midConflictShort : tDict.midStay(fmtDur(minDiff(midSt.segs.slice(-1)[0].arr, revDep))))}</div>` : ""}`});
  if (rev.length) dayRows.push({time: arr, name: tDict.backIn(bInfo.name), html: `<div class="dl-sub">${esc(tDict.lastSafeReturnShort(lsrDep))}</div>`});
  const dayLineHtml = dayRows.length ? `<ol class="day-line">${dayRows.map(r => `<li class="${r.cls || ""}"><time>${esc(r.time)}</time><div class="dl-body"><strong>${esc(r.name)}</strong>${r.html}</div></li>`).join("")}</ol>` : "";
  const dayDateLbl = (() => {
    const d = new Date(linkDateIso(state.day) + "T12:00:00");
    if (isNaN(d)) return tDict.dayLong[state.day];
    const wd = d.toLocaleDateString(state.lang === "en" ? "en-GB" : "de-DE", {weekday: "short"}).replace(/\.$/, "");
    return state.lang === "en" ? `${wd} ${d.getDate()}/${d.getMonth() + 1}` : `${wd} ${String(d.getDate()).padStart(2, "0")}.${String(d.getMonth() + 1).padStart(2, "0")}.`;
  })();
  const favActive = isFav(t.id);

  const elevHtml = elevProfileHTML(t);
  const hasHikePage = hasKm || hasWalk || Boolean(elevHtml);
  const dtPages = [["tag", tDict.dtTabDay], ["fahrten", tDict.dtTabRides], ...(hasHikePage ? [["wandern", tDict.dtTabHike]] : []), ["info", tDict.dtTabInfo]];
  const hikeFacts = [
    hasKm ? `${kmStr} km` : "",
    hmUp ? `↗ ${hmUp} hm` : "",
    hmDown ? `↘ ${hmDown} hm` : "",
    hasWalk ? `${tDict.dtWalkTime} ${fmtDur(h.walkMin)}` : ""
  ].filter(Boolean);

  $("#detail").innerHTML = `
    <div class="dt-top" id="dtTop">
    <div class="detail-map-slot" id="detailMapSlot"></div>
    <div class="dt-legbar">
      <div class="leg-toggle leg-toggle-inline" role="group" aria-label="${esc(tDict.legToggleLbl)}">
        ${[["all", tDict.legAll], ["out", tDict.legOut], ["ret", tDict.legRet]].map(([k, lbl]) => `<button type="button" data-leg="${k}" aria-pressed="${(state.mapLegFilter || "all") === k}">${esc(lbl)}</button>`).join("")}
      </div>
      <span class="dt-legbar-info">${hasKm ? `🥾 ${esc(kmStr)} km${hmUp ? ` · ↗ ${hmUp} hm` : ""}` : ""}</span>
      <button type="button" class="dt-pin" id="dtPinBtn" aria-pressed="${Boolean(state.mapPinned)}" aria-label="${esc(state.mapPinned ? tDict.mapUnpin : tDict.mapPin)}" title="${esc(state.mapPinned ? tDict.mapUnpin : tDict.mapPin)}"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l-1 6 4 4H6l4-4z"/><path d="M12 13v8"/></svg></button>
    </div>
    </div>

    <div class="dt-head">
      <div class="dt-title">
        <h2>${esc(title)}</h2>
        <div class="dt-meta">${isDone(t.id) ? `<span class="dt-done">✓ ${esc(tDict.doneChip || "Gemacht")}</span> · ` : ""}${esc(regLbl)} · ${esc(diffLbl)} · ${esc(loopBadge)}</div>
      </div>
      <button type="button" class="hero-fab hero-fab-done" id="detailDoneBtn" data-done-id="${esc(t.id)}" aria-pressed="${isDone(t.id)}" aria-label="${esc(isDone(t.id) ? tDict.doneRemove : tDict.doneAdd)}" title="${esc(isDone(t.id) ? tDict.doneRemove : tDict.doneAdd)}"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
      <button type="button" class="hero-fab" id="detailFavBtn" data-fav-id="${esc(t.id)}" aria-pressed="${favActive}" aria-label="${esc(favActive ? tDict.detailFavSaved : tDict.detailFavAdd)}" title="${esc(favActive ? tDict.detailFavSaved : tDict.detailFavAdd)}"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button>
    </div>

    <div class="dt-tabs" id="dtTabs" role="tablist">
      ${dtPages.map(([k, lbl], i) => `<button type="button" role="tab" data-page="${k}" aria-selected="${i === 0}" aria-controls="dtPage-${k}">${esc(lbl)}</button>`).join("")}
    </div>

    <div class="dt-pager" id="dtPager">
      <section class="dt-page" id="dtPage-tag" data-page="tag" role="tabpanel">
        ${fallback ? `<div class="box"><span class="chip warn">${esc(tDict.unroutableNotice(reason))}</span></div>` : ""}
        ${kpiHtml}
        <div class="box day-flow-box">
          <div class="box-head"><h4>${esc(tDict.yourDay(dayDateLbl))}</h4><a class="box-link" href="#detailTimes" data-a="times">${esc(tDict.changeTimes)}</a></div>
          ${dayLineHtml}
      ${sharedTripsFor(t.id).map(st => `<div class="shared-trip" data-shared-id="${esc(st.id)}">
        <div class="box-head"><h4>📲 ${esc(st.role === "ret" ? tDict.sharedRet : tDict.sharedOut)} · ${esc(st.dep)}–${esc(st.arr)}</h4>${st.link ? `<a class="box-link" href="${esc(sharedTripLiveUrl(st))}" target="_blank" rel="noopener">${esc(tDict.sharedLive)}</a>` : ""}</div>
        <details class="dl-more"><summary><span class="dl-badges">${lineBadges(st.legs)}</span><span class="dl-toggle">${esc(tDict.showTimes)}</span></summary>${sharedTripTimelineHTML(st)}</details>
        <button type="button" class="link-btn shared-del" data-shared-del="${esc(st.id)}">${esc(tDict.sharedRemove)}</button>
      </div>`).join("")}
        </div>
        <div class="hero-cta-row">
          <button type="button" class="act primary" id="startTripBtn">${esc(tripActiveHere ? tDict.openTripBtn : tDict.startTripBtn)}</button>
        </div>
      </section>

      <section class="dt-page" id="dtPage-fahrten" data-page="fahrten" role="tabpanel">
      <div class="box schedule-box" id="detailTimes">
        <h4>${esc(tDict.changeTimes)}</h4>
        <div class="detail-bar-slot" id="detailBarSlot"></div>
        <h4 class="sub-h">${esc(tDict.windowsTitle)} · ${esc(tDict.dayLong[state.day])}</h4>
        ${tpHtml}
        ${winsHtml}
        <h4 style="margin-top:10px">⏱ ${esc(tDict.stayChooserTitle)}</h4>
        <div class="stay-row">${stayBtnsHtml}</div>
        ${revsHtml ? `<h4 style="margin-top:10px">🔄 ${esc(tDict.returnWindowsTitle)}</h4><div class="stay-row">${revsHtml}</div>` : ""}
        ${shortStayWarn}
        <div class="chips" style="margin-top:8px">
          <span class="chip ok">🛡️ ${esc(tDict.lastSafeReturn(lsrDep, lsrArr))}</span>
        </div>
      </div>

        <div class="box day-flow-box">
      <h4 class="sub-h">${esc(tDict.flowTitle)}</h4>
      <div class="day-flow">
        ${compactOutHtml}
        <div class="flow-node">
          <div>📍 <strong>${esc(tDict.flowArr)} ${esc(fwdArr)}</strong> · ${esc(fwdEndName)}${fwdEndPlat ? ` (${esc(tDict.platform)} ${esc(fwdEndPlat)})` : ""}</div>
        </div>
        ${hasMid ? `${midSt.chosen.map((it, k) => compactLegHTML(it, fwd.length + rev.length + k, false, tDict.midLegTitle)).join("")}${midSt.conflict ? `<div class="chips"><span class="chip warn">${esc(tDict.midConflict(midSt.to?.name || "", fmtHHMMabs(midSt.earliestArr)))}</span></div>` : ""}` : (midSt && midSt.missing ? `<div class="flow-node flow-hike"><div>🚆 <strong>${esc(tDict.midMissingTitle)}</strong></div><div class="flow-node-sub">${esc(tDict.midMissing(fwdEndName, rev[0]?.from?.name || ""))}</div></div>` : `<div class="flow-node flow-hike">
          <div>🥾 <strong>${esc(tDict.hikeStayTitle)} (${esc(fmtDur(stayMin))})</strong></div>
          <div class="flow-node-sub">${hasKm ? `${kmStr} km · ↗ ${hmUp} hm` : tDict.walkLabel} · ${esc(loopFlowTxt)}</div>
        </div>`)}
        ${compactRetHtml}
      </div>
      ${totalLegs > 0 ? `<details class="tl-details">
        <summary>${esc(tDict.detailsAllLegs(totalLegs))}</summary>
        <div class="tl-details-body">
          <h4>${esc(tDict.outboundTitle)} (${esc(dep)} → ${esc(fwdArr)})</h4>
          <div class="tl">${fwdStepsHtml}</div>
          <h4 style="margin-top:10px">${esc(tDict.returnTitle)} (${esc(revDep)} → ${esc(arr)})</h4>
          <div class="tl">${revStepsHtml}</div>
        </div>
      </details>` : ""}
        </div>
      </section>

      ${hasHikePage ? `<section class="dt-page" id="dtPage-wandern" data-page="wandern" role="tabpanel">
        ${elevHtml}
        <div class="box hike-box">
          <h4>🥾 ${esc(tDict.hikeStayTitle)} (${esc(fmtDur(stayMin))})</h4>
          ${hikeFacts.length ? `<div class="hike-facts">${hikeFacts.map(x => `<span>${esc(x)}</span>`).join("")}</div>` : ""}
          <p class="hike-route">${esc(fwdEndName)}${rev.find(sg => sg.from?.name)?.from?.name && rev.find(sg => sg.from?.name).from.name !== fwdEndName ? ` → ${esc(rev.find(sg => sg.from?.name).from.name)}` : ""} · ${esc(loopFlowTxt)}</p>
        </div>
      </section>` : ""}

      <section class="dt-page" id="dtPage-info" data-page="info" role="tabpanel">
        <div class="hero">
          <div class="hero-media">
            <img class="hero-img" src="${esc(imgSrc)}" alt="${esc(title)}" decoding="async">
            ${creditHTML(t)}
          </div>
          <div class="chips">${doneChipHTML(t.id)}${metaChips.join("")}</div>
          <p>${esc(sub)}</p>
        </div>
    ${t.source === "user" ? `<div class="box user-tour-box"><p>${esc(tDict.userTourNote)}</p><button type="button" class="link-btn" data-user-del="${esc(t.id)}">${esc(tDict.userTourDelete)}</button></div>` : ""}

        ${(sunTxt || tipsTxt) ? `<div class="box">
          ${sunTxt ? `<p style="margin:0 0 6px;font-size:12.5px">☀️ ${esc(sunTxt)}</p>` : ""}
          ${tipsTxt ? `<p style="margin:0;font-size:12.5px">💡 ${esc(tipsTxt)}</p>` : ""}
        </div>` : ""}

      </section>
    </div>

    <div class="detail-sticky-bar" id="detailStickyBar">
      <button type="button" class="act" id="openAppSheetBtn">
        <span>${esc(tDict.connectBtn)}</span>
        <span class="sticky-app-pill">${esc(prefMeta.short)}</span>
      </button>
      <a class="act primary" href="${esc(mapyUrl)}" target="_blank" rel="noopener" data-app="mapy">${esc(mapyLabel)}</a>
      <button type="button" class="act" id="gpxBtn" data-a="gpx">${esc(gpxLabel)}</button>
    </div>
  `;
}

$("#detail").addEventListener("pointermove", onElevPointer);
$("#detail").addEventListener("pointerdown", onElevPointer);

$("#detail").addEventListener("click", e => {
  const t = BY_ID[state.sel];
  if (!t) return;
  const sharedDel = e.target.closest("[data-shared-del]");
  if (sharedDel) {
    state.sharedTrips = state.sharedTrips.filter(x => x.id !== sharedDel.dataset.sharedDel);
    saveSharedTrips();
    renderDetail(t);
    return;
  }
  const userDel = e.target.closest("[data-user-del]");
  if (userDel) {
    if (window.confirm(T().userTourDeleteConfirm)) deleteUserTour(userDel.dataset.userDel);
    return;
  }
  if (e.target.closest("#detailDoneBtn")) {
    e.stopPropagation();
    toggleDone(t.id);
    renderDetail(t);
    return;
  }
  const favBtn = e.target.closest("#detailFavBtn, .fav-btn[data-fav-id]");
  if (favBtn) {
    e.stopPropagation();
    toggleFav(favBtn.dataset.favId || t.id);
    return;
  }
  if (e.target.closest("#startTripBtn")) {
    startTrip(t);
    return;
  }
  if (e.target.closest("#openAppSheetBtn")) {
    if (state.directOpen && openPreferredApp()) return;
    openAppSheet();
    return;
  }
  const timesLink = e.target.closest("[data-a='times']");
  if (timesLink) {
    e.preventDefault();
    dtShowPage("fahrten", {target: "#detailTimes"});
    return;
  }
  if (e.target.closest("#dtPinBtn")) {
    setMapPinned(!state.mapPinned);
    return;
  }
  const legBtn = e.target.closest(".dt-legbar button[data-leg]");
  if (legBtn) {
    setLegFilter(legBtn.dataset.leg);
    return;
  }

/* ===================== Import: geteilte Verbindungen (RegioNavigator/München Navigator) & Mapy-GPX ===================== */

/* --- RegioNavigator / HAFAS share text ---
   12:37 - departure Jugenheim Bickenbacher Straße, Seeheim-Jugenheim
         with STR 6 to Alsbach Am Hinkelstein, Alsbach-Hähnlein
   12:38 - arrival Alsbach Beuneweg, Alsbach-Hähnlein
   12:54 - Walk to Bickenbach(Bergstr), duration 3 min
   (German UI: Abfahrt / Ankunft / mit … Richtung … / Fußweg …, Dauer … Min.) */
function hafasModeOf(line) {
  const l = String(line || "").trim();
  if (/^(STR|Tram)\b/i.test(l)) return "tram";
  if (/^(Bus|RUF|ALT|AST)\b/i.test(l)) return "bus";
  if (/^S\s?\d/i.test(l)) return "sbahn";
  if (/^RE\s?\d/i.test(l)) return "re";
  if (/^(RB|R)\s?\d/i.test(l)) return "rb";
  if (/^U\s?\d/i.test(l)) return "tram";
  if (/^(ICE|IC|EC|FLX)\b/i.test(l)) return "rail";
  return /^\d+$/.test(l) ? "bus" : "rb";
}
function splitPlatform(s) {
  const m = String(s || "").match(/^(.*?),\s*(?:Platform|Gleis|Steig|Bstg\.?)\s+(.+)$/i);
  return m ? {name: m[1].trim(), platform: m[2].trim()} : {name: String(s || "").trim(), platform: ""};
}
function parseHafasShare(text) {
  const lines = String(text || "").split(/\r?\n/);
  const legs = [];
  let cur = null;
  const depRx = /^\s*(\d{1,2}:\d{2})\s*-\s*(?:departure|Abfahrt|ab)\s+(.+?)\s*$/i;
  const arrRx = /^\s*(\d{1,2}:\d{2})\s*-\s*(?:arrival|Ankunft|an)\s+(.+?)\s*$/i;
  const withRx = /^\s*(?:with|mit)\s+(.+?)\s+(?:to|nach|Richtung|in Richtung)\s+(.+?)\s*$/i;
  const walkRx = /^\s*(\d{1,2}:\d{2})\s*-\s*(?:Walk to|Fußweg (?:zu|nach|bis)|Fussweg (?:zu|nach))\s+(.+?),\s*(?:duration|Dauer)\s+(\d+)\s*(?:min|Min\.?)/i;
  for (const ln of lines) {
    let m;
    if ((m = ln.match(walkRx))) {
      const to = splitPlatform(m[2]);
      const dep = m[1].padStart(5, "0");
      const durMin = parseInt(m[3], 10) || 0;
      const t0 = parseHHMM(dep);
      legs.push({kind: "walk", mode: "foot", line: "", dep, arr: t0 !== null ? fmtHHMMabs(t0 + durMin) : dep, from: {name: legs.length ? legs[legs.length - 1].to.name : ""}, to: {name: to.name}});
      cur = null;
    } else if ((m = ln.match(depRx))) {
      const st = splitPlatform(m[2]);
      cur = {kind: "ride", dep: m[1].padStart(5, "0"), from: {name: st.name, platform: st.platform}, line: "", dest: "", mode: "rb", arr: "", to: {name: ""}};
    } else if (cur && (m = ln.match(withRx))) {
      cur.line = m[1].trim();
      cur.dest = m[2].trim();
      cur.mode = hafasModeOf(cur.line);
    } else if (cur && (m = ln.match(arrRx))) {
      const st = splitPlatform(m[2]);
      cur.arr = m[1].padStart(5, "0");
      cur.to = {name: st.name, platform: st.platform};
      legs.push(cur);
      cur = null;
    }
  }
  if (!legs.some(l => l.kind === "ride")) return null;
  const link = (String(text).match(/https?:\/\/\S+/) || [""])[0];
  const app = /RegioNavigator/i.test(text) ? "RegioNavigator" : /München Navigator|MVV/i.test(text) ? "München Navigator" : "Fahrplan-App";
  return {legs, link, app, dep: legs[0].dep, arr: legs[legs.length - 1].arr, from: legs[0].from.name, to: legs[legs.length - 1].to.name};
}

/* --- DB Navigator share text ---
   Jugenheim Bickenbacher Straße, Seeheim-Jugenheim → Bahnhof, Dossenheim
   Tue 24.11.2026
   RB68 (15309)
   To Wiesloch-Walldorf
   From 08:48 Hähnlein-Alsbach, Platform 1
   To 09:11 Weinheim(Bergstr)Hbf, Platform 3
   (German: Richtung/Nach …, Ab/Von HH:MM …, An/Bis HH:MM …, Gleis …) */
function parseDbShare(text) {
  const lines = String(text || "").split(/\r?\n/).map(l => l.trim());
  const dateM = String(text).match(/\b(\d{1,2})\.(\d{1,2})\.(\d{4})\b/);
  const legs = [];
  const fromRx = /^(?:From|Ab|Von)\s+(\d{1,2}:\d{2})\s+(.+)$/i;
  const toTimeRx = /^(?:To|An|Bis|Nach)\s+(\d{1,2}:\d{2})\s+(.+)$/i;
  const dirRx = /^(?:To|Richtung|Nach|Direction)\s+(?!\d{1,2}:\d{2}\b)(.+)$/i;
  let line = "", dir = "", cur = null;
  for (let i = 0; i < lines.length; i++) {
    const ln = lines[i];
    let m;
    if (!ln) { line = ""; dir = ""; cur = null; continue; }
    if ((m = ln.match(fromRx))) {
      const st = splitPlatform(m[2]);
      cur = {kind: "ride", line, mode: hafasModeOf(line), dest: dir, dep: m[1].padStart(5, "0"), from: {name: st.name, platform: st.platform}, arr: "", to: {name: ""}};
    } else if (cur && (m = ln.match(toTimeRx))) {
      const st = splitPlatform(m[2]);
      cur.arr = m[1].padStart(5, "0");
      cur.to = {name: st.name, platform: st.platform};
      legs.push(cur);
      cur = null;
    } else if (line && !dir && (m = ln.match(dirRx))) {
      dir = m[1].trim();
    } else if (!line && !/→|https?:|^(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun|Mo|Di|Mi|Do|Fr|Sa|So)\b/i.test(ln) && !/^(View journey|Verbindung anzeigen|Reise anzeigen)/i.test(ln)) {
      line = ln.replace(/\s*\(\d+\)\s*$/, "").split(/\s*\/\s*/)[0].trim();
    }
  }
  if (!legs.length) return null;
  const link = (String(text).match(/https?:\/\/\S+/) || [""])[0];
  const date = dateM ? `${dateM[3]}-${dateM[2].padStart(2, "0")}-${dateM[1].padStart(2, "0")}` : "";
  return {legs, link, app: "DB Navigator", date, dep: legs[0].dep, arr: legs[legs.length - 1].arr, from: legs[0].from.name, to: legs[legs.length - 1].to.name};
}

/* --- saved connections --- */
function loadSharedTrips() {

}

}
function normStop(s) {
  return String(s || "").toLowerCase().replace(/\(.*?\)/g, " ").replace(/[^a-zäöüß0-9]+/g, " ").replace(/\b(bahnhof|bf|hbf|hauptbahnhof)\b/g, "bf").trim();
}
function stopsMatch(a, b) {
  const x = normStop(a), y = normStop(b);
  if (!x || !y) return false;
  if (x === y) return true;
  const tx = new Set(x.split(" ").filter(w => w.length >= 2)), ty = [...new Set(y.split(" ").filter(w => w.length >= 2))];
  const common = ty.filter(w => tx.has(w)).length;
  return common >= Math.min(2, Math.min(tx.size, ty.length));

/* tours whose outbound end / return start matches the shared connection */
function suggestToursForTrip(trip) {
  // outbound: the connection ends where a tour's outbound ends; return: it starts where the tour's return starts.
  // Home bases never count as a match (360° rings start and end there).
  const bases = ["jugenheim", "karlsruhe"].map(k => getBaseInfo(k)).map(b => b.stopName || b.name);
  const isBase = n => bases.some(b => stopsMatch(n, b));
  const out = [];
  for (const t of TOURS) {
    const w = getSelectedWindow(t, state.base, state.day);
    const fwdEnd = w.fwd[w.fwd.length - 1]?.to?.name;
    const revStart = w.rev[0]?.from?.name;
    if (fwdEnd && !isBase(fwdEnd) && stopsMatch(trip.to, fwdEnd)) out.push({t, role: "out"});
    else if (revStart && !isBase(revStart) && stopsMatch(trip.from, revStart)) out.push({t, role: "ret"});
  }
  return out.slice(0, 6);
}
function sharedTripsFor(tourId) {

}

/* in-app link to reopen the connection live in the HAFAS app */

/* --- GPX (Mapy export) → own tour --- */
function decodePolyP(str, precision) {
  const f = Math.pow(10, precision || 5);
  const pts = [];
  let i = 0, lat = 0, lon = 0;
  while (i < str.length) {
    let b, sh = 0, r = 0;
    do { b = str.charCodeAt(i++) - 63; r |= (b & 0x1f) << sh; sh += 5; } while (b >= 0x20);
    lat += (r & 1) ? ~(r >> 1) : (r >> 1);
    sh = 0; r = 0;
    do { b = str.charCodeAt(i++) - 63; r |= (b & 0x1f) << sh; sh += 5; } while (b >= 0x20);
    lon += (r & 1) ? ~(r >> 1) : (r >> 1);
    pts.push([lat / f, lon / f]);
  }
  return pts;
}
function encodePoly5(pts) {
  let out = "", pLat = 0, pLon = 0;
  const enc = v => {
    v = v < 0 ? ~(v << 1) : (v << 1);
    let s = "";
    while (v >= 0x20) { s += String.fromCharCode((0x20 | (v & 0x1f)) + 63); v >>= 5; }
    return s + String.fromCharCode(v + 63);
  };
  for (const [la, lo] of pts) {
    const a = Math.round(la * 1e5), b = Math.round(lo * 1e5);
    out += enc(a - pLat) + enc(b - pLon);
    pLat = a; pLon = b;
  }
  return out;
}
function hysteresisGainLoss(eles, th) {
  if (!eles.length) return [0, 0];
  let gain = 0, loss = 0, st = 0, low = eles[0], high = eles[0];
  for (const e of eles.slice(1)) {
    if (st === 0) {
      if (e - low >= th) { st = 1; high = e; gain += e - low; }
      else if (high - e >= th) { st = -1; low = e; loss += high - e; }
      if (e < low) low = e;
      if (e > high) high = e;
    } else if (st === 1) {
      if (e > high) { gain += e - high; high = e; }
      else if (high - e >= th) { st = -1; low = e; loss += high - e; }
    } else {
      if (e < low) { loss += low - e; low = e; }
      else if (e - low >= th) { st = 1; high = e; gain += e - low; }
    }
  }
  return [Math.round(gain), Math.round(loss)];
}
/* Swiss SAC hiking time – identical to scripts/build_catalog.calc_walk_min */
function sacWalkMin(km, up, down) {
  const h = km / 4.0, v = up / 400.0 + down / 800.0;
  return Math.ceil((Math.max(h, v) + 0.5 * Math.min(h, v)) * 60);
}
function parseGpx(xml, fileName) {
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  if (doc.querySelector("parsererror")) return null;
  let nodes = [...doc.getElementsByTagName("trkpt")];
  if (nodes.length < 2) nodes = [...doc.getElementsByTagName("rtept")];
  const pts = nodes.map(n => [parseFloat(n.getAttribute("lat")), parseFloat(n.getAttribute("lon")), parseFloat(n.getElementsByTagName("ele")[0]?.textContent)])
    .filter(p => isFinite(p[0]) && isFinite(p[1]));
  if (pts.length < 2) return null;
  const nameEl = doc.querySelector("trk > name, rte > name, metadata > name");
  let name = (nameEl && nameEl.textContent.trim()) || String(fileName || "").replace(/\.gpx$/i, "");
  const m = name.match(/^Route from (.+?) to (.+)$/i);
  if (m) name = `${m[1].replace(/_/g, ",")} → ${m[2].replace(/_/g, ",")}`;
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + haversineM(pts[i - 1], pts[i]) / 1000);
  const distKm = Math.round(cum[cum.length - 1] * 100) / 100;
  const hasEle = pts.some(p => isFinite(p[2]));
  const [up, down] = hasEle ? hysteresisGainLoss(pts.map(p => isFinite(p[2]) ? p[2] : 0), 3) : [0, 0];
  const step = Math.max(1, Math.floor(pts.length / 400));
  const poly = pts.filter((_, i) => i % step === 0 || i === pts.length - 1).map(p => [p[0], p[1]]);
  const prof = [];
  if (hasEle) {
    const n = Math.min(30, pts.length);
    for (let k = 0; k < n; k++) {
      const i = Math.round(k * (pts.length - 1) / (n - 1));
      prof.push([Math.round(cum[i] * 100) / 100, Math.round(pts[i][2] || 0)]);
    }
  }
  return {name, distKm, up, down, walkMin: sacWalkMin(distKm, up, down), poly5: encodePoly5(poly), prof, start: pts[0], end: pts[pts.length - 1]};
}
function regionOfCoord(lat, lon) {   // scripts/build_catalog.region_from_coord
  if (lat >= 49.72 && lon < 8.60) return "weitere";
  if (lat >= 49.76 && lon > 9.15) return "weitere";
  if (lon <= 8.40 && lat >= 49.00 && lat <= 49.68) return lon >= 7.60 ? "pfaelzerwald" : "weitere";
  if (lat <= 48.98 && lon >= 7.80) return "schwarzwald";
  if (lon >= 8.55 && lat >= 49.30 && lat <= 49.82) return "odenwald";
  return "weitere";

/* --- Transitous (live, CORS open): nearest stop and connections --- */
const TRANSITOUS = "https://api.transitous.org/api/v1";
const TRANSIT_MODES = "REGIONAL_RAIL,REGIONAL_FAST_RAIL,SUBURBAN,METRO,TRAM,BUS,FERRY,ODM";
async function nearestStop(lat, lon) {
  const r = await fetch(`${TRANSITOUS}/reverse-geocode?place=${lat},${lon}&type=STOP`);
  const arr = r.ok ? await r.json() : [];
  const best = (arr || []).map(s => ({s, d: haversineM([lat, lon], [s.lat, s.lon])})).sort((a, b) => a.d - b.d)[0];
  return best ? {stop: {name: best.s.name, lat: best.s.lat, lon: best.s.lon, transitousId: best.s.id}, distM: Math.round(best.d)} : null;
}
function berlinHHMM(iso) {
  return new Intl.DateTimeFormat("de-DE", {timeZone: "Europe/Berlin", hour: "2-digit", minute: "2-digit", hour12: false}).format(new Date(iso));
}
function motisMode(leg) {
  const m = String(leg.mode || "").toUpperCase();
  const l = String(leg.routeShortName || "");
  if (m === "WALK") return "foot";
  if (m === "BUS" || m === "COACH" || m === "ODM") return "bus";
  if (m === "TRAM" || m === "METRO" || m === "SUBWAY") return "tram";
  if (m === "SUBURBAN") return "sbahn";
  if (m === "FERRY") return "ferry";
  return /^RE/i.test(l) ? "re" : "rb";
}
function motisItinToSegs(it) {
  return (it.legs || []).map(lg => {
    const mode = motisMode(lg);
    const pts = lg.legGeometry && lg.legGeometry.points ? decodePolyP(lg.legGeometry.points, parseInt(lg.legGeometry.precision || "7", 10)) : [];
    const stop = x => ({name: x.name === "START" || x.name === "END" ? "" : x.name, lat: x.lat, lon: x.lon, platform: x.track || x.scheduledTrack || ""});
    return {
      kind: mode === "foot" ? "walk" : "ride", mode,
      line: /^\d/.test(lg.routeShortName || "") && (mode === "bus" || mode === "tram") ? `${mode === "bus" ? "Bus" : "Tram"} ${lg.routeShortName}` : (lg.routeShortName || ""),
      lineName: lg.routeShortName || "",
      dep: berlinHHMM(lg.startTime), arr: berlinHHMM(lg.endTime), from: stop(lg.from || {}), to: stop(lg.to || {}),
      dest: lg.headsign || "", transfer: null, warnings: [], intermediateStops: [], legs: pts.length >= 2 ? [{p: pts}] : []
    };
  }).filter(s => !(s.kind === "walk" && s.from.name && s.from.name === s.to.name));
}
async function motisPlan(from, to, dateIso, startUtcHour, windowSec) {
  const time = `${dateIso}T${String(startUtcHour).padStart(2, "0")}:00:00Z`;
  const url = `${TRANSITOUS}/plan?fromPlace=${from.lat},${from.lon}&toPlace=${to.lat},${to.lon}&time=${time}&transitModes=${TRANSIT_MODES}&minTransferTime=4&searchWindow=${windowSec}&numItineraries=10&maxPreTransitTime=1500&maxPostTransitTime=1500`;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`Transitous ${r.status}`);
  const d = await r.json();
  const seen = new Set();
  return (d.itineraries || []).map(motisItinToSegs).filter(s => s.length && s.some(x => x.kind === "ride"))
    .filter(s => { const k = s.map(x => x.dep + x.line).join("|"); if (seen.has(k)) return false; seen.add(k); return true; })
    .sort((a, b) => (parseHHMM(a[0].dep) ?? 0) - (parseHHMM(b[0].dep) ?? 0));
}
/* live plan for an own tour (same shape as hydrated planner plans) */
async function buildLivePlan(t, baseKey, dayKey) {
  const b = getBaseInfo(baseKey);
  const dateIso = linkDateIso(dayKey);
  // plan from/to the track ends themselves: Transitous picks the nearest stop that is actually served (+ walk)
  const sc = t.hike && t.hike.startCoord, ec = t.hike && t.hike.endCoord;
  const ss = sc ? {lat: sc[0], lon: sc[1]} : t.transit.startStop;
  const es = ec ? {lat: ec[0], lon: ec[1]} : t.transit.endStop;
  const [fwd, rev] = await Promise.all([
    motisPlan(b, ss, dateIso, 5, 8 * 3600),       // 06:00–14:00 (CET)
    motisPlan(es, b, dateIso, 9, 12 * 3600)       // 10:00–22:00
  ]);
  if (!fwd.length || !rev.length) return {fallback: true, reason: T().importNoConn, fwd: [], rev: [], alts_fwd: [], alts_rev: []};
  // coordinate ends have no stop name: base / track ends get readable names

  const fwdArr = parseHHMM(fwd[fi][fwd[fi].length - 1].arr) ?? 600;
  let ri = rev.findIndex(it => (parseHHMM(it[0].dep) ?? 0) >= fwdArr + wmin + 30);
  if (ri < 0) ri = rev.length - 1;

    fwd: fwd[fi], rev: rev[ri], alts_fwd: fwd, alts_rev: rev, recFwdIdx: fi, recRevIdx: ri, fallback: false, reason: "",

}
async function ensureLivePlan(t) {
  if (!t || t.source !== "user") return;
  t.plans = t.plans || {};
  t.plans[state.base] = t.plans[state.base] || {};
  const base = state.base, day = state.day;
  const cur = t.plans[base][day];
  if (cur && (cur.fwd?.length || cur.tried || cur.loading)) return;   // one live request per base/day
  t.plans[base][day] = {fallback: true, loading: true, reason: T().importLoading, fwd: [], rev: [], alts_fwd: [], alts_rev: []};
  try {
    const p = await buildLivePlan(t, base, day);
    p.tried = true;
    t.plans[base][day] = p;
  } catch (e) {
    t.plans[base][day] = {fallback: true, tried: true, reason: T().importOffline, fwd: [], rev: [], alts_fwd: [], alts_rev: []};
  }
  if (state.sel === t.id) { renderDetail(t); drawSingle(t); } else renderList();
}

async function importGpxTour(xml, fileName) {
  const tDict = T();
  const g = parseGpx(xml, fileName);
  if (!g) { toast(tDict.importBadGpx); return; }
  toast(tDict.importWorking);
  let s0 = null, s1 = null;
  try {
    [s0, s1] = await Promise.all([nearestStop(g.start[0], g.start[1]), nearestStop(g.end[0], g.end[1])]);
  } catch (e) {}
  if (!s0 || !s1) { toast(tDict.importOffline); return; }
  const id = `user-${Date.now().toString(36)}`;
  const ring = haversineM(g.start, g.end) < 300;
  const t = {
    id, source: "user", region: regionOfCoord(g.start[0], g.start[1]), category: "eigene", ring,
    difficulty: g.walkMin < 90 && g.up < 250 ? "leicht" : (g.walkMin > 180 || g.up > 500 ? "schwer" : "mittel"),
    title: {de: g.name, en: g.name},
    subtitle: {de: tDict.importSub(s0.stop.name, s1.stop.name), en: tDict.importSub(s0.stop.name, s1.stop.name)},
    places: [s0.stop.name, s1.stop.name],
    transit: {kind: "gpx_linked", startStop: s0.stop, endStop: s1.stop, vias: [], walkToStartM: s0.distM, walkFromEndM: s1.distM},
    hike: {hasGpx: true, distKm: g.distKm, elevGainM: g.up, elevLossM: g.down, walkMin: g.walkMin, poly5: g.poly5, elevProfile: g.prof,
      startCoord: [g.start[0], g.start[1]], endCoord: [g.end[0], g.end[1]]},
    durationMin: g.walkMin + 240, plans: {}, importedAt: new Date().toISOString()
  };
  t.img = USER_TOUR_IMG;
  TOURS.push(t);
  BY_ID[id] = t;
  saveUserTours();
  toast(tDict.importDone(g.name));
  openTour(id);
  ensureLivePlan(t);
}
function deleteUserTour(id) {

/* ---------- Navigation (with history: Android back gesture closes the detail view) ---------- */
let suppressPopUntil = 0;

/* Back from a tour page: put the list back exactly where it was (same card at the same height on screen). */
function viewCards() {
  const root = state.tab === "gemerkt" ? $("#savedView") : $("#list");
  return root ? [...root.querySelectorAll(".card[data-id], .saved-card[data-saved-id]")] : [];
}
const cardId = c => c.dataset.id || c.dataset.savedId;
function listAnchorFor(id) {
  if (state.tab !== "entdecken" && state.tab !== "gemerkt") return null;
  const cards = viewCards().filter(c => c.offsetParent !== null);
  const pick = cards.find(c => cardId(c) === id && (() => { const r = c.getBoundingClientRect(); return r.bottom > 0 && r.top < innerHeight; })())
    || cards.find(c => c.getBoundingClientRect().bottom > 80);
  return pick ? {id: cardId(pick), top: pick.getBoundingClientRect().top, tab: state.tab} : null;
}
function restoreListPosition(anchor, y) {
  let lastSet = null, userMoved = false;
  const stop = () => { userMoved = true; };
  window.addEventListener("touchstart", stop, {once: true, passive: true});
  window.addEventListener("wheel", stop, {once: true, passive: true});
  const apply = () => {
    if (userMoved || state.sel || (anchor && anchor.tab !== state.tab)) return;
    if (lastSet !== null && Math.abs(window.scrollY - lastSet) > 2) return;   // scrolled in between
    const c = anchor && viewCards().find(x => cardId(x) === anchor.id && x.offsetParent !== null);
    const target = c ? window.scrollY + c.getBoundingClientRect().top - anchor.top : y;
    if (target > 0) window.scrollTo({top: target, behavior: "instant"});
    lastSet = window.scrollY;
  };
  requestAnimationFrame(apply);
  setTimeout(apply, 120);
  setTimeout(apply, 400);
  setTimeout(() => {
    window.removeEventListener("touchstart", stop);
    window.removeEventListener("wheel", stop);
  }, 450);
}

function openTour(id, opts) {
  const t = BY_ID[id];
  if (!t) return;
  if (!state.sel) {
    state.returnScrollY = window.scrollY || 0;
    state.returnAnchor = listAnchorFor(id);
    if (state.tab === "karte") {
      state.savedMapView = {center: map.getCenter(), zoom: map.getZoom()};
    }
  }
  const mw = $("#mapWrap");
  if (mw) mw.classList.remove("full", "mini", "menu-open");
  $("#layerMenu")?.classList.remove("show");
  document.body.classList.remove("map-full-open");
  const sheet = $("#mapSheet");
  if (sheet) sheet.hidden = true;

  if (state.sel !== id) {
    state.detailPage = "tag";
    state.dtTourId = null;
  }
  state.mapLegFilter = "all";
  document.querySelectorAll(".leg-toggle button[data-leg]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.leg === "all")));
  state.sel = id;
  state.winIdx = null;
  state.revIdx = null;
  document.body.classList.add("detail-open");
  renderHeader();
  renderTabViews();
  renderDetail(t);
  drawSingle(t);
  setTimeout(() => { map.invalidateSize(); fitCurrent(); }, 0);
  fitCurrent();
  window.scrollTo({top: 0});
  if (!(opts && opts.fromPop)) {
    try {
      const st = {tour: id};
      const url = "#tour=" + encodeURIComponent(id);
      if (history.state && history.state.tour) history.replaceState(st, "", url);
      else history.pushState(st, "", url);
    } catch (e) {}
  }
}

function closeTour(opts) {
  closeAppSheet({clear: true});
  state.mapLegFilter = "all";
  state.dtTourId = null;
  document.querySelectorAll(".leg-toggle button[data-leg]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.leg === "all")));
  state.sel = null;
  state.winIdx = null;
  state.revIdx = null;
  document.body.classList.remove("detail-open");
  renderHeader();
  renderTabViews();
  const sheet = $("#mapSheet");
  if (state.tab === "karte") {
    if (sheet) sheet.hidden = false;
    const saved = state.savedMapView;
    state.savedMapView = null;
    drawOverview();
    const restoreKarte = () => {
      map.invalidateSize();
      if (saved && saved.center) map.setView(saved.center, saved.zoom, {animate: false});
      else fitCurrent();
      renderMapSheet();
    };
    restoreKarte();
    setTimeout(() => { if (state.tab === "karte" && !state.sel) restoreKarte(); }, 150);
  } else if (state.tab === "entdecken") {
    if (sheet) sheet.hidden = true;
    renderList();
    drawOverview();
    setTimeout(() => { map.invalidateSize(); fitCurrent(); }, 0);
    fitCurrent();
    restoreListPosition(state.returnAnchor, state.returnScrollY);
    state.returnScrollY = 0;
    state.returnAnchor = null;
  } else {
    if (sheet) sheet.hidden = true;
    if (state.tab === "gemerkt") restoreListPosition(state.returnAnchor, state.returnScrollY);
    state.returnScrollY = 0;
    state.returnAnchor = null;
  }
  if (!(opts && opts.fromPop)) {
    try {
      if (history.state && history.state.tour) {
        suppressPopUntil = Date.now() + 800;
        history.back();
      }
    } catch (e) {}
  }
}

// The app restores list positions itself (restoreListPosition); the browser's own restore would jump to 0.
try { if ("scrollRestoration" in history) history.scrollRestoration = "manual"; } catch (e) {}

window.addEventListener("popstate", e => {
  if (Date.now() < suppressPopUntil) { suppressPopUntil = 0; return; }
  const st = e.state;
  if (st && st.tour && BY_ID[st.tour]) openTour(st.tour, {fromPop: true});
  else if (state.sel) closeTour({fromPop: true});
});

/* Called by the native Android app on the system back gesture; returns true if the app handled it. */
window.swHandleBack = function () {
  if ($("#homeModal").classList.contains("show")) { closeHomeModal(); return true; }
  if ($("#appSheet")?.classList.contains("show")) { closeAppSheet(); return true; }
  const mw = $("#mapWrap");
  if (mw.classList.contains("full")) {
    mw.classList.remove("full");
    document.body.classList.remove("map-full-open");
    setTimeout(() => {
      map.invalidateSize();
      if (state.tab === "karte" && !state.sel) renderMapSheet();
    }, 150);
    return true;
  }
  if ($("#layerMenu").classList.contains("show")) {
    $("#layerMenu").classList.remove("show");
    mw.classList.remove("menu-open");
    return true;
  }
  if (state.sel) { closeTour(); return true; }
  if (state.tab === "karte" && !state.sel && state.mapFocusId) {
    setMapFocus(null);
    return true;
  }
  if (state.tab === "karte" && state.mapSheetSnap === "expanded") {
    setMapSheetSnap("half");
    return true;
  }
  if (state.tab !== "entdecken") {
    setTab("entdecken");
    return true;
  }
  if (state.filtersOpen && window.innerWidth < 960) { state.filtersOpen = false; syncFilterPanel(); return true; }
  return false;
};

  if (e.target === $("#homeModal")) closeHomeModal();
});

$("#homePresets").addEventListener("click", e => {
  const b = e.target.closest(".home-preset-btn");
  if (!b) return;
  const name = b.dataset.name;
  const lat = parseFloat(b.dataset.lat);
  const lon = parseFloat(b.dataset.lon);
  const bKey = b.dataset.base || (name.toLowerCase().includes("karlsruhe") ? "karlsruhe" : "jugenheim");
  setBase(bKey, {name, lat, lon});
  closeHomeModal();
});

async function runNominatimSearch() {
  const q = ($("#homeSearchInput").value || "").trim();
  const box = $("#geoResults");
  if (q.length < 2) {
    box.innerHTML = "";
    return;
  }
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=5`);
    if (!r.ok) { box.innerHTML = ""; return; }
    const items = await r.json();
    if (!Array.isArray(items) || !items.length) {
      box.innerHTML = `<div style="font-size:12px;color:var(--muted)">${state.lang === "en" ? "No results found" : "Keine Treffer"}</div>`;
      return;
    }
    box.innerHTML = items.map(it => {
      const nm = it.display_name || it.name || q;
      return `<button type="button" class="geo-item" data-name="${esc(nm)}" data-lat="${it.lat}" data-lon="${it.lon}">${esc(nm)}</button>`;
    }).join("");
  } catch (err) {
    box.innerHTML = "";
  }
}

$("#homeSearchBtn").addEventListener("click", runNominatimSearch);
$("#homeSearchInput").addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); runNominatimSearch(); }
});

$("#geoResults").addEventListener("click", e => {
  const b = e.target.closest(".geo-item[data-lat]");
  if (!b) return;
  const lat = parseFloat(b.dataset.lat);
  const lon = parseFloat(b.dataset.lon);
  const name = b.dataset.name || "Home";
  if (!Number.isNaN(lat) && !Number.isNaN(lon)) {
    HOME = {name, lat, lon};
    store.set("home", HOME);
    renderHeader();
    closeHomeModal();
  }
});

$("#homeGpsBtn").addEventListener("click", () => {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(pos => {
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;
    const name = state.lang === "en" ? `GPS Location (${lat.toFixed(3)}, ${lon.toFixed(3)})` : `GPS-Standort (${lat.toFixed(3)}, ${lon.toFixed(3)})`;
    HOME = {name, lat, lon};
    store.set("home", HOME);
    renderHeader();
    closeHomeModal();
  }, () => {}, {timeout: 5000});
});

$("#saveHomeBtn").addEventListener("click", () => {
  const name = ($("#customHomeName").value || "").trim() || HOME.name;
  const lat = parseFloat($("#customHomeLat").value);
  const lon = parseFloat($("#customHomeLon").value);
  if (Number.isNaN(lat) || Number.isNaN(lon) || lat < 45 || lat > 56 || lon < 4 || lon > 17) {
    toast(state.lang === "en" ? "Invalid coordinates" : "Ungültige Koordinaten");
    return;
  }
  HOME = {name, lat, lon};
  store.set("home", HOME);
  renderHeader();
  closeHomeModal();
});

$("#resetHomeBtn").addEventListener("click", () => {
  HOME = {...BASE_DEFAULTS[state.base]};
  store.set("home", HOME);
  renderHeader();
  closeHomeModal();
});

/* ---------- Boot ---------- */
if (location.search.includes("base=karlsruhe")) {
  state.base = "karlsruhe";
  HOME = {...BASE_DEFAULTS.karlsruhe};
}
if (window.matchMedia && window.matchMedia("(min-width: 960px)").matches) state.filtersOpen = true;
document.body.dataset.tab = state.tab;
applyTheme();
setLayer(state.layer);
renderHeader();
renderDays();
renderPills();
renderBottomNav();
renderTabViews();
renderList();
drawOverview();
setTimeout(fitCurrent, 50);
if (!NATIVE && state.activeTrip && state.activeTrip.reminder) {
  armInPageReminder(state.activeTrip.reminder);
}
(function bootDeepLink() {
  const m = location.hash.match(/^#tour=([^&]+)/);
  if (!m) return;
  const id = decodeURIComponent(m[1]);
  if (!BY_ID[id]) return;
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  openTour(id);
})();
if (window.matchMedia) {
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  const onScheme = () => { if (!state.theme) applyTheme(); };
  if (mq.addEventListener) mq.addEventListener("change", onScheme);
}
if (NATIVE && typeof NATIVE.contentReady === "function") {
  requestAnimationFrame(() => { try { NATIVE.contentReady(performance.now()); } catch (e) {} });
}
if (!NATIVE && state.activeTrip && state.activeTrip.reminder) armInPageReminder(state.activeTrip.reminder);

if (/[?&]share=1\b/.test(location.search) && "caches" in window) {
  history.replaceState(null, "", location.pathname);
  caches.open("suedwest-share").then(c => c.match(new URL("./__shared__", location.href).href).then(r => {
    if (!r) return;
    c.delete(new URL("./__shared__", location.href).href);
    return r.json().then(p => setTimeout(() => window.swHandleShared(p), 400));
  })).catch(() => {});
}

if (!NATIVE && "serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  let hadController = Boolean(navigator.serviceWorker.controller);
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController) { hadController = true; return; }
    toast(T().updateReady, {label: T().reload, action: () => location.reload(), ms: 12000});
  });
}
</script>
</body>
</html>
